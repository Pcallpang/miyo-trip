<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDF3E7">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="야르미요 여행">
  <link rel="stylesheet" href="styles.css">
  <title>야르미요의 여행 플래너</title>
  <meta name="description" content="일정·경비·준비물·날씨를 한 곳에 모으는 여행 플래너. 로그인도 설치도 없이 브라우저에서 바로 쓰고, 비행기 안에서도 열립니다. 여행 정보는 서버가 아니라 내 기기에만 저장됩니다.">
  <link rel="canonical" href="https://miyo-trip.vercel.app/">

  <!-- 링크를 카톡·슬랙에 붙였을 때 펼쳐지는 미리보기. og:image는 절대 주소여야
       한다 — 상대 경로로 두면 대부분의 서비스가 그림을 못 찾는다. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="야르미요의 여행 플래너">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://miyo-trip.vercel.app/">
  <meta property="og:title" content="야르미요의 여행 플래너">
  <meta property="og:description" content="일정·경비·준비물·날씨를 한 곳에. 로그인도 설치도 없이 바로 쓰는 여행 플래너입니다.">
  <meta property="og:image" content="https://miyo-trip.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="야르미요의 여행 플래너 — 일정·경비·준비물·날씨를 한 곳에">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="야르미요의 여행 플래너">
  <meta name="twitter:description" content="일정·경비·준비물·날씨를 한 곳에. 로그인도 설치도 없이 바로 쓰는 여행 플래너입니다.">
  <meta name="twitter:image" content="https://miyo-trip.vercel.app/og-image.png">
</head>
<body>
  <section id="screen-list" hidden>
    <header class="lhead">
      <img src="assets/miyo/yarr-miyo.webp" alt=""><h1>내 여행</h1>
    </header>
    <div id="triplist"></div>
    <div class="lactions">
      <button id="new-trip" type="button">+ 새 여행 만들기</button>
      <button id="add-sample" type="button">샘플 여행 보기</button>
    </div>
    <p class="lfoot"><a href="privacy.html">개인정보처리방침</a></p>
  </section>

  <section id="screen-share" hidden></section>

  <section id="screen-trip" hidden>
    <header id="summary"></header>
    <div id="tab-day">
      <nav id="daytabs"></nav>
      <main id="timeline"></main>
    </div>
    <div id="tab-panel"></div>
    <nav id="tabbar"></nav>
  </section>

  <section id="screen-edit" hidden></section>

  <script src="sample-trip.js"></script>
  <script src="store.js"></script>
  <script src="schema.js"></script>
  <script src="cities.js"></script>
  <script src="country-info.js"></script>
  <script src="money.js"></script>
  <script src="remote.js"></script>
  <script src="views.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
