<meta charset="utf-8">
<title>capture harness</title>
<style>
  html,body{margin:0;padding:0;background:#101010;}
  /* 창(뷰포트)이 607px밖에 안 돼 840px 폰 화면이 한 번에 안 들어간다.
     390x840을 2배로 그린 뒤 560px씩 3조각으로 잘라 찍고 PIL에서 잇는다. */
  #win{width:780px;height:560px;overflow:hidden;position:relative;background:#FDF3E7;}
  #f{width:390px;height:840px;border:0;position:absolute;top:0;left:0;
     transform-origin:0 0;}
</style>
<div id="win"><iframe id="f"></iframe></div>
<script>
  const f = document.getElementById('f'), win = document.getElementById('win');
  // off: 아이프레임 CSS px 기준 세로 오프셋. scale(2)가 뒤에 곱해져 화면에선 2배로 움직인다.
  window.slice = function (off) { f.style.transform = 'scale(2) translateY(' + (-off) + 'px)'; };
  // 해시만 바꾸면 load 이벤트가 안 떠서 promise가 영영 안 풀린다 —
  // 쿼리에 난수를 붙여 매번 진짜 재적재시킨다.
  window.go = function (hash) {
    return new Promise(function (res) {
      f.onload = function () {
        // 스크롤바가 찍히면 폰 화면처럼 안 보인다. 같은 오리진이라 주입할 수 있다.
        try {
          const d = f.contentDocument, s = d.createElement('style');
          s.textContent = '::-webkit-scrollbar{width:0;height:0;display:none}' +
            'html{scrollbar-width:none}';
          d.head.appendChild(s);
        } catch (e) {}
        setTimeout(res, 1500);
      };
      f.src = 'http://localhost:8731/index.html?_=' + Math.random() + hash;
    });
  };
  // 스크린샷 픽셀과 CSS px 비율이 1이 아니다(1425/1389). 잘라낼 위치를 정확히
  // 알려면 실제 사각형과 innerWidth를 함께 넘겨 PIL에서 환산한다.
  window.bounds = function () {
    const r = win.getBoundingClientRect();
    return JSON.stringify({ x: r.left, y: r.top, w: r.width, h: r.height, iw: innerWidth });
  };
  window.slice(0);
</script>
