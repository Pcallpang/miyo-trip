<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7285">
<meta name="color-scheme" content="light">
<title>여행 플래너</title>
<style>
:root { color-scheme:light; --bg:#f5f7f9; --card:#fff; --accent:#0b7285; --accent2:#e8590c; --text:#1a2226; --muted:#6b7780; }
* { box-sizing:border-box; }
html { background:var(--bg); }
body { margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; line-height:1.5; }
#summary { background:var(--accent); color:#fff; padding:20px 16px; }
/* 56px는 ⚙ 버튼(right:14px) 하나만 셈한 값이었다. 편집 버튼(.edit-mode, right:52px)까지
   더하면 왼쪽 끝이 오른쪽에서 대략 98px 지점에서 시작하므로, 긴 D-day 문자열이 그
   버튼 밑으로 파고들지 않게 두 버튼을 함께 감안한 여백을 준다.
   왼쪽에는 목록으로 돌아가는 버튼(.back-list) 하나뿐이라 40px면 충분하다. */
#summary h1 { margin:4px 0; font-size:1.5rem; padding-right:100px; padding-left:40px; }
#summary .dday { font-weight:700; opacity:.9; padding-right:100px; padding-left:40px; }
#summary .period,#summary .hotel,#summary .cost { font-size:.9rem; opacity:.95; margin-top:2px; }
#daytabs { display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
  position:sticky; top:0; background:var(--bg); z-index:5; -webkit-overflow-scrolling:touch; }
.tab { flex:0 0 auto; border:1px solid #d5dde1; background:var(--card); border-radius:12px;
  padding:6px 12px; display:flex; flex-direction:column; align-items:center; font:inherit; color:var(--muted); }
.tab[data-selected] { background:var(--accent); color:#fff; border-color:var(--accent); }
.tab .tn { font-weight:700; font-size:.85rem; }
.tab .td { font-size:.7rem; }
.daycard { background:var(--card); margin:12px; border-radius:14px; overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.06); }
.dayhead { padding:14px 16px; border-bottom:1px solid #eef2f4; }
.dayhead .dnum { font-weight:700; color:var(--accent); }
.dayhead .dtheme { color:var(--muted); font-size:.85rem; margin-top:3px; }
.slot { display:flex; gap:10px; padding:12px 16px; border-bottom:1px solid #f0f3f5; }
.slot:last-child { border-bottom:0; }
.slot .time { flex:0 0 46px; font-weight:700; color:var(--accent); font-size:.85rem; }
.slot .what .line { font-size:.9rem; }
.slot .what .line + .line { margin-top:2px; }
.line.timed, .line.booked { display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  font-weight:700; border-radius:8px; padding:7px 10px; margin:4px 0; }
.line.timed { background:#fff0f0; color:#c92a2a; border-left:4px solid #e03131; }
.line.booked { background:#e9fbf3; color:#0b7043; border-left:4px solid #0ca678; }
.line .tag { flex:none; font-size:.72rem; font-weight:800; color:#fff;
  border-radius:999px; padding:2px 8px; letter-spacing:.02em; }
.line.timed .tag { background:#e03131; }
.line.booked .tag { background:#0ca678; }
#timeline .empty { color:var(--muted); text-align:center; font-size:.88rem;
  margin:0; padding:26px 16px; }
.slot.undecided { background:#fff4e6; }
.slot.undecided .time { color:var(--accent2); }
#fixed { margin:12px; }
#fixed details { background:var(--card); border-radius:12px; margin-bottom:10px; overflow:hidden; }
#fixed summary { padding:14px 16px; font-weight:600; cursor:pointer; list-style:none; }
#fixed summary::-webkit-details-marker { display:none; }
#fixed summary::after { content:"▾"; float:right; color:var(--muted); }
#fixed details[open] summary::after { content:"▴"; }
.acc { padding:0 16px 14px; font-size:.9rem; }
.tblwrap { overflow-x:auto; margin-top:8px; }
.acc table { border-collapse:collapse; width:100%; font-size:.85rem; }
.acc caption { text-align:left; font-weight:600; color:var(--muted); padding:4px 0; }
.acc th,.acc td { border-bottom:1px solid #eef2f4; padding:6px 8px; text-align:left; }
.acc td.num,.acc th.num { text-align:right; white-space:nowrap; }
.acc tfoot td { font-weight:700; }
.acc ul { margin:8px 0 0; padding-left:18px; }
.packlist { list-style:none; padding:0; margin:8px 0 0; }
.packlist li { padding:6px 0; display:flex; align-items:center; gap:6px; }
.packlist li label { flex:1; display:flex; align-items:center; }
.packlist li.done label { text-decoration:line-through; color:var(--muted); }
.packlist input[type=checkbox] { transform:scale(1.2); margin-right:8px; }
.pack-del { flex:0 0 auto; border:none; background:#f1f3f5; color:var(--muted);
  width:26px; height:26px; border-radius:50%; font-size:1.1rem; line-height:1; cursor:pointer; }
.pack-add { display:flex; gap:6px; margin-top:10px; }
.pack-add input { flex:1; padding:8px 10px; border:1px solid #d5dde1; border-radius:8px; font:inherit; }
.pack-add button { flex:0 0 auto; padding:8px 14px; border:none; border-radius:8px;
  background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
.meals { padding:12px 16px; border-top:1px solid #eef2f4; background:#fff9f2; }
.meals-h { font-weight:700; color:var(--accent2); margin-bottom:8px; }
.meal { margin-bottom:12px; }
.meal:last-child { margin-bottom:0; }
.meal-note .line { font-size:.9rem; }
.memo { display:block; width:100%; margin-top:6px; padding:8px 10px;
  border:1px solid #ffd8a8; border-radius:8px; font:inherit; background:#fff; }
#summary .cost .spent { display:inline-block; opacity:.95; }
.stotal { font-size:1.35rem; font-weight:800; color:var(--accent); margin-top:8px; }
.stotal .skrw { font-size:.85rem; font-weight:600; color:var(--muted); }
.scats { list-style:none; padding:0; margin:10px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
.scats li { font-size:.78rem; background:#f1f5f7; border-radius:999px; padding:4px 10px; color:var(--muted); }
.scats li b { color:var(--text); }
.spend-add { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
.spend-add input,.spend-add select { padding:8px 10px; border:1px solid #d5dde1;
  border-radius:8px; font:inherit; min-width:0; }
.spend-add .sjpy-in { flex:0 0 90px; }
.spend-add .snote-in { flex:1 1 110px; }
.spend-add .scat-in { flex:0 0 auto; background:#fff; }
.spend-add button { flex:0 0 auto; padding:8px 14px; border:none; border-radius:8px;
  background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
.sgroup { margin-top:12px; }
.sdate { font-size:.78rem; font-weight:700; color:var(--muted); padding-bottom:4px;
  border-bottom:1px solid #eef2f4; }
.slist { list-style:none; padding:0; margin:0; }
.slist li { display:flex; align-items:center; gap:8px; padding:8px 0;
  border-bottom:1px solid #f4f7f8; }
.slist .scat { flex:0 0 auto; font-size:.72rem; font-weight:700; color:#fff;
  background:var(--accent); border-radius:999px; padding:2px 8px; }
.slist .snote { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slist .sjpy { flex:0 0 auto; font-weight:700; white-space:nowrap; }
.spend-del { flex:0 0 auto; border:none; background:#f1f3f5; color:var(--muted);
  width:26px; height:26px; border-radius:50%; font-size:1.1rem; line-height:1; cursor:pointer; }
.sempty { color:var(--muted); padding:10px 0; }
.sfx { margin-top:14px; font-size:.82rem; color:var(--muted); }
.sfx input { width:70px; padding:5px 8px; border:1px solid #d5dde1; border-radius:6px;
  font:inherit; text-align:right; }
#summary .wx { font-size:.9rem; opacity:.95; margin-top:2px; }
.dayhead .dwx { font-size:.85rem; color:var(--muted); margin-top:2px; }
.wxstamp { font-size:.75rem; opacity:.75; }

/* ---- 여행 목록 화면 ---- */
.lhead { background:var(--accent); color:#fff; padding:20px 16px; }
.lhead h1 { margin:0; font-size:1.4rem; }
#triplist { padding:12px; }
.tripcard { position:relative; background:var(--card); border-radius:14px; padding:14px 16px;
  margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); cursor:pointer; }
.tripcard .tc-title { font-weight:700; font-size:1.05rem; }
.tripcard .tc-period { color:var(--muted); font-size:.85rem; margin-top:2px; }
.tripcard .tc-dday { color:var(--accent); font-weight:700; font-size:.8rem; margin-top:4px; }
.tripcard .tc-del { position:absolute; top:10px; right:10px; border:0; background:none;
  color:var(--muted); font-size:1.2rem; line-height:1; padding:4px 8px; cursor:pointer; }
#triplist .empty { color:var(--muted); text-align:center; padding:32px 16px; }
.lactions { display:flex; flex-direction:column; gap:8px; padding:0 12px 24px; }
.lactions button { font:inherit; padding:12px; border-radius:12px; border:1px solid #d5dde1;
  background:var(--card); color:var(--text); cursor:pointer; }
.lactions #new-trip { background:var(--accent); color:#fff; border-color:var(--accent);
  font-weight:700; }

#summary { position:relative; }
.back-list { position:absolute; top:16px; left:14px; border:0; background:rgba(255,255,255,.18);
  color:#fff; font-size:1.05rem; line-height:1; padding:7px 10px; border-radius:10px; cursor:pointer; }
.edit-trip { position:absolute; top:16px; right:14px; border:0; background:rgba(255,255,255,.18);
  color:#fff; font-size:1.05rem; line-height:1; padding:7px 10px; border-radius:10px; cursor:pointer; }
.ehead { background:var(--accent); color:#fff; padding:16px; display:flex; align-items:center; gap:10px; }
.ehead h1 { margin:0; font-size:1.2rem; }
.ehead button { border:0; background:none; color:#fff; font-size:1.3rem; cursor:pointer; padding:0 4px; }
.eform { display:flex; flex-direction:column; gap:14px; padding:16px; }
.eform label { display:flex; flex-direction:column; gap:5px; font-size:.85rem; color:var(--muted); }
.eform input, .eform textarea, .eform select { font:inherit; color:var(--text);
  padding:10px; border:1px solid #d5dde1; border-radius:10px; background:var(--card); }
.eform button[type=submit] { font:inherit; font-weight:700; padding:13px; border:0;
  border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
.eerr { background:#fff0f0; color:#c92a2a; border-left:4px solid #e03131;
  padding:9px 12px; border-radius:8px; font-size:.85rem; }

.edit-mode { position:absolute; top:16px; right:52px; border:0; background:rgba(255,255,255,.18);
  color:#fff; font-size:.8rem; font-weight:700; line-height:1; padding:8px 10px;
  border-radius:10px; cursor:pointer; }
.edit-mode[aria-pressed=true] { background:#fff; color:var(--accent); }
.slot-btns { display:flex; gap:6px; margin-top:6px; }
.slot-btns button { font:inherit; font-size:.75rem; padding:4px 10px; border-radius:8px;
  border:1px solid #d5dde1; background:var(--card); color:var(--muted); cursor:pointer; }
.slot-btns .it-del { color:#c92a2a; border-color:#ffc9c9; }
.item-add { display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; border-top:1px dashed #dde4e8; }
.item-add .ia-time { flex:0 0 110px; }
.item-add .ia-text { flex:1 1 100%; }
.item-add input, .item-add textarea { font:inherit; padding:9px; border:1px solid #d5dde1;
  border-radius:10px; background:var(--card); color:var(--text); }
.item-add button { font:inherit; font-weight:700; padding:9px 16px; border:0; border-radius:10px;
  background:var(--accent); color:#fff; cursor:pointer; }
#tabbar { position:fixed; left:0; right:0; bottom:0; z-index:10;
  display:flex; background:var(--card); border-top:1px solid #dde4e8;
  padding-bottom:env(safe-area-inset-bottom); }
#tabbar .tb { flex:1; border:0; background:none; font:inherit; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:8px 2px 6px; color:var(--muted); }
#tabbar .tb[data-selected] { color:var(--accent); font-weight:700; }
#tabbar .tb-i { font-size:1.15rem; line-height:1.1; }
#tabbar .tb-l { font-size:.7rem; }
/* 하단 고정 바에 마지막 항목이 가리지 않도록 본문에 여백을 준다. */
#screen-trip { padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
#tab-panel { padding:12px; }
.panel-card { background:var(--card); border-radius:14px; padding:14px 16px;
  margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.panel-h { margin:0 0 8px; font-size:.9rem; color:var(--accent); }
#tab-panel .empty { color:var(--muted); text-align:center; padding:32px 16px; }
#tab-panel details { background:var(--card); border-radius:14px; margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.06); overflow:hidden; }
#tab-panel summary { padding:14px 16px; font-weight:700; cursor:pointer; }
.geo-block { display:flex; flex-direction:column; gap:6px; }
.geo-lbl { font-size:.85rem; color:var(--muted); }
.geo-hint { font-weight:400; }
.geo-cur { font-size:.95rem; color:var(--text); }
.geo-cur .geo-none { color:var(--muted); }
.geo-row { display:flex; gap:8px; }
.geo-row input { flex:1; font:inherit; color:var(--text);
  padding:10px; border:1px solid #d5dde1; border-radius:10px; background:var(--card); }
.geo-row button { font:inherit; padding:10px 14px; border:1px solid #d5dde1;
  border-radius:10px; background:var(--card); color:var(--text); cursor:pointer; }
.geo-row button[disabled] { opacity:.5; cursor:default; }
.geo-list { list-style:none; margin:0; padding:0; border:1px solid #d5dde1;
  border-radius:10px; overflow:hidden; background:var(--card); }
.geo-list li { padding:10px 12px; cursor:pointer; border-bottom:1px solid #eef2f4; }
.geo-list li:last-child { border-bottom:0; }
.geo-list li:hover { background:#f1f5f7; }
.geo-msg { font-size:.85rem; color:var(--muted); }
.daycity-block { display:flex; flex-direction:column; gap:6px; }
.daycity-list { list-style:none; margin:0; padding:0; border:1px solid #d5dde1;
  border-radius:10px; overflow:hidden; background:var(--card); }
.daycity-list li { display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-bottom:1px solid #eef2f4; font-size:.9rem; }
.daycity-list li:last-child { border-bottom:0; }
.daycity-list .dc-n { flex:0 0 52px; font-weight:700; color:var(--accent); font-size:.82rem; }
.daycity-list .dc-p { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.daycity-list button { flex:0 0 auto; font:inherit; font-size:.78rem; padding:4px 10px;
  border:1px solid #d5dde1; border-radius:8px; background:var(--card); color:var(--muted); cursor:pointer; }
.dayhead .daycity { display:inline-block; font-size:.78rem; font-weight:700; color:#fff;
  background:var(--accent2); border-radius:999px; padding:2px 9px; margin-top:4px; }

</style>
</head>
<body>
<section id="screen-list" hidden>
<header class="lhead"><h1>내 여행</h1></header>
<div id="triplist"></div>
<div class="lactions">
<button id="new-trip" type="button">+ 새 여행 만들기</button>
<button id="add-sample" type="button">샘플 여행 보기</button>
</div>
</section>
<section id="screen-trip" hidden>
<header id="summary"></header>
<div id="tab-day">
<nav id="daytabs"></nav>
<main id="timeline"></main>
</div>
<div id="tab-panel"></div>
<nav id="tabbar"></nav>
</section>
<section id="screen-edit" hidden></section>

<script>
// 저장소 계층: 여행 목록·본체·여행별 런타임 키(trip:<id>:*)를 다룬다.
// app.js의 기존 osaka-trip:v1: store와는 무관한 새 코드다.

var SCHEMA = 1;

function lsGet(key, fb) {
  try {
    var v = localStorage.getItem(key);
    return v === null ? fb : JSON.parse(v);
  } catch (e) { return fb; }
}
// 쓰기 성공 여부를 boolean으로 돌려준다. 예외가 안 났다는 것만으론 부족하다 —
// 일부 환경(프라이빗 모드 등)은 setItem이 조용히 no-op일 수 있으므로 읽어서 확인한다.
function lsSet(key, v) {
  try {
    var s = JSON.stringify(v);
    localStorage.setItem(key, s);
    return localStorage.getItem(key) === s;
  } catch (e) { return false; }
}
function lsDel(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}

function newTripId() {
  return "t_" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
}

function tripKey(id, k) { return "trip:" + id + ":" + k; }

function tripStore(id) {
  return {
    get: function (k, fb) { return lsGet(tripKey(id, k), fb); },
    set: function (k, v) { return lsSet(tripKey(id, k), v); }
  };
}

function listTrips() {
  var v = lsGet("trip:index", []);
  return Array.isArray(v) ? v : [];
}

// 본체(큰 쓰기)와 인덱스(작은 쓰기)를 나눠 쓴다. 용량 초과 등으로 본체 쓰기만 실패하고
// 인덱스 쓰기는 성공하는 경우(실제로 재현됨), 인덱스만 갱신되고 본체는 예전 값 그대로
// 남으면 목록과 본체가 서로 다른 얘기를 하게 된다(새 여행이면 목록에 loadTrip이 null인
// 고아 항목이 생기고, 수정이면 목록엔 새 제목/날짜가 보이는데 본체는 예전 값). 그래서
// 본체 쓰기가 실패하면 인덱스는 아예 건드리지 않는다.
function saveTrip(trip) {
  var okBody = lsSet("trip:" + trip.id, trip);
  if (!okBody) return false;
  var idx = listTrips();
  var row = { id: trip.id, title: trip.title, start: trip.start, end: trip.end };
  var at = -1;
  idx.forEach(function (r, i) { if (r.id === trip.id) at = i; });
  if (at >= 0) idx[at] = row; else idx.push(row);
  return lsSet("trip:index", idx);
}

function loadTrip(id) {
  return lsGet("trip:" + id, null);
}

// 일정 항목(추가·수정·삭제) 전용 저장. 인덱스 행(id/title/start/end)은 항목 편집으로
// 바뀌지 않으므로 본체만 쓴다 — saveTrip처럼 인덱스까지 같이 쓰면, 실제로는 본체 저장이
// 성공했는데 인덱스 쓰기만(용량 초과 등으로) 실패한 경우에도 saveTrip이 false를 돌려줘
// 정상 반영된 편집을 실패로 취급해버린다. 본체만 쓰면 그 모호함 자체가 없어진다.
function saveTripBody(trip) {
  return lsSet("trip:" + trip.id, trip);
}

// 여행 본체 + 그 여행의 런타임 키(trip:<id>:*) + 인덱스 항목을 모두 지운다.
function deleteTrip(id) {
  lsDel("trip:" + id);
  var prefix = tripKey(id, "");
  var doomed = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf(prefix) === 0) doomed.push(k);
  }
  doomed.forEach(lsDel);
  lsSet("trip:index", listTrips().filter(function (r) { return r.id !== id; }));
}

var LEGACY_PREFIX = "osaka-trip:v1:";
var LEGACY_KEYS = ["spend", "fx", "packing_checked", "packing_add", "weather"];

function cloneSample() {
  return JSON.parse(JSON.stringify(window.SAMPLE_TRIP));
}

// 저장에 성공하면 새 여행 id, 실패하면 null. 다른 쓰기 경로(submitTripForm,
// afterItemEdit)와 동일하게 성공 여부를 호출부에 넘긴다 — 여기서 삼키면 저장이
// 실패해도 화면은 존재하지 않는 여행으로 이동했다가 목록으로 되튕길 뿐이라
// 사용자에게 실패가 전혀 드러나지 않는다.
function installSample() {
  var t = cloneSample();
  t.id = newTripId();
  return saveTrip(t) ? t.id : null;
}

// ---- 식사 메모 키: 일차 번호 → 날짜 ----
// meal 메모는 원래 meal:<n>:<i>로 저장됐는데, resyncDays는 날짜를 기준으로 일차를
// 보존하면서 n을 1부터 다시 매긴다. 그래서 시작일을 하루 앞당기기만 해도 모든 n이
// 밀려 메모가 엉뚱한 날에 붙거나(meals가 없는 날로 밀리면) 아예 화면에서 사라진다.
// 날짜는 그 일차의 안정된 식별자이므로 meal:<date>:<i>로 다시 키를 잡는다.

// trip.days에서 { 일차번호: 날짜 } 표를 만든다.
function dayDateByN(trip) {
  var m = {};
  var days = (trip && Array.isArray(trip.days)) ? trip.days : [];
  days.forEach(function (d) {
    if (d && typeof d.date === 'string' && d.date) m[String(d.n)] = d.date;
  });
  return m;
}

// 구 키(meal:<숫자>:<i>)를 새 키(meal:<날짜>:<i>)로 옮긴다. 옮길 필요가 없거나
// 옮길 수 없으면 null:
//  - meal: 로 시작하지 않는 키
//  - 가운데 조각이 숫자가 아닌 키 = 이미 날짜 기준이다(YYYY-MM-DD에는 '-'가 있다).
//    이 판정 덕분에 마이그레이션을 몇 번을 돌려도 두 번째부터는 아무 것도 하지 않는다.
//  - 그 번호에 해당하는 일차가 없는 여행(고아 메모는 건드리지 않고 남겨 둔다)
function mealMigrateKey(sub, byN) {
  var m = /^meal:([0-9]+):(.+)$/.exec(String(sub));
  if (!m) return null;
  var date = byN[m[1]];
  return date ? ("meal:" + date + ":" + m[2]) : null;
}

// 저장된 모든 여행의 구 식사 메모 키를 한 번 옮긴다. 여러 번 불러도 안전하다
// (위 mealMigrateKey가 이미 날짜 기준인 키를 걸러낸다). 새 키 쓰기가 실패하면
// 구 키를 지우지 않으므로 다음 부팅에 그대로 재시도된다. 옮긴 키 개수를 돌려준다.
function stripBuiltinSections(sections) {
  if (!Array.isArray(sections)) return [];
  return sections.filter(function (s) { return !s || s.type !== "builtin"; });
}

// 내장 섹션은 하단 탭이 됐으므로 데이터에서 걷어낸다. 재실행해도 안전하다
// (걸러낼 게 없으면 길이가 같아 쓰기를 건너뛴다).
function migrateSections() {
  var changed = 0;
  listTrips().forEach(function (row) {
    var trip = loadTrip(row.id);
    if (!trip) return;
    var next = stripBuiltinSections(trip.sections);
    if (next.length === (trip.sections || []).length) return;
    trip.sections = next;
    if (saveTripBody(trip)) changed++;
  });
  return changed;
}

function migrateMealKeys() {
  var moved = 0;
  listTrips().forEach(function (row) {
    var trip = loadTrip(row.id);
    if (!trip) return;
    var byN = dayDateByN(trip);
    var prefix = tripKey(row.id, "meal:");
    var found = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) found.push(k);
    }
    found.forEach(function (k) {
      var sub = k.slice(tripKey(row.id, "").length);
      var nk = mealMigrateKey(sub, byN);
      if (!nk || nk === sub) return;
      var target = tripKey(row.id, nk);
      // 이미 날짜 기준 값이 있으면 그쪽이 최신이다 — 구 키만 치운다.
      if (localStorage.getItem(target) !== null) { lsDel(k); moved++; return; }
      if (lsSet(target, lsGet(k, null))) { lsDel(k); moved++; }
    });
  });
  return moved;
}

// 구 osaka-trip:v1:* 를 새 여행 하나로 옮긴다. 옮길 게 없으면 null.
// 복사가 하나라도 실제로 저장되지 않았으면(예: 용량 초과) 구 키를 절대 지우지 않고,
// 이번에 만든 반쪽짜리 새 여행은 되돌린 뒤 null을 돌려준다 — 다음 부팅 때
// 구 키가 그대로 남아 있으므로 깨끗하게 재시도된다(고아 여행이 쌓이지 않는다).
function migrateLegacy() {
  var found = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf(LEGACY_PREFIX) === 0) found.push(k);
  }
  if (!found.length) return null;

  var t = cloneSample();
  t.id = newTripId();
  var ok = saveTrip(t);
  var st = tripStore(t.id);
  var byN = dayDateByN(t);
  found.forEach(function (k) {
    var sub = k.slice(LEGACY_PREFIX.length);
    // 알려진 키와 meal:<n>:<i> 형태만 옮긴다
    if (LEGACY_KEYS.indexOf(sub) >= 0 || sub.indexOf("meal:") === 0) {
      // 구 데이터의 meal 키는 일차 번호 기준이다 — 옮기는 김에 날짜 기준으로 바꿔
      // 넣는다. 그래야 migrateMealKeys와 이 함수의 실행 순서가 어느 쪽이든 결과가
      // 같다(이 함수가 먼저면 애초에 옮길 게 없고, migrateMealKeys가 먼저였다면
      // 그때는 이 여행이 아직 없었으므로 여기서 처리된다).
      // st.set을 먼저 평가해야 ok가 이미 false여도 나머지 키 복사를 계속 시도한다
      ok = st.set(mealMigrateKey(sub, byN) || sub, lsGet(k, null)) && ok;
    }
  });

  if (!ok) {
    deleteTrip(t.id);
    return null;
  }

  found.forEach(lsDel);
  return t.id;
}

<script>
// Trip 스키마 헬퍼: 일차 생성, 재동기화, 기본값.
// store.js 다음에 로드된다 (SCHEMA, newTripId 사용).

var DOW = ["일", "월", "화", "수", "목", "금", "토"];
var DAY_MS = 86400000;

function dateMs(iso) { return Date.parse(iso + "T00:00:00Z"); }
function msDate(ms) { return new Date(ms).toISOString().slice(0, 10); }

// 날짜가 비었거나(손상된 저장값) 파싱 불가능하면 빈 문자열 — 던지지도, 'undefined'를
// 화면에 흘리지도 않는다(normalizeDay 주석 참고).
function dowOf(iso) {
  var ms = dateMs(iso);
  return isNaN(ms) ? '' : DOW[new Date(ms).getUTCDay()];
}
function addDays(iso, n) { return msDate(dateMs(iso) + n * DAY_MS); }
function daysBetween(a, b) { return Math.round((dateMs(b) - dateMs(a)) / DAY_MS) + 1; }

var _seq = 0;
function newItemId() { return "i_" + Date.now().toString(36) + (_seq++).toString(36); }
function newSectionId() { return "s_" + Date.now().toString(36) + (_seq++).toString(36); }

function blankDay(n, iso) {
  return { n: n, date: iso, theme: "", place: null, curCode: null,
           items: [], meals: [], images: [] };
}

// 손상된 저장값(검증 없이 가져온 JSON, 손으로 고친 localStorage)이 렌더에서 예외를
// 던지지 않게 하는 최소 보정. 지금까지는 day.items만 배열로 맞춰줬는데, 렌더가 실제로
// 메서드를 부르는 필드는 그것 말고도 셋 더 있다 — day.date(escHtml(d.date.slice(5)),
// dowOf(day.date)), day.meals(renderTimeline의 .map — views.js:225-227), item.text
// (isUndecided(it.text)). 네 필드를 같은 계약으로 한 번에 보정한다. 값을 버리지 않고
// 배열/문자열로 맞추기만 하므로 정상 데이터에는 아무 영향이 없다.
// 실제로 뭔가를 고친 경우에만(정상 데이터는 절대 안 걸림) console.warn으로 남긴다 —
// pickDay가 보정한 값은 이후 saveTripBody가 그대로 되돌려 써버려 손상이 조용히
// 영구화되므로, 최소한 콘솔에서라도 원인(어느 필드가 어떤 값이었는지)을 추적할 수 있게 한다.
function normalizeDay(day) {
  if (!day) return null;
  if (!Array.isArray(day.items)) {
    console.warn('normalizeDay: day.items가 배열이 아니어서 빈 배열로 보정함', day.items);
    day.items = [];
  }
  if (typeof day.date !== 'string') {
    console.warn('normalizeDay: day.date가 문자열이 아니어서 빈 문자열로 보정함', day.date);
    day.date = '';
  }
  if (!Array.isArray(day.meals)) {
    console.warn('normalizeDay: day.meals가 배열이 아니어서 빈 배열로 보정함', day.meals);
    day.meals = [];
  }
  day.items = day.items.filter(function (it) { return it && typeof it === 'object'; });
  day.items.forEach(function (it) {
    if (typeof it.text !== 'string') {
      console.warn('normalizeDay: item.text가 문자열이 아니어서 빈 문자열로 보정함', it.text);
      it.text = it.text == null ? '' : String(it.text);
    }
  });
  return day;
}

function buildDays(start, end) {
  var out = [], total = daysBetween(start, end);
  for (var i = 0; i < total; i++) out.push(blankDay(i + 1, addDays(start, i)));
  return out;
}

// 기간이 바뀌어도 날짜가 그대로 남는 일차의 내용은 보존한다.
function resyncDays(days, start, end) {
  var byDate = {};
  (days || []).forEach(function (d) { byDate[d.date] = d; });
  var out = [], total = daysBetween(start, end);
  for (var i = 0; i < total; i++) {
    var iso = addDays(start, i), old = byDate[iso];
    if (old) { old.n = i + 1; out.push(old); }
    else out.push(blankDay(i + 1, iso));
  }
  return out;
}

// 내장 항목(숙소·준비물·경비)은 하단 탭이 됐다. sections는 사용자가 만든 것만 담는다.
function defaultSections() {
  return [];
}


function emptyTrip(o) {
  return {
    schema: SCHEMA,
    id: newTripId(),
    title: o.title,
    start: o.start,
    end: o.end,
    party: o.party || 2,
    place: null,
    currency: { code: "KRW", symbol: "₩", decimals: 0, unit: 1 },
    hotel: o.hotel || "",
    budgetKRW: 0,
    days: buildDays(o.start, o.end),
    sections: defaultSections(),
    packing: [],
    expenses: []
  };
}

// 일차별 오버라이드 상속. 2단계(다국가·다통화)에서 렌더가 이 두 함수만 쓴다.
function dayPlace(trip, day) {
  return (day && day.place) || trip.place;
}
function dayCurrency(trip, day) {
  if (day && day.curCode) return { code: day.curCode };
  return trip.currency;
}

<script>
// 외부 조회 계층: 날씨(Open-Meteo 예보). 캐시 우선이고, 실패해도 앱은 동작한다.
// DOM에 손대지 않는다 — 다시 그리는 것은 호출부(app.js의 wxRepaint)의 몫이다.
// schema.js 다음, views.js 앞에 로드된다.

var WX_DAILY = "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max";
// forecast_days 상한은 16이다. 7이면 2주 넘는 여행의 뒷부분 날씨가 빈다.
var WX_DAYS = 16;

// 좌표를 캐시 키로 쓴다. 소수점 3자리(약 100m)면 같은 도시가 같은 키로 모인다.
function wxKey(place) {
  if (!place) return "";
  var la = Math.round(Number(place.lat) * 1000) / 1000;
  var lo = Math.round(Number(place.lon) * 1000) / 1000;
  if (!isFinite(la) || !isFinite(lo)) return "";
  return la + "," + lo;
}

function wxUrl(place) {
  return "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + Number(place.lat) + "&longitude=" + Number(place.lon) +
    "&daily=" + WX_DAILY +
    "&timezone=" + encodeURIComponent(place.tz || "auto") +
    "&forecast_days=" + WX_DAYS;
}

function wxIcon(code) {
  if (code === 0) return { e: "☀️", t: "맑음" };
  if (code === 1 || code === 2) return { e: "🌤️", t: "구름 조금" };
  if (code === 3) return { e: "☁️", t: "흐림" };
  if (code === 45 || code === 48) return { e: "🌫️", t: "안개" };
  if (code >= 51 && code <= 57) return { e: "🌦️", t: "이슬비" };
  if (code >= 61 && code <= 67) return { e: "🌧️", t: "비" };
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return { e: "🌨️", t: "눈" };
  if (code >= 80 && code <= 82) return { e: "🌧️", t: "소나기" };
  if (code >= 95) return { e: "⛈️", t: "뇌우" };
  return { e: "🌡️", t: "" };
}
function wxDailyMap(api) {
  var m = {};
  if (!api || !api.daily || !api.daily.time) return m;
  api.daily.time.forEach(function (d, i) {
    var rain = api.daily.precipitation_probability_max[i];
    m[d] = {
      code: api.daily.weather_code[i],
      tmax: Math.round(api.daily.temperature_2m_max[i]),
      tmin: Math.round(api.daily.temperature_2m_min[i]),
      rain: (rain === null || rain === undefined) ? null : rain
    };
  });
  return m;
}
function wxLine(map, date) {
  var w = map[date];
  if (!w) return "";
  var rain = w.rain === null ? "" : " · 비 " + w.rain + "%";
  return wxIcon(w.code).e + " " + w.tmax + "° / " + w.tmin + "°" + rain;
}

// 좌표별 예보 캐시. 한 여행이 여러 도시를 지날 수 있으므로 단일 전역으로는 안 된다 —
// 그러면 A 도시 예보가 B 도시 화면에 그대로 남는다.
var wxMem = {};
// 여행을 바꾸면 진행 중이던 요청의 응답이 뒤늦게 도착해 새 여행의 캐시를 덮어쓸 수 있다.
// 세대 번호를 올려 두고 응답 처리 직전에 확인해 낡은 응답을 버린다.
var wxGen = 0;
function wxResetAll() { wxMem = {}; wxGen++; }

// 같은 세션에서 방금 받아온 예보는 다시 받지 않는다(일 단위 예보라 30분이면 충분).
var WX_TTL_MS = 30 * 60 * 1000;

// 메모리 캐시 → 저장소 캐시 순으로 찾는다. 둘 다 없으면 빈 맵을 준다 —
// 화면에서는 날씨 줄이 그냥 사라진다(예보 없는 날짜와 같은 처리, 오류 문구 없음).
function wxGet(st, place) {
  var k = wxKey(place);
  if (!k) return { map: {}, at: null, live: false, fetchedAt: 0 };
  if (wxMem[k]) return wxMem[k];
  var cached = st ? st.get("wx:" + k, null) : null;
  if (cached && cached.api) {
    wxMem[k] = { map: wxDailyMap(cached.api), at: cached.at, live: false, fetchedAt: 0 };
    return wxMem[k];
  }
  return { map: {}, at: null, live: false, fetchedAt: 0 };
}

function wxIsFresh(place) {
  var e = wxMem[wxKey(place)];
  return !!e && e.live && (Date.now() - e.fetchedAt) < WX_TTL_MS;
}

// 메모리 캐시(wxMem)만 읽는다 — 호출부는 같은 렌더 안에서 wxGet(st, place)를 먼저 불러
// 캐시를 채운 뒤 이 함수를 부른다. 그 순서를 지켜야 스탬프가 뜬다.
function wxStamp(place) {
  var e = wxMem[wxKey(place)];
  if (!e || e.live || !e.at) return "";
  var d = new Date(e.at);
  var hh = ("0" + d.getHours()).slice(-2);
  var mm = ("0" + d.getMinutes()).slice(-2);
  return ' <span class="wxstamp">(' + (d.getMonth() + 1) + "/" + d.getDate() +
    " " + hh + ":" + mm + " 기준)</span>";
}

// 좌표별로 예보를 받아 캐시에 넣는다. 다 되면 onDone()을 부른다 —
// remote.js가 렌더를 알지 못하게 콜백으로 뒤집었다(1단계 리뷰의 역방향 의존 지적).
// 진행 중인 요청의 좌표. wxIsFresh는 "응답이 도착한" 좌표만 걸러내므로, 같은 좌표로
// 연달아 부르면(여행을 열 때 showTrip이 한 번, 곧이어 showDay가 한 번) 응답 전이라
// 둘 다 요청을 보낸다. 이 표로 두 번째를 막는다.
var wxInflight = {};

function wxRefresh(st, place, onDone) {
  var k = wxKey(place);
  if (!k) return;
  if (wxIsFresh(place)) return;
  if (wxInflight[k]) return;
  wxInflight[k] = true;
  var gen = wxGen;
  // 저장소 캐시부터 화면에 올린다(오프라인이면 이게 전부다).
  wxGet(st, place);
  fetch(wxUrl(place)).then(function (r) {
    if (!r.ok) throw new Error("wx " + r.status);
    return r.json();
  }).then(function (api) {
    delete wxInflight[k];
    if (gen !== wxGen) return;   // 그 사이 여행이 바뀌었다 — 이 응답은 버린다
    st.set("wx:" + k, { at: new Date().toISOString(), api: api });
    wxMem[k] = { map: wxDailyMap(api), at: null, live: true, fetchedAt: Date.now() };
    if (onDone) onDone();
  }).catch(function () {
    delete wxInflight[k];
    if (gen !== wxGen) return;
    // 실패해도 캐시가 있으면 다시 그린다 — 시각 스탬프가 붙어야 하기 때문이다.
    if (wxMem[k] && wxMem[k].at && onDone) onDone();
  });
}

// ---- 도시 검색(지오코딩) ----

// language는 표시 언어뿐 아니라 검색 색인 자체를 고른다(2026-08-06 브라우저 실측).
// language=ko는 한국어 질의('다낭','호이안','타이베이' 8/8)와 영어 질의('Da Nang' 등
// 4/4)를 모두 받으면서 결과를 한국어로 돌려준다. 반대로 language=en은 같은 한국어
// 질의를 전부 0건으로 만든다. 그래서 ko 하나로 끝내고 폴백을 두지 않는다 —
// 폴백은 이득이 없을 뿐 아니라 한국어 사용자에게 해롭다.
function geoUrl(q, count) {
  return "https://geocoding-api.open-meteo.com/v1/search?name=" +
    encodeURIComponent(q) + "&language=ko&count=" + (count || 5);
}

// 0건이면 응답에 results 키가 아예 없다(실측) — 빈 배열로 받는다.
function geoParse(api) {
  var rows = (api && api.results) || [];
  return rows.map(function (r) {
    return { name: r.name, country: r.country,
             lat: r.latitude, lon: r.longitude, tz: r.timezone };
  });
}

function placeLabel(place) {
  if (!place || !place.name) return "";
  return place.country ? place.name + " · " + place.country : place.name;
}

// cb(list, err). 실패해도 던지지 않는다 — 화면은 안내 문구만 바꾼다.
function geoSearch(q, cb) {
  var query = String(q || "").trim();
  if (!query) { cb([], null); return; }
  fetch(geoUrl(query, 5)).then(function (r) {
    if (!r.ok) throw new Error("geo " + r.status);
    return r.json();
  }).then(function (api) {
    cb(geoParse(api), null);
  }).catch(function () {
    cb([], '검색에 실패했습니다. 연결을 확인해 주세요.');
  });
}

<script>
// 렌더 계층: DOM에 그리는 함수만 모은다.
// trip(여행 본체)과 st(tripStore)를 인자로 받는다 — 전역 여행/저장소를 읽지 않는다.
// schema.js·remote.js 다음, app.js 앞에 로드된다 (dowOf/daysBetween은 schema.js,
// wxGet/wxLine/wxStamp는 remote.js, dayPlace는 schema.js).

// 사용자가 입력한 문자열이 HTML로 해석되지 않게 막는다.
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// escape를 먼저 하고, 배지 판정은 원본 텍스트로 한다.
function itemLinesHtml(text) {
  return String(text).split('\n').map(function (l) {
    var e = escHtml(l);
    if (/\(패스권-시간\)|\(시간\)/.test(l)) {
      return '<div class="line timed"><span class="tag">⏰ 시간지정</span>' + e + '</div>';
    }
    if (/예약 완료/.test(l)) {
      return '<div class="line booked"><span class="tag">✅ 예약완료</span>' + e + '</div>';
    }
    return '<div class="line">' + e + '</div>';
  }).join('');
}

// 여행 화면의 편집 토글 상태. 여행을 넘나들거나 새로고침하면 꺼진 상태로 돌아간다 —
// 세션에 묶인 UI 상태일 뿐 trip 데이터가 아니므로 저장소에 넣지 않는다.
var EDIT_MODE = false;

// text가 문자열이 아닌 손상된 항목(검증 없이 가져온 JSON 등)에서도 던지지 않는다 —
// normalizeDay가 렌더 전에 보정하지만, 이 판정 자체도 같은 계약을 지킨다.
function isUndecided(text) {
  var t = String(text == null ? "" : text).trim();
  return /뭐먹지|\?$/.test(t) || t === "";
}

function dday(todayISO, startISO, endISO) {
  const day = 86400000;
  const t = Date.parse(todayISO + "T00:00:00");
  const s = Date.parse(startISO + "T00:00:00");
  const e = Date.parse(endISO + "T00:00:00");
  if (t < s) return "D-" + Math.round((s - t) / day);
  if (t > e) return "여행 종료";
  return "여행 중 " + (Math.round((t - s) / day) + 1) + "일차";
}

// ---- 현지 경비 ----

var SPEND_CATS = ["식비", "교통", "쇼핑", "관광", "기타"];

function spendList(st) {
  var v = st.get("spend", []);
  return Array.isArray(v) ? v : [];
}
function spendFx(st) {
  var n = Number(st.get("fx", 900));
  return isFinite(n) && n > 0 ? n : 0;
}
function spendTotalJpy(list) {
  return list.reduce(function (s, e) {
    var n = Number(e.jpy);
    return s + (isFinite(n) ? n : 0);
  }, 0);
}
function jpyToKrw(jpy, fx) {
  return Math.round(jpy * fx / 100);
}
function spendByCat(list) {
  var m = {};
  list.forEach(function (e) {
    var n = Number(e.jpy);
    m[e.cat] = (m[e.cat] || 0) + (isFinite(n) ? n : 0);
  });
  return SPEND_CATS.filter(function (c) { return m[c]; })
    .map(function (c) { return { cat: c, jpy: m[c] }; });
}
function spendByDate(list) {
  var m = {}, dates = [];
  list.forEach(function (e) {
    if (!m[e.date]) { m[e.date] = []; dates.push(e.date); }
    m[e.date].push(e);
  });
  dates.sort().reverse();
  return dates.map(function (d) {
    return { date: d, items: m[d].slice().reverse() };
  });
}

// 일차 번호(n)가 아니라 날짜로 키를 잡는다 — resyncDays가 날짜를 기준으로 일차를
// 보존하면서 n을 1부터 다시 매기기 때문에, n으로 키를 잡으면 시작일을 하루만 앞당겨도
// 메모가 통째로 밀려 엉뚱한 날에 붙거나 화면에서 사라진다(store.js의 migrateMealKeys 참고).
// 날짜는 문자열이므로 속성 컨텍스트에 넣을 때 반드시 escHtml을 거쳐야 한다.
function mealKey(date, i) { return "meal:" + String(date) + ":" + i; }

// ---- 상단 요약 ----

// lead가 true면(다른 요약 텍스트 뒤가 아니라 줄의 맨 앞이면) "· " 구분자를 붙이지 않는다.
function summarySpend(st, lead) {
  const tot = spendTotalJpy(spendList(st));
  if (!tot) return '';
  const fx = spendFx(st);
  const krw = fx ? ' (약 ' + jpyToKrw(tot, fx).toLocaleString('ko-KR') + '원)' : '';
  // lead면 줄의 맨 앞이므로 선행 공백도 붙이지 않는다 — 붙이면 .cost가 공백으로 시작한다.
  const dot = lead ? '' : '· ';
  const gap = lead ? '' : ' ';
  return gap + '<span class="spent">' + dot + '💸 현지 ¥' + tot.toLocaleString('ko-KR') + krw + '</span>';
}

function renderSummary(trip, st) {
  const today = todayLocal();
  const el = document.getElementById("summary");
  const nights = daysBetween(trip.start, trip.end) - 1;
  el.innerHTML =
    '<button class="back-list" type="button" aria-label="여행 목록">←</button>' +
    '<button class="edit-trip" type="button" aria-label="여행 설정">⚙</button>' +
    // 편집 토글은 일정 탭에서만 의미가 있다. CUR은 app.js에 있고 런타임에만
    // 참조되므로 로드 순서 문제는 없다. 앱 화면이 없는 test.html에서는 CUR이
    // 없을 수 있으므로 typeof로 막는다.
    ((typeof CUR !== 'undefined' && CUR.tab !== 'day')
      ? ''
      : '<button class="edit-mode" type="button" aria-pressed="' + (EDIT_MODE ? 'true' : 'false') +
        '">' + (EDIT_MODE ? '완료' : '편집') + '</button>') +
    '<div class="dday">' + dday(today, trip.start, trip.end) + '</div>' +
    '<h1>' + escHtml(trip.title) + '</h1>' +
    '<div class="period">' + escHtml(trip.start) + ' ~ ' + escHtml(trip.end) +
      ' · ' + nights + '박 ' + (nights + 1) + '일</div>' +
    // 숙소는 여러 줄 textarea다(editor.js) — day.theme과 같은 방식으로 줄바꿈을
    // 가운뎃점으로 이어 한 줄에 눌러 담는다. 그냥 두면 줄바꿈이 사라져 붙어 보인다.
    (trip.hotel ? '<div class="hotel">🏨 ' + escHtml(trip.hotel).replace(/\n/g, ' · ') + '</div>' : '') +
    (function () {
      // 여행 기본 도시의 오늘 날씨. 도시를 지정하지 않은 여행이면 캐시가 비어
      // 줄 자체가 사라진다(예보 없는 날짜와 같은 처리 — 오류 문구를 넣지 않는다).
      var place = trip.place;
      var line = wxLine(wxGet(st, place).map, todayLocal());
      return line ? '<div class="wx">' + line.replace(" ", " 오늘 ") + wxStamp(place) + '</div>' : '';
    })() +
    (function () {
      // 사전 예산(budgetKRW)과 현지 경비 합계(summarySpend)는 서로 독립된 정보다.
      // 예산을 입력하지 않은 여행(생성/설정 화면에 그 입력란이 없어 기본값 0으로
      // 남는 게 보통이다)이라도 경비를 기록했다면 그 합계는 보여야 한다.
      var budgetLine = trip.budgetKRW
        ? '💰 총 ' + Number(trip.budgetKRW).toLocaleString('ko-KR') + '원 (' +
          Number(trip.party) + '인)'
        : '';
      var spendLine = summarySpend(st, !budgetLine);
      if (!budgetLine && !spendLine) return '';
      return '<div class="cost">' + budgetLine + spendLine + '</div>';
    })();
  var bl = el.querySelector('.back-list');
  if (bl) bl.addEventListener('click', function () { go('#/'); });
  var eb = el.querySelector('.edit-trip');
  if (eb) eb.addEventListener('click', function () { go('#/t/' + trip.id + '/edit'); });
  var mb = el.querySelector('.edit-mode');
  if (mb) mb.addEventListener('click', function () {
    // showTrip(trip.id, ...)로는 안 된다 — 같은 여행을 다시 "열게" 되면 opening 경로를
    // 타서 #fixed 전체가 다시 그려지며 열어 둔 아코디언이 닫힌다(showDay 위 주석 참고).
    // showDay(trip, CUR.dayN)도 안 된다 — 그건 renderTabs를 다시 불러 탭 목록의
    // scrollIntoView가 실행되는데, 여기서 바뀐 건 EDIT_MODE뿐이라 탭은 그대로다(wxRepaint가
    // 같은 이유로 renderTimeline을 직접 부르는 것과 동일한 사정 — app.js의 repaintDay 참고).
    // 여기서는 요약(토글 버튼 자체)과 타임라인(수정/삭제 버튼)만 다시 그리면 된다.
    EDIT_MODE = !EDIT_MODE;
    renderSummary(trip, CUR.st);
    repaintDay(trip, CUR.dayN, CUR.st);
  });
}

// ---- 일차 탭 / 타임라인 ----

function renderTabs(trip, selectedN, onSelect) {
  const nav = document.getElementById("daytabs");
  nav.innerHTML = trip.days.map(function (d) {
    const on = d.n === selectedN ? ' data-selected="1"' : '';
    return '<button class="tab"' + on + ' data-n="' + Number(d.n) + '">' +
      '<span class="tn">' + Number(d.n) + '일차</span>' +
      '<span class="td">' + escHtml(d.date.slice(5)) + '(' + dowOf(d.date) + ')</span></button>';
  }).join('');
  nav.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { onSelect(parseInt(b.dataset.n, 10)); });
  });
  // 탭이 많은 여행(30일)에서 현재 일차가 화면 밖에 있는 것을 막는다.
  const sel = nav.querySelector('.tab[data-selected]');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

// saveTripBody가 실패했을 때 trip.days를 저장소 값으로 되돌릴지 판단하는 순수 로직.
// DOM에도 alert에도 손대지 않으므로 테스트에서 바로 호출할 수 있다(afterItemEdit을
// 통째로 테스트하려면 alert 스텁이 필요한데, 그 스텁 없이도 이 판단 로직 자체는
// 검증할 수 있게 분리했다). ok가 true면 아무 것도 하지 않는다.
// 저장소에서 이 여행 자체를 못 찾으면(예: 다른 탭에서 삭제됨) 되돌릴 원본이 없다는
// 뜻이라 lost:true를 돌려준다 — 이 경우 메모리 위 trip.days는 여전히 실패한 시도로
// 오염된 phantom 상태이므로, 호출부는 그 화면을 그대로 다시 그리지 말고 안전한 곳으로
// 옮겨야 한다.
function reconcileAfterSaveFail(trip, ok) {
  if (ok) return { reverted: false, lost: false };
  var fresh = loadTrip(trip.id);
  if (fresh) { trip.days = fresh.days; return { reverted: true, lost: false }; }
  return { reverted: false, lost: true };
}

// EDIT_MODE에서 일정 추가·수정·삭제 후 공통으로 거치는 경로.
// saveTripBody의 성공 여부를 반드시 확인한다 — 확인 없이 넘기면 저장이 조용히 실패해도
// 화면은 성공한 것처럼 보인다. 실패하면 사용자에게 알리고, 이미 메모리 위에서 고쳐놓은
// trip.days를 저장소의 실제 값으로 되돌려 다음 조작이 이번에 실패한 시도 위에 쌓이지
// 않게 한다(reconcileAfterSaveFail). 다시 그리는 범위는 타임라인뿐이다(요구사항: 일차
// 전환/편집 토글과 마찬가지로 #fixed는 건드리지 않는다) — repaintDay가 day.items가
// 배열이 아닌 경우의 보정도 함께 해 준다(showDay가 여는 경로에서 하는 것과 동일).
function afterItemEdit(trip, day, st, ok) {
  var res = reconcileAfterSaveFail(trip, ok);
  if (res.lost) {
    alert('일정 저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.');
    go('#/');
    return;
  }
  if (res.reverted) alert('일정 저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.');
  repaintDay(trip, day.n, st);
}

function renderTimeline(trip, day, st) {
  const main = document.getElementById("timeline");
  const slots = day.items.map(function (it) {
    const cls = isUndecided(it.text) ? ' undecided' : '';
    const btns = EDIT_MODE
      ? '<div class="slot-btns">' +
        '<button class="it-edit" type="button" data-id="' + escHtml(it.id) + '">수정</button>' +
        '<button class="it-del" type="button" data-id="' + escHtml(it.id) + '">삭제</button></div>'
      : '';
    return '<div class="slot' + cls + '" data-item="' + escHtml(it.id) + '">' +
      '<div class="time">' + escHtml(it.time) + '</div>' +
      '<div class="what">' + itemLinesHtml(it.text) + btns + '</div></div>';
  }).join('');
  // 새로 만든 여행의 1일차는 일정이 하나도 없다. 편집 모드가 아니면 추가 폼도 없어서
  // 예전에는 완전히 빈 카드만 보였다 — 무엇을 해야 하는지 알려 주는 줄을 넣는다.
  // 편집 모드에서는 바로 아래에 추가 폼이 있으므로 안내가 필요 없다.
  const rows = slots || (EDIT_MODE
    ? ''
    : '<p class="empty">아직 일정이 없습니다. 편집을 눌러 추가해 보세요.</p>');
  const meals = (day.meals && day.meals.length)
    ? '<div class="meals"><div class="meals-h">🍽 뭐먹지</div>' +
      day.meals.map(function (m, i) {
        const key = mealKey(day.date, i);
        const val = escHtml(st.get(key, ""));
        return '<div class="meal"><div class="meal-note">' + itemLinesHtml(m) + '</div>' +
          '<input class="memo" data-key="' + escHtml(key) +
          '" placeholder="식당/메모 입력" value="' + val + '"></div>';
      }).join('') + '</div>'
    : '';
  main.innerHTML =
    '<div class="daycard"><div class="dayhead">' +
      '<span class="dnum">' + Number(day.n) + '일차</span> ' +
      '<span class="ddate">' + escHtml(day.date) + '(' + dowOf(day.date) + ')</span>' +
      '<div class="dtheme">' + escHtml(day.theme).replace(/\n/g, ' · ') + '</div>' +
      (function () {
        // 그 일차에 지정된 도시(없으면 여행 기본값)의 예보를 쓴다.
        var dp = dayPlace(trip, day);
        // 배지는 여행 기본 도시와 다른 일차에만 붙인다 — 모든 일차에 붙이면
        // 단일 도시 여행에서 같은 이름이 일곱 번 반복돼 소음이 된다.
        var moved = dp && trip.place && wxKey(dp) !== wxKey(trip.place);
        var badge = moved ? '<span class="daycity">📍 ' + escHtml(dp.name) + '</span>' : '';
        var line = wxLine(wxGet(st, dp).map, day.date);
        var wx = line ? '<div class="dwx">' + line + wxStamp(dp) + '</div>' : '';
        return badge + wx;
      })() + '</div>' +
      '<div class="slots">' + rows + '</div>' +
      (EDIT_MODE
        ? '<form class="item-add">' +
          '<input class="ia-time" type="time" step="300" required aria-label="시간">' +
          '<textarea class="ia-text" rows="2" placeholder="일정 내용" required ' +
            'aria-label="일정 내용"></textarea>' +
          '<button type="submit">일정 추가</button></form>'
        : '') +
      meals + '</div>';
  main.querySelectorAll('.memo').forEach(function (inp) {
    inp.addEventListener('input', function () { st.set(inp.dataset.key, inp.value); });
  });
  if (EDIT_MODE) {
    main.querySelectorAll('.it-del').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!confirm('이 일정을 삭제할까요?')) return;
        removeItem(trip, day.n, b.dataset.id);
        afterItemEdit(trip, day, st, saveTripBody(trip));
      });
    });
    main.querySelectorAll('.it-edit').forEach(function (b) {
      b.addEventListener('click', function () {
        var it = day.items.filter(function (x) { return x.id === b.dataset.id; })[0];
        if (!it) return;
        var time = prompt('시간 (HH:MM)', it.time);
        if (time === null) return;
        // 추가 폼은 <input type=time>이 형식을 강제하지만 prompt()는 아무 문자열이나
        // 받는다 — '9:00'처럼 자릿수만 틀린 흔한 실수는 정규화해서 받아주고, 그 밖의
        // ('9시', 'abc' 등) 잘못된 값은 저장하지 않고 알린다. 정규화 없이 그대로 저장하면
        // sortItems의 사전순 비교에서 '9:00'이 '14:00'보다 뒤로 밀려버린다(review 지적).
        var normTime = normalizeTimeInput(time);
        if (!normTime) {
          alert(MSG_BAD_TIME);
          return;
        }
        var text = prompt('일정 내용', it.text);
        if (text === null) return;
        text = text.trim();
        // 추가 폼(item-add)은 빈 내용을 거부한다(required + trim 확인) — prompt 경로만
        // 빈 문자열을 그대로 받아주면 "시간만 있고 내용은 빈" undecided 행이 생긴다.
        // 두 입력 경로의 보장을 맞춘다.
        if (!text) {
          alert(MSG_EMPTY_TEXT);
          return;
        }
        updateItem(trip, day.n, it.id, { time: normTime, text: text });
        afterItemEdit(trip, day, st, saveTripBody(trip));
      });
    });
    var af = main.querySelector('.item-add');
    if (af) af.addEventListener('submit', function (e) {
      e.preventDefault();
      // required 속성이 막아 주는 "아무것도 안 채운 제출"은 조용히 무시하고, 실제로
      // 값이 들어왔는데 형식이 틀린 경우만 알린다(parseItemInput — prompt 경로와 동일한
      // 검증·메시지를 쓴다).
      var raw = af.querySelector('.ia-time').value;
      var rawText = af.querySelector('.ia-text').value;
      if (!raw && !rawText.trim()) return;
      var p = parseItemInput(raw, rawText);
      if (!p.ok) { alert(p.message); return; }
      addItem(trip, day.n, { time: p.time, text: p.text });
      afterItemEdit(trip, day, st, saveTripBody(trip));
    });
  }
}

// ---- 하단 고정 섹션 ----

function sectionBodyHtml(trip, sec) {
  if (sec.type === "text") return itemLinesHtml(sec.body);
  if (sec.type === "list") {
    return '<ul>' + sec.body.map(function (t) {
      return '<li>' + escHtml(t) + '</li>';
    }).join('') + '</ul>';
  }
  if (sec.type === "table") {
    return sec.body.map(function (tb) {
      return '<div class="tblwrap"><table>' +
        (tb.caption ? '<caption>' + escHtml(tb.caption) + '</caption>' : '') +
        '<thead><tr>' + tb.head.map(function (h) {
          return '<th>' + escHtml(h) + '</th>';
        }).join('') + '</tr></thead><tbody>' +
        tb.rows.map(function (r) {
          return '<tr>' + r.map(function (c) {
            return '<td>' + escHtml(c) + '</td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }).join('');
  }
  return '';
}

// 합계는 trip.expenses에서 직접 계산한다 — 사용자가 항목을 추가해도 어긋나지 않게.
function expensesTableHtml(trip) {
  const rows = trip.expenses.map(function (e) {
    return '<tr><td>' + escHtml(e.cat) + '</td><td>' + escHtml(e.detail) + '</td>' +
      '<td class="num">' + Number(e.krw).toLocaleString('ko-KR') + '</td></tr>';
  }).join('');
  const total = trip.expenses.reduce(function (s, e) { return s + Number(e.krw || 0); }, 0);
  return '<div class="tblwrap"><table>' +
    '<thead><tr><th>항목</th><th>상세</th><th class="num">금액(원)</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td colspan="2">합계</td><td class="num">' +
      total.toLocaleString('ko-KR') + '</td></tr></tfoot></table></div>';
}

// 탭 본문. 일정 탭은 #daytabs/#timeline을 따로 쓰므로 여기서는 빈 문자열.
function panelHtml(trip, tab) {
  if (tab === "hotel") {
    return trip.hotel
      ? '<div class="panel-card">' + itemLinesHtml(trip.hotel) + '</div>'
      : '<p class="empty">숙소가 아직 없습니다. ⚙ 여행 설정에서 입력할 수 있습니다.</p>';
  }
  if (tab === "packing") {
    return '<div class="panel-card" id="packing-body"></div>';
  }
  if (tab === "money") {
    var exp = (trip.expenses && trip.expenses.length)
      ? '<div class="panel-card"><h2 class="panel-h">💰 출발 전 결제 내역</h2>' +
        expensesTableHtml(trip) + '</div>'
      : '';
    return '<div class="panel-card" id="spend-body"></div>' + exp;
  }
  if (tab === "info") {
    var secs = trip.sections || [];
    if (!secs.length) {
      // 섹션 편집기는 2단계다 — 지금 할 수 있는 게 없으므로 없는 기능을 가리키지 않는다.
      return '<p class="empty">시간표·메모처럼 직접 만드는 항목이 여기 표시됩니다.</p>';
    }
    return secs.map(function (sec, i) {
      return '<details' + (i === 0 ? ' open' : '') + '>' +
        '<summary>' + escHtml(sec.icon) + ' ' + escHtml(sec.title) + '</summary>' +
        '<div class="acc">' + sectionBodyHtml(trip, sec) + '</div></details>';
    }).join('');
  }
  return '';
}

function renderPanel(trip, st, tab) {
  var el = document.getElementById("tab-panel");
  if (!el) return;
  el.innerHTML = panelHtml(trip, tab);
  if (tab === "packing") renderPacking(trip, st);
  if (tab === "money") renderSpend(trip, st);
}

function renderTabbar(trip, tab, onSelect) {
  var nav = document.getElementById("tabbar");
  if (!nav) return;
  nav.innerHTML = TAB_DEFS.map(function (t) {
    var on = t.key === tab ? ' data-selected="1"' : '';
    return '<button class="tb"' + on + ' data-tab="' + escHtml(t.key) + '"' +
      ' aria-current="' + (t.key === tab ? 'page' : 'false') + '">' +
      '<span class="tb-i">' + t.icon + '</span>' +
      '<span class="tb-l">' + escHtml(t.label) + '</span></button>';
  }).join('');
  nav.querySelectorAll('.tb').forEach(function (b) {
    b.addEventListener('click', function () { onSelect(b.dataset.tab); });
  });
}


// renderSpend는 #spend-body를 통째로 다시 그린다 — 목록·합계·환율이 한 덩어리라
// 부분 갱신이 오히려 복잡하다. 대신 추가 폼에 치던 값은 보존한다: 항목을 하나
// 삭제하거나 환율을 고치는 것만으로 입력 중이던 금액·내용이 사라지면 안 된다.
// 제출 경로는 값을 비우는 게 맞으므로 그쪽에서 명시적으로 지운다.
function renderSpend(trip, st) {
  const body = document.getElementById("spend-body");
  if (!body) return;
  const keepAmt = (body.querySelector('.sjpy-in') || {}).value || '';
  const keepNote = (body.querySelector('.snote-in') || {}).value || '';
  const keepCat = (body.querySelector('.scat-in') || {}).value || '';
  const list = spendList(st);
  const fx = spendFx(st);
  const tot = spendTotalJpy(list);
  const krw = fx
    ? ' <span class="skrw">(약 ' + jpyToKrw(tot, fx).toLocaleString('ko-KR') + '원)</span>'
    : '';
  const chips = spendByCat(list).map(function (c) {
    return '<li>' + escHtml(c.cat) + ' <b>¥' + c.jpy.toLocaleString('ko-KR') + '</b></li>';
  }).join('');
  const groups = spendByDate(list).map(function (g) {
    const rows = g.items.map(function (e) {
      const n = Number(e.jpy);
      return '<li><span class="scat">' + escHtml(e.cat) + '</span>' +
        '<span class="snote">' + escHtml(e.note || e.cat) + '</span>' +
        '<span class="sjpy">¥' + (isFinite(n) ? n : 0).toLocaleString('ko-KR') + '</span>' +
        '<button class="spend-del" type="button" data-id="' + escHtml(e.id) +
        '" aria-label="삭제">×</button></li>';
    }).join('');
    return '<div class="sgroup"><div class="sdate">' + escHtml(g.date) + '</div>' +
      '<ul class="slist">' + rows + '</ul></div>';
  }).join('');
  body.innerHTML =
    '<div class="stotal">¥' + tot.toLocaleString('ko-KR') + krw + '</div>' +
    (chips ? '<ul class="scats">' + chips + '</ul>' : '') +
    '<form class="spend-add">' +
      '<input class="sjpy-in" type="number" inputmode="numeric" min="1" step="1" ' +
        'placeholder="금액 ¥" aria-label="금액(엔)">' +
      '<input class="snote-in" type="text" placeholder="내용" aria-label="내용">' +
      '<select class="scat-in" aria-label="분류">' +
        SPEND_CATS.map(function (c) { return '<option>' + escHtml(c) + '</option>'; }).join('') +
      '</select>' +
      '<button type="submit">추가</button>' +
    '</form>' +
    (groups || '<div class="sempty">아직 기록이 없습니다.</div>') +
    '<div class="sfx">100엔 = <input class="sfx-in" type="number" min="0" step="1" value="' +
      fx + '"> 원</div>';

  const form = body.querySelector('.spend-add');
  if (keepAmt) form.querySelector('.sjpy-in').value = keepAmt;
  if (keepNote) form.querySelector('.snote-in').value = keepNote;
  if (keepCat) form.querySelector('.scat-in').value = keepCat;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const jin = form.querySelector('.sjpy-in');
    const jpy = Math.round(Number(jin.value));
    if (!isFinite(jpy) || jpy <= 0) { jin.focus(); return; }
    const cur = spendList(st);
    let id = Date.now();
    while (cur.some(function (x) { return x.id === id; })) id++;
    cur.push({
      id: id,
      date: todayLocal(),
      jpy: jpy,
      cat: form.querySelector('.scat-in').value,
      note: form.querySelector('.snote-in').value.trim()
    });
    st.set("spend", cur);
    // 방금 기록한 값이 폼에 되살아나지 않도록 명시적으로 비운다.
    jin.value = '';
    form.querySelector('.snote-in').value = '';
    renderSpend(trip, st);
    renderSummary(trip, st);
    const next = body.querySelector('.sjpy-in');
    if (next) next.focus();
  });

  body.querySelectorAll('.spend-del').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const id = Number(btn.dataset.id);
      st.set("spend", spendList(st).filter(function (x) { return x.id !== id; }));
      renderSpend(trip, st);
      renderSummary(trip, st);
    });
  });

  const fxin = body.querySelector('.sfx-in');
  fxin.addEventListener('change', function () {
    st.set("fx", Number(fxin.value) || 0);
    renderSpend(trip, st);
    renderSummary(trip, st);
  });
}

function renderPacking(trip, st) {
  const body = document.getElementById("packing-body");
  if (!body) return;
  const customs = st.get("packing_add", []);
  const checked = st.get("packing_checked", {});
  const items = trip.packing.map(function (t) { return { text: t, custom: false }; })
    .concat(customs.map(function (t) { return { text: t, custom: true }; }));
  body.innerHTML =
    '<ul class="packlist">' + items.map(function (it) {
      const on = checked[it.text] ? ' checked' : '';
      const doneCls = checked[it.text] ? ' class="done"' : '';
      const del = it.custom
        ? '<button class="pack-del" type="button" data-text="' + escHtml(it.text) + '" aria-label="삭제">×</button>'
        : '';
      return '<li' + doneCls + '><label><input type="checkbox" data-text="' + escHtml(it.text) + '"' +
        on + '> ' + escHtml(it.text) + '</label>' + del + '</li>';
    }).join('') + '</ul>' +
    '<form class="pack-add"><input type="text" placeholder="준비물 추가" aria-label="준비물 추가">' +
    '<button type="submit">추가</button></form>';

  body.querySelectorAll('input[type=checkbox]').forEach(function (cb) {
    cb.addEventListener('change', function () {
      const c = st.get("packing_checked", {});
      c[cb.dataset.text] = cb.checked;
      st.set("packing_checked", c);
      cb.closest('li').classList.toggle('done', cb.checked);
    });
  });
  body.querySelectorAll('.pack-del').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const list = st.get("packing_add", []).filter(function (t) { return t !== btn.dataset.text; });
      st.set("packing_add", list);
      renderPacking(trip, st);
    });
  });
  const form = body.querySelector('.pack-add');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const inp = form.querySelector('input');
    const v = inp.value.trim();
    if (!v) return;
    const list = st.get("packing_add", []);
    if (list.indexOf(v) === -1 && trip.packing.indexOf(v) === -1) {
      list.push(v);
      st.set("packing_add", list);
    }
    renderPacking(trip, st);
    const nextInput = body.querySelector('.pack-add input');
    if (nextInput) nextInput.focus();
  });
}

</script>
<script>
// 여행 만들기·설정, 일정 편집 (Task 7-8)

var MAX_TRIP_DAYS = 90;

function validateTripForm(f) {
  if (!f.title || !f.title.trim()) return '여행 제목을 입력하세요.';
  if (!f.start || !f.end) return '시작일과 종료일을 입력하세요.';
  if (f.end < f.start) return '종료일이 시작일보다 빠릅니다.';
  // <input type=date>는 연도 자릿수를 제한하지 않아(예: 275760년) Date.parse가 NaN을
  // 돌려줄 수 있다. NaN > 90은 false라서 그대로 두면 "통과"해버리고 resyncDays가
  // 일차 0개짜리 여행을 만든다 — 기간이 긴 게 아니라 날짜 자체가 무효인 것이므로
  // "최대 90일" 메시지 대신 별도 메시지로 구분한다.
  var days = daysBetween(f.start, f.end);
  if (!(days >= 1)) return '날짜가 올바르지 않습니다.';
  if (days > MAX_TRIP_DAYS) return '여행 기간은 최대 90일입니다.';
  if (!(Number(f.party) >= 1)) return '인원은 1명 이상이어야 합니다.';
  return null;
}

// trip이 null이면 새로 만들고, 있으면 필드를 갱신한 새 객체를 돌려준다. days는 항상
// 재동기화한다.
// 참고(편집 경로): 인자로 받은 trip은 건드리지 않는다(non-mutating) — 갱신된 필드를
// 얹은 새 객체를 돌려준다. showEdit는 폼 제출마다 이 함수에 같은 trip 참조를 넘기는데,
// 만약 그 자리에서 고쳤다면 실패한 시도의 값(예: 일차가 줄어들며 사라진 일정)이 메모리
// 위 trip에 그대로 남아, 그다음 재시도가 성공할 때 저장소의 온전한 값이 아니라 실패한
// 시도로 오염된 값을 써버린다. trip을 그대로 두면 재시도할 때마다 항상 저장소와 일치하는
// 원본에서 다시 시작하므로 이 문제가 애초에 생기지 않는다. saveTrip이 실패해도 caller가
// 들고 있는 trip은 여전히 저장소와 일치한다 — 그래도 submitTripForm은 실패 시 절대
// navigate하지 않고 에러를 보여준다(아래 참고).
function applyTripForm(trip, f) {
  if (!trip) {
    var made = emptyTrip({ title: f.title.trim(), start: f.start, end: f.end,
                           party: Number(f.party), hotel: (f.hotel || '').trim() });
    // f.place가 undefined면 도시를 건드리지 않은 저장이다(기본값 null 유지).
    if (f.place !== undefined) made.place = f.place;
    return made;
  }
  var next = {};
  for (var k in trip) { if (Object.prototype.hasOwnProperty.call(trip, k)) next[k] = trip[k]; }
  next.title = f.title.trim();
  next.start = f.start;
  next.end = f.end;
  next.party = Number(f.party);
  next.hotel = (f.hotel || '').trim();
  // 도시를 건드리지 않은 저장(f.place === undefined)에서는 기존 값을 그대로 둔다.
  if (f.place !== undefined) next.place = f.place;
  next.days = resyncDays(trip.days, f.start, f.end);
  // 일차별 도시는 resyncDays 뒤에 적용한다 — 기간이 바뀌면 일차 번호가 다시 매겨지므로
  // 그 전에 적용하면 엉뚱한 날에 붙는다. {dayN: place|null} 형태다.
  if (f.dayPlaces) {
    for (var dn in f.dayPlaces) {
      if (Object.prototype.hasOwnProperty.call(f.dayPlaces, dn)) {
        setDayPlace(next, Number(dn), f.dayPlaces[dn]);
      }
    }
  }
  return next;
}

// 검증 → 적용 → 저장까지의 순수 로직. DOM에 손대지 않아 테스트에서 직접 호출할 수 있다.
// saveTrip은 localStorage 쓰기가 실제로 반영됐는지 읽어서 확인한 boolean을 돌려주므로
// (용량 초과·프라이빗 모드 등에서 조용히 no-op일 수 있음) 그 값을 무시하면 실패가
// 사용자에게 전혀 드러나지 않는다 — 새 여행이면 존재하지 않는 화면으로 이동해버리고,
// 수정이면 저장 안 된 새 값이 화면에 남아 성공한 것처럼 보인다.
function submitTripForm(trip, f) {
  var err = validateTripForm(f);
  if (err) return { ok: false, message: err };
  var saved = applyTripForm(trip, f);
  if (!saveTrip(saved)) {
    return { ok: false, message: '저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.', trip: saved };
  }
  return { ok: true, trip: saved };
}

function showEdit(id) {
  var trip = id ? loadTrip(id) : null;
  if (id && !trip) { go('#/'); return; }
  var el = document.getElementById("screen-edit");
  showScreen("edit");

  el.innerHTML =
    '<header class="ehead"><button id="e-back" type="button">←</button>' +
    '<h1>' + (trip ? '여행 설정' : '새 여행') + '</h1></header>' +
    '<form id="trip-form" class="eform">' +
      '<label>제목<input name="title" type="text" required placeholder="예: 오사카 여행" ' +
        'value="' + escHtml(trip ? trip.title : '') + '"></label>' +
      '<label>시작일<input name="start" type="date" required ' +
        'value="' + escHtml(trip ? trip.start : '') + '"></label>' +
      '<label>종료일<input name="end" type="date" required ' +
        'value="' + escHtml(trip ? trip.end : '') + '"></label>' +
      '<label>인원<input name="party" type="number" min="1" step="1" ' +
        'value="' + (trip ? Number(trip.party) : 2) + '"></label>' +
      '<label>숙소<textarea name="hotel" rows="2" ' +
        'placeholder="숙소명 · 체크인/아웃">' + escHtml(trip ? trip.hotel : '') + '</textarea></label>' +
      // 도시는 폼 필드가 아니라 검색으로 고른다 — 선택값은 pickedPlace에 담아두고
      // 저장할 때 함께 넘긴다(취소하면 반영되지 않는다).
      '<div class="geo-block">' +
        '<div class="geo-lbl">도시 <span class="geo-hint">(날씨에 쓰입니다)</span></div>' +
        '<div class="geo-cur" id="geo-cur"></div>' +
        '<div class="geo-row">' +
          '<input id="geo-q" type="text" placeholder="예: 오사카, Da Nang" aria-label="도시 검색">' +
          '<button id="geo-go" type="button">찾기</button>' +
        '</div>' +
        '<div class="geo-msg" id="geo-msg" hidden></div>' +
        '<ul class="geo-list" id="geo-list" hidden></ul>' +
      '</div>' +
      // 일차별 도시는 기존 여행에서만 — 새 여행은 아직 일차가 없다.
      (trip ? '<div class="daycity-block"><div class="geo-lbl">일차별 도시 ' +
        '<span class="geo-hint">(경유·이동하는 날만 지정하면 됩니다)</span></div>' +
        '<ul class="daycity-list" id="daycity-list"></ul></div>' : '') +
      '<div class="eerr" id="e-err" hidden></div>' +
      '<button type="submit">' + (trip ? '저장' : '만들기') + '</button>' +
    '</form>';

  document.getElementById("e-back").addEventListener("click", function () {
    go(trip ? '#/t/' + trip.id : '#/');
  });

  // undefined면 "도시를 건드리지 않음" — applyTripForm이 기존 값을 유지한다.
  var pickedPlace = undefined;
  // 일차별 오버라이드 {dayN: place|null}. 저장할 때만 반영된다.
  var pickedDayPlaces = {};
  // 검색 결과를 어디에 적용할지: null이면 여행 기본 도시, 숫자면 그 일차.
  var geoTarget = null;
  var curEl = document.getElementById("geo-cur");
  var msgEl = document.getElementById("geo-msg");
  var listEl = document.getElementById("geo-list");
  var qEl = document.getElementById("geo-q");
  var goEl = document.getElementById("geo-go");

  function paintCur() {
    var p = (pickedPlace !== undefined) ? pickedPlace : (trip ? trip.place : null);
    curEl.innerHTML = p
      ? '📍 ' + escHtml(placeLabel(p))
      : '<span class="geo-none">도시가 지정되지 않았습니다</span>';
  }
  paintCur();

  function showMsg(text) {
    msgEl.textContent = text;
    msgEl.hidden = !text;
  }

  function runSearch() {
    var q = qEl.value.trim();
    if (!q) return;
    goEl.disabled = true;
    listEl.hidden = true;
    showMsg('검색 중…');
    geoSearch(q, function (list, err) {
      goEl.disabled = false;
      if (err) { showMsg(err); return; }
      if (!list.length) {
        // 한국어 도시명은 대부분 그대로 찾힌다(다낭·호이안·타이베이 모두 O).
        // 그래도 안 나오면 철자나 더 큰 지명을 권한다.
        showMsg('결과가 없습니다. 철자를 확인하거나 가까운 큰 도시로 검색해 보세요.');
        return;
      }
      showMsg('');
      // 도시명·국가명은 외부 입력이다 — 반드시 escHtml을 거친다.
      listEl.innerHTML = list.map(function (p, i) {
        return '<li data-i="' + i + '">' + escHtml(placeLabel(p)) + '</li>';
      }).join('');
      listEl.hidden = false;
      listEl.querySelectorAll('li').forEach(function (li) {
        li.addEventListener('click', function () {
          var chosen = list[Number(li.dataset.i)];
          if (geoTarget === null) pickedPlace = chosen;
          else pickedDayPlaces[geoTarget] = chosen;
          geoTarget = null;
          listEl.hidden = true;
          qEl.value = '';
          paintCur();
          paintDays();

  function paintDays() {

  goEl.addEventListener('click', runSearch);

  // 실행되어 서로 다른 id로 여행이 두 개 저장된다. submitting 플래그로 막는다.
  var submitting = false;

    // 검색으로 고른 도시가 있을 때만 넘긴다 — undefined면 기존 값이 유지된다.
    if (pickedPlace !== undefined) f.place = pickedPlace;
    for (var _k in pickedDayPlaces) {

// ---- 일정 카드 편집 (Task 8) ----
// applyTripForm과 달리 여기 있는 addItem/updateItem/removeItem은 순수 함수가 아니다 —
// 인자로 받은 trip(과 그 trip.days 안의 day 객체)을 그 자리에서 고쳐 같은 참조를
// 돌려준다. 호출부(views.js)가 이 mutation을 전제로 저장 여부를 직접 챙긴다.

// 안정 정렬 — 같은 시간이면 원래 순서를 유지한다.
// time이 없거나 문자열이 아닌 항목(가져온 데이터가 손상됐거나 손으로 편집된 경우 등)은
// 정렬 키가 없는 셈이므로 목록 맨 뒤로 보낸다 — "시간 미정" 항목이 화면 아래쪽에 몰리는
// 게 자연스럽고, 무엇보다 a<b와 b<a가 둘 다 false가 되어 비교자가 모순(양방향 모두 1을
// 반환)에 빠지는 걸 피할 수 있다. 그 모순 때문에 정상 시간을 가진 항목들끼리도 상대
// 순서가 깨지는 게 원래 버그였다 — malformed 항목이 하나만 섞여도 Array.sort 구현에 따라
// 결과가 정의되지 않는다.
function sortItems(items) {
  function timeKey(it) {
    return typeof it.time === 'string' ? it.time : null;
  }
  return items.map(function (it, i) { return { it: it, i: i }; })
    .sort(function (a, b) {
      var ta = timeKey(a.it), tb = timeKey(b.it);
      if (ta === tb) return a.i - b.i;
      if (ta === null) return 1;
      if (tb === null) return -1;
      return ta < tb ? -1 : 1;
    })
    .map(function (w) { return w.it; });
}

// prompt()로 받은 시간 문자열을 "HH:MM"(24시간, 0-padded)으로 정규화한다. <input type=time>은
// 브라우저가 이미 이 형식을 강제하지만, prompt 경로는 아무 검증도 거치지 않으므로 여기서
// 막아야 한다. '9:00'처럼 시가 한 자리인 흔한 실수는 정규화해서 받아준다(sortItems가 문자열
// 사전순으로 비교하므로 '9:00'을 그대로 저장하면 '14:00'보다 뒤로 밀려버린다) — 그 밖의
// 잘못된 입력('9시', '', 'abc')은 null을 돌려줘 호출부가 거부하게 한다.
function normalizeTimeInput(s) {
  var m = /^([0-9]{1,2}):([0-9]{2})$/.exec(String(s).trim());
  if (!m) return null;
  var h = Number(m[1]), mi = Number(m[2]);
  if (h < 0 || h > 23 || mi < 0 || mi > 59) return null;
  return (h < 10 ? '0' : '') + h + ':' + m[2];
}

// 일정 입력(추가 폼·prompt 편집)이 공유하는 메시지. 두 경로가 같은 실수에 서로 다른
// 말을 하지 않도록 한 곳에 둔다.
var MSG_BAD_TIME = '시간 형식이 올바르지 않습니다. 예: 09:00';
var MSG_EMPTY_TEXT = '일정 내용을 입력해 주세요.';

// 추가 폼(item-add)의 입력을 저장 가능한 형태로 검증·정규화한다. <input type="time">이
// 지원되지 않는 환경에서는 이 입력이 그냥 text로 떨어져 '9:00' 같은 값이 그대로 들어오는데,
// sortItems가 문자열 사전순으로 비교하므로 그대로 저장하면 '14:00'보다 뒤로 밀린다 —
// prompt 편집 경로가 이미 거치는 검증(normalizeTimeInput + 빈 내용 거부)을 추가 폼도
// 똑같이 거치게 한다. ok:false면 message를 그대로 사용자에게 보여주면 된다.
function parseItemInput(rawTime, rawText) {
  var time = normalizeTimeInput(rawTime);
  if (!time) return { ok: false, message: MSG_BAD_TIME };
  var text = String(rawText == null ? '' : rawText).trim();
  if (!text) return { ok: false, message: MSG_EMPTY_TEXT };
  return { ok: true, time: time, text: text };
}

function findDay(trip, dayN) {
  return trip.days.filter(function (d) { return d.n === dayN; })[0] || null;
}

function addItem(trip, dayN, o) {
  var day = findDay(trip, dayN);
  if (!day) return trip;
  day.items.push({ id: newItemId(), time: o.time, text: o.text });
  day.items = sortItems(day.items);
  return trip;
}

function updateItem(trip, dayN, itemId, o) {
  var day = findDay(trip, dayN);
  if (!day) return trip;
  day.items.forEach(function (it) {
    if (it.id !== itemId) return;
    it.time = o.time;
    it.text = o.text;
  });
  day.items = sortItems(day.items);
  return trip;
}

function removeItem(trip, dayN, itemId) {
  var day = findDay(trip, dayN);
  if (!day) return trip;
  day.items = day.items.filter(function (it) { return it.id !== itemId; });
  return trip;
}

// 그 일차만 다른 도시일 때 지정한다. place가 null이면 여행 기본값 상속으로 되돌린다.
// addItem/updateItem/removeItem과 같은 계약 — 인자로 받은 trip을 그 자리에서 고친다.
function setDayPlace(trip, dayN, place) {
  var day = findDay(trip, dayN);
  if (!day) return trip;
  day.place = place || null;
  return trip;
}

<script>
// 해시 라우터와 부팅. 렌더는 views.js, 외부 조회는 remote.js에 있다.

// 그릴 일차를 고른다. 요청한 일차가 없거나(손상된 JSON을 가져온 경우 등)
// days 자체가 비어 있으면 던지지 않고 대신 오늘 → 첫날/마지막날 순으로 물러난다.
// 고를 수 있는 일차가 하나도 없으면 null.
// todayISO는 테스트에서 주입하기 위한 선택 인자다. 비우면 오늘 날짜를 쓴다.
function pickDay(trip, dayN, todayISO) {
  var days = (trip && Array.isArray(trip.days)) ? trip.days : [];
  // 손상된 저장값 보정은 고르기 전에, 그리고 고른 일차뿐 아니라 모든 일차에 대해 한다 —
  // 탭 목록(renderTabs)은 선택되지 않은 일차의 date까지 읽으므로(d.date.slice(5)),
  // 고른 일차만 보정해서는 date가 없는 다른 일차 하나 때문에 화면 전체가 죽는다.
  days.forEach(normalizeDay);
  if (!days.length) return null;
  var day = null;
  if (dayN) day = days.filter(function (d) { return d.n === dayN; })[0];
  var today = todayISO || todayLocal();
  if (!day) day = days.filter(function (d) { return d.date === today; })[0];
  if (!day) day = today < days[0].date ? days[0] : days[days.length - 1];
  return day || null;
}

// 일차만 바뀔 때 다시 그리는 것: 탭 + 타임라인. 그게 전부다.
// #fixed(고정 정보·짐·경비)는 건드리지 않는다 — innerHTML을 통째로 갈아엎으면

function showDay(trip, dayN) {

  if (day) {

    renderTimeline(trip, day, CUR.st);

    // wxRefresh는 이미 받아 둔 좌표면 곧바로 반환하므로 일차를 오갈 때 요청이 늘지 않는다.

function showTrip(id, tab, dayN) {

  // 누른 경우에는 showPanelTab만 돈다.
  var switched = (CUR.id !== id);
  var opening = switched || document.getElementById("screen-trip").hidden;

  // 여는 경우에만 저장소에서 다시 읽는다. 일차·탭 전환에서까지 loadTrip을 부르면
  // CUR.trip이 매번 새 객체로 갈아치워지는데, #summary는 여는 경로에서만
  // 다시 그려지므로 그 핸들러들은 "이전에 불러온" trip을 계속 붙들고 있게 된다.
  // 그 상태에서 편집 토글(renderSummary→repaintDay)을 누르면 타임라인 전체가 낡은
  // 스냅샷에 다시 묶이고, 그 뒤의 addItem/updateItem/removeItem + saveTripBody(trip)이
  // 탭 전환 이후 저장된 일정을 통째로 덮어써 지운다(실제로 재현됨).
  // 여는 경로는 항상 #summary를 함께 다시 그리므로, 그때만 다시 읽으면
  // 화면 위의 모든 핸들러가 언제나 CUR.trip 하나만 붙들게 된다.
  // 덤으로 탭을 누를 때마다 돌던 JSON.parse 한 번이 사라진다.
  var trip = opening ? loadTrip(id) : CUR.trip;

  // 돌아가 B를 열었을 때 B가 편집 모드로 열려버린다. 새로고침은 전역 변수 자체가 초기화되며
  // 자연히 꺼지므로 여기서는 "여행이 바뀌는" 경우만 챙기면 된다.
  if (switched) { wxResetAll(); EDIT_MODE = false; }
  showScreen("trip");

  if (opening) renderSummary(trip, CUR.st);
  showPanelTab(trip, tab || "day", dayN);
  // 날씨 요청은 여행을 열 때만, 그것도 최근에 받아온 게 없을 때만 보낸다.
  // 좌표는 지금 보고 있는 일차 기준이다(일차마다 도시가 다를 수 있다).

// 열어둔 것이 닫히고 입력 중이던 값이 날아간다.
function showPanelTab(trip, tab, dayN) {

  { key: "day",     icon: "🗓", label: "일정" },
  { key: "hotel",   icon: "🏨", label: "숙소" },
  { key: "packing", icon: "🎒", label: "준비물" },
  { key: "money",   icon: "💰", label: "경비" },
  { key: "info",    icon: "ℹ️", label: "정보" }
];
var TAB_KEYS = TAB_DEFS.map(function (t) { return t.key; });

// 여행 화면 해시를 {id, tab, dayN}으로. 여행 화면이 아니면 null.
// /edit은 일부러 안 잡는다 — 라우터가 별도 분기로 처리한다.
function parseTripHash(hash) {
  var m = String(hash || "").match(
    /^#\/t\/([^/]+)(?:\/(?:d\/(\d+)|(hotel|packing|money|info)))?$/);
  if (!m) return null;
  if (m[2]) return { id: m[1], tab: "day", dayN: parseInt(m[2], 10) };
  return { id: m[1], tab: m[3] || "day", dayN: null };
}

function tabHash(id, tab, dayN) {
  if (tab !== "day") return '#/t/' + id + '/' + tab;
  return dayN ? '#/t/' + id + '/d/' + dayN : '#/t/' + id;
}

function route() {
  var h = location.hash || "#/";
  var t = parseTripHash(h);
  if (t) { showTrip(t.id, t.tab, t.dayN); return; }
  if (/^#\/t\/[^/]+\/edit$/.test(h)) { showEdit(h.split('/')[2]); return; }
  if (h === "#/new") { showEdit(null); return; }
  showList();
}

window.addEventListener("hashchange", route);

document.addEventListener("DOMContentLoaded", function () {
  // 앱 화면이 없는 페이지(test.html 등)에서는 부팅하지 않는다.
  if (!document.getElementById("screen-list")) return;
  migrateLegacy();
  // 식사 메모 키를 일차 번호 기준에서 날짜 기준으로 옮긴다(store.js 주석 참고).
  // migrateLegacy 뒤에 두지만, 어느 쪽이 먼저 돌아도 결과가 같도록 설계돼 있다.
  migrateMealKeys();
  // 내장 섹션은 하단 탭이 됐다 — 데이터에 남아 있던 항목을 걷어낸다.
  migrateSections();

  document.getElementById("new-trip")
    .addEventListener("click", function () { go('#/new'); });
  document.getElementById("add-sample")
    .addEventListener("click", function () {
      // installSample은 저장 실패 시 null을 돌려준다 — 그대로 이동하면 showTrip이
      // 여행을 찾지 못해 목록으로 조용히 튕겨 나가고, 사용자는 아무 설명도 못 받는다.
      var id = installSample();
      if (!id) {
        alert('샘플 여행을 저장하지 못했습니다. 기기 저장 공간을 확인해 주세요.');
        return;
      }
      go('#/t/' + id);
    });

  // 여행이 하나뿐이면 목록을 건너뛰고 바로 연다.
  var trips = listTrips();
  if (!location.hash && trips.length === 1) { go('#/t/' + trips[0].id); return; }
  route();
});

</script>
