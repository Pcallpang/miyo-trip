<script>
// 외부 조회 계층: 날씨(Open-Meteo 예보). 캐시 우선이고, 실패해도 앱은 동작한다.
// DOM에 손대지 않는다 — 다시 그리는 것은 호출부(app.js의 wxRepaint)의 몫이다.
// schema.js 다음, views.js 앞에 로드된다.

var WX_DAILY = "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max";
// forecast_days 상한은 16이다. 7이면 2주 넘는 여행의 뒷부분 날씨가 빈다.
var WX_DAYS = 16;

// 좌표를 캐시 키로 쓴다. 소수점 3자리(약 100m)면 같은 도시가 같은 키로 모인다.
function wxKey(place) {
  if (!place) return "";
  var la = Math.round(Number(place.lat) * 1000) / 1000;
  var lo = Math.round(Number(place.lon) * 1000) / 1000;
  if (!isFinite(la) || !isFinite(lo)) return "";
  return la + "," + lo;
}

function wxUrl(place) {
  return "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + Number(place.lat) + "&longitude=" + Number(place.lon) +
    "&daily=" + WX_DAILY +
    "&timezone=" + encodeURIComponent(place.tz || "auto") +
    "&forecast_days=" + WX_DAYS;
}

function wxIcon(code) {
  if (code === 0) return { e: "☀️", t: "맑음" };
  if (code === 1 || code === 2) return { e: "🌤️", t: "구름 조금" };
  if (code === 3) return { e: "☁️", t: "흐림" };
  if (code === 45 || code === 48) return { e: "🌫️", t: "안개" };
  if (code >= 51 && code <= 57) return { e: "🌦️", t: "이슬비" };
  if (code >= 61 && code <= 67) return { e: "🌧️", t: "비" };
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return { e: "🌨️", t: "눈" };
  if (code >= 80 && code <= 82) return { e: "🌧️", t: "소나기" };
  if (code >= 95) return { e: "⛈️", t: "뇌우" };
  return { e: "🌡️", t: "" };
}
function wxDailyMap(api) {
  var m = {};
  if (!api || !api.daily || !api.daily.time) return m;
  api.daily.time.forEach(function (d, i) {
    var rain = api.daily.precipitation_probability_max[i];
    m[d] = {
      code: api.daily.weather_code[i],
      tmax: Math.round(api.daily.temperature_2m_max[i]),
      tmin: Math.round(api.daily.temperature_2m_min[i]),
      rain: (rain === null || rain === undefined) ? null : rain
    };
  });
  return m;
}
function wxLine(map, date) {
  var w = map[date];
  if (!w) return "";
  var rain = w.rain === null ? "" : " · 비 " + w.rain + "%";
  return wxIcon(w.code).e + " " + w.tmax + "° / " + w.tmin + "°" + rain;
}

// 좌표별 예보 캐시. 한 여행이 여러 도시를 지날 수 있으므로 단일 전역으로는 안 된다 —
// 그러면 A 도시 예보가 B 도시 화면에 그대로 남는다.
var wxMem = {};
// 여행을 바꾸면 진행 중이던 요청의 응답이 뒤늦게 도착해 새 여행의 캐시를 덮어쓸 수 있다.
// 세대 번호를 올려 두고 응답 처리 직전에 확인해 낡은 응답을 버린다.
var wxGen = 0;
function wxResetAll() { wxMem = {}; wxGen++; }

// 같은 세션에서 방금 받아온 예보는 다시 받지 않는다(일 단위 예보라 30분이면 충분).
var WX_TTL_MS = 30 * 60 * 1000;

// 메모리 캐시 → 저장소 캐시 순으로 찾는다. 둘 다 없으면 빈 맵을 준다 —
// 화면에서는 날씨 줄이 그냥 사라진다(예보 없는 날짜와 같은 처리, 오류 문구 없음).
function wxGet(st, place) {
  var k = wxKey(place);
  if (!k) return { map: {}, at: null, live: false, fetchedAt: 0 };
  if (wxMem[k]) return wxMem[k];
  var cached = st ? st.get("wx:" + k, null) : null;
  if (cached && cached.api) {
    wxMem[k] = { map: wxDailyMap(cached.api), at: cached.at, live: false, fetchedAt: 0 };
    return wxMem[k];
  }
  return { map: {}, at: null, live: false, fetchedAt: 0 };
}

function wxIsFresh(place) {
  var e = wxMem[wxKey(place)];
  return !!e && e.live && (Date.now() - e.fetchedAt) < WX_TTL_MS;
}

// 메모리 캐시(wxMem)만 읽는다 — 호출부는 같은 렌더 안에서 wxGet(st, place)를 먼저 불러
// 캐시를 채운 뒤 이 함수를 부른다. 그 순서를 지켜야 스탬프가 뜬다.
function wxStamp(place) {
  var e = wxMem[wxKey(place)];
  if (!e || e.live || !e.at) return "";
  var d = new Date(e.at);
  var hh = ("0" + d.getHours()).slice(-2);
  var mm = ("0" + d.getMinutes()).slice(-2);
  return ' <span class="wxstamp">(' + (d.getMonth() + 1) + "/" + d.getDate() +
    " " + hh + ":" + mm + " 기준)</span>";
}

// 좌표별로 예보를 받아 캐시에 넣는다. 다 되면 onDone()을 부른다 —
// remote.js가 렌더를 알지 못하게 콜백으로 뒤집었다(1단계 리뷰의 역방향 의존 지적).
// 진행 중인 요청의 좌표. wxIsFresh는 "응답이 도착한" 좌표만 걸러내므로, 같은 좌표로
// 연달아 부르면(여행을 열 때 showTrip이 한 번, 곧이어 showDay가 한 번) 응답 전이라
// 둘 다 요청을 보낸다. 이 표로 두 번째를 막는다.
var wxInflight = {};

function wxRefresh(st, place, onDone) {
  var k = wxKey(place);
  if (!k) return;
  if (wxIsFresh(place)) return;
  if (wxInflight[k]) return;
  wxInflight[k] = true;
  var gen = wxGen;
  // 저장소 캐시부터 화면에 올린다(오프라인이면 이게 전부다).
  wxGet(st, place);
  fetch(wxUrl(place)).then(function (r) {
    if (!r.ok) throw new Error("wx " + r.status);
    return r.json();
  }).then(function (api) {
    delete wxInflight[k];
    if (gen !== wxGen) return;   // 그 사이 여행이 바뀌었다 — 이 응답은 버린다
    st.set("wx:" + k, { at: new Date().toISOString(), api: api });
    wxMem[k] = { map: wxDailyMap(api), at: null, live: true, fetchedAt: Date.now() };
    if (onDone) onDone();
  }).catch(function () {
    delete wxInflight[k];
    if (gen !== wxGen) return;
    // 실패해도 캐시가 있으면 다시 그린다 — 시각 스탬프가 붙어야 하기 때문이다.
    if (wxMem[k] && wxMem[k].at && onDone) onDone();
  });
}

// ---- 도시 검색(지오코딩) ----

// language는 표시 언어뿐 아니라 검색 색인 자체를 고른다(2026-08-06 브라우저 실측).
// language=ko는 한국어 질의('다낭','호이안','타이베이' 8/8)와 영어 질의('Da Nang' 등
// 4/4)를 모두 받으면서 결과를 한국어로 돌려준다. 반대로 language=en은 같은 한국어
// 질의를 전부 0건으로 만든다. 그래서 ko 하나로 끝내고 폴백을 두지 않는다 —
// 폴백은 이득이 없을 뿐 아니라 한국어 사용자에게 해롭다.
function geoUrl(q, count) {
  return "https://geocoding-api.open-meteo.com/v1/search?name=" +
    encodeURIComponent(q) + "&language=ko&count=" + (count || 5);
}

// 0건이면 응답에 results 키가 아예 없다(실측) — 빈 배열로 받는다.
function geoParse(api) {
  var rows = (api && api.results) || [];
  return rows.map(function (r) {
    // cc(country_code)는 통화 자동 선택에 쓴다 — 국가명은 언어에 따라 비어 있을 수
    // 있지만(홍콩·마카오는 한국어 이름이 없다) 코드는 항상 온다.
    return { name: r.name, country: r.country, cc: r.country_code,
             lat: r.latitude, lon: r.longitude, tz: r.timezone };
  });
}

function placeLabel(place) {
  if (!place || !place.name) return "";
  return place.country ? place.name + " · " + place.country : place.name;
}

// cb(list, err). 실패해도 던지지 않는다 — 화면은 안내 문구만 바꾼다.
function geoSearch(q, cb) {
  var query = String(q || "").trim();
  if (!query) { cb([], null); return; }
  fetch(geoUrl(query, 5)).then(function (r) {
    if (!r.ok) throw new Error("geo " + r.status);
    return r.json();
  }).then(function (api) {
    cb(geoParse(api), null);
  }).catch(function () {
    cb([], '검색에 실패했습니다. 연결을 확인해 주세요.');
  });
}

// ---- 환율 ----

// KRW 기준 한 번 조회로 166개 통화를 모두 얻는다(실측). 키 불요, CORS 허용.
// rates는 "1 KRW당 해당 통화"다 — 원화 환산은 money.js의 toKRW가 뒤집어 계산한다.
var FX_URL = "https://open.er-api.com/v6/latest/KRW";
// 환율은 하루 한 번 갱신된다(time_next_update_utc 실측). 날씨의 30분과 달리 길게 잡는다.
var FX_TTL_MS = 12 * 60 * 60 * 1000;
// 무료 등급 이용 조건: "We require attribution on the pages you're using these rates".
// 앱 톤에 맞춰 눈에 띄지 않게 둬도 되지만 링크 자체는 있어야 한다.
var FX_ATTRIB_HTML =
  '<a class="fx-attrib" href="https://www.exchangerate-api.com" ' +
  'target="_blank" rel="noopener">환율 제공: Exchange Rate API</a>';

// 여행 밖 전역 키 하나 — 통화가 무엇이든 같은 응답을 쓴다.
function fxGet() {
  var v = lsGet("fx", null);
  return (v && v.rates) ? v : null;
}

// 사용자가 직접 넣은 환율은 "1단위당 원화"(예: 엔당 9원)로 저장된다.
// rates는 반대 축(1원당 통화)이므로 뒤집어서 얹는다. 0이나 음수는 무시한다.
function fxRates(st) {
  var base = fxGet();
  var out = {};
  if (base && base.rates) {
    for (var k in base.rates) {
      if (Object.prototype.hasOwnProperty.call(base.rates, k)) out[k] = base.rates[k];
    }
  }
  var manual = st ? st.get("fxManual", null) : null;
  if (manual) {
    for (var c in manual) {
      if (!Object.prototype.hasOwnProperty.call(manual, c)) continue;
      var krwPerUnit = Number(manual[c]);
      if (isFinite(krwPerUnit) && krwPerUnit > 0) out[c] = 1 / krwPerUnit;
    }
  }
  return out;
}

function fxIsFresh() {
  var v = fxGet();
  if (!v || !v.fetchedAt) return false;
  return (Date.now() - v.fetchedAt) < FX_TTL_MS;
}

var fxInflight = false;

// 캐시 우선. 실패해도 조용히 넘어간다 — 수동 입력이 항상 있으므로 앱은 계속 동작한다.
function fxRefresh(onDone) {
  if (fxIsFresh() || fxInflight) return;
  fxInflight = true;
  fetch(FX_URL).then(function (r) {
    if (!r.ok) throw new Error("fx " + r.status);
    return r.json();
  }).then(function (api) {
    fxInflight = false;
    if (!api || api.result !== "success" || !api.rates) return;
    lsSet("fx", { at: api.time_last_update_utc || new Date().toISOString(),
                  fetchedAt: Date.now(), rates: api.rates });
    if (onDone) onDone();
  }).catch(function () {
    fxInflight = false;
  });
}

</script>
<script>
// 렌더 계층: DOM에 그리는 함수만 모은다.
// trip(여행 본체)과 st(tripStore)를 인자로 받는다 — 전역 여행/저장소를 읽지 않는다.
// schema.js·remote.js 다음, app.js 앞에 로드된다 (dowOf/daysBetween은 schema.js,
// wxGet/wxLine/wxStamp는 remote.js, dayPlace는 schema.js).

// ---- 미요 캐릭터 ----
// 미요 앱 시리즈 공통 마스코트. UI의 "무엇을 하는 자리인지" 알리는 아이콘 자리에만
// 쓴다 — 날씨(☀️🌧️)나 정보 탭의 🔌🚨처럼 그림 자체가 뜻을 가진 것은 그대로 둔다.
// 이름은 SNAseating의 assets/mascot 규칙을 따른다.
var MIYO = {
  day: "nep-miyo",          // 일정 — 노트북 앞 "넵!"
  hotel: "pingp-miyo",      // 숙소 — 폰 위에 누워 쉬는
  packing: "yarr-miyo",     // 준비물 — 브이, 준비 완료
  money: "ppak-miyo",       // 경비 — 돈 나갈 때 그 표정
  info: "tip-miyo",         // 정보 — 안경 쓰고 훈수
  // 목록 헤더와 앱 아이콘은 야르미요다(index.html·icon-*).
  share: "parrot-miyo",     // 공유 — 말을 옮기는
  note: "why-miyo",         // 메모
  empty: "clear-eye-miyo",  // 빈 화면
  fail: "sweat-miyo"        // 오류·실패
};

// 단일 파일 번들(trip.html)에는 assets/ 폴더가 없다 — bundle.py가 캐릭터를
// data: URI 표(MIYO_DATA)로 심어 두므로, 있으면 그쪽을 먼저 쓴다.
function miyoSrc(name) {
  var table = (typeof MIYO_DATA !== 'undefined') ? MIYO_DATA : null;
  return (table && table[name]) ? table[name] : ('assets/miyo/' + name + '.webp');
}

// alt는 비워 둔다 — 옆에 늘 글자 라벨이 함께 있어 읽어 주면 중복이 된다.
function miyoImg(name, cls) {
  return '<img class="miyo' + (cls ? ' ' + cls : '') + '" src="' + miyoSrc(name) +
    '" alt="" loading="lazy">';
}

// 사용자가 입력한 문자열이 HTML로 해석되지 않게 막는다.
function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// escape를 먼저 하고, 배지 판정은 원본 텍스트로 한다.
function itemLinesHtml(text) {
  return String(text).split('\n').map(function (l) {
    var e = escHtml(l);
    if (/\(패스권-시간\)|\(시간\)/.test(l)) {
      return '<div class="line timed"><span class="tag">⏰ 시간지정</span>' + e + '</div>';
    }
    if (/예약 완료/.test(l)) {
      return '<div class="line booked"><span class="tag">✅ 예약완료</span>' + e + '</div>';
    }
    return '<div class="line">' + e + '</div>';
  }).join('');
}

// 편집 토글은 두지 않는다. 이 앱은 내 여행을 내가 고치는 것뿐이라 "보는 사람"과
// "고치는 사람"이 갈리지 않고, 입력이 모달로 옮겨간 뒤로는 폼이 화면을 어지럽히지도
// 않는다. 항목을 탭하면 편집 모달이 열리고(삭제도 그 안에서), 추가 버튼은 늘 보인다.

// text가 문자열이 아닌 손상된 항목(검증 없이 가져온 JSON 등)에서도 던지지 않는다 —
// normalizeDay가 렌더 전에 보정하지만, 이 판정 자체도 같은 계약을 지킨다.
function isUndecided(text) {
  var t = String(text == null ? "" : text).trim();
  return /뭐먹지|\?$/.test(t) || t === "";
}

function dday(todayISO, startISO, endISO) {
  const day = 86400000;
  const t = Date.parse(todayISO + "T00:00:00");
  const s = Date.parse(startISO + "T00:00:00");
  const e = Date.parse(endISO + "T00:00:00");
  if (t < s) return "D-" + Math.round((s - t) / day);
  if (t > e) return "여행 종료";
  return "여행 중 " + (Math.round((t - s) / day) + 1) + "일차";
}

// ---- 현지 경비 ----

function spendList(st) {
  var v = st.get("spend", []);
  return Array.isArray(v) ? v : [];
}

// 경비 탭과 일차 카드가 같은 저장소를 쓴다 — 어디서 넣었든 한 곳에 쌓이고 합계도
// 하나다. id는 시간 기준이라 같은 밀리초에 두 건이 들어오면 겹칠 수 있어 비켜 준다.
function spendAdd(st, rec) {
  var list = spendList(st);
  var id = Date.now();
  while (list.some(function (x) { return x.id === id; })) id++;
  var made = {
    id: id,
    date: rec.date,
    amount: rec.amount,
    cur: rec.cur,
    cat: rec.cat,
    note: String(rec.note == null ? '' : rec.note).trim()
  };
  list.push(made);
  st.set("spend", list);
  return made;
}

// 날짜는 건드리지 않는다 — 기록을 넣은 날이 곧 그 지출이 일어난 날이고, 금액을
// 고치다가 다른 일차로 옮겨가면 안 된다.
function spendUpdate(st, id, f) {
  var list = spendList(st);
  var hit = false;
  list.forEach(function (e) {
    if (!e || e.id !== id) return;
    hit = true;
    e.amount = f.amount;
    e.cur = f.cur;
    e.cat = f.cat;
    e.note = String(f.note == null ? '' : f.note).trim();
  });
  if (hit) st.set("spend", list);
  return hit;
}

function spendRemove(st, id) {
  st.set("spend", spendList(st).filter(function (x) { return x && x.id !== id; }));
}

// 그 일차의 기록만. 최근에 넣은 것이 아래로 가도록 넣은 순서 그대로 둔다 —
// 하루치는 몇 줄뿐이라 시간순으로 읽는 편이 자연스럽다.
function daySpend(st, date) {
  if (!date) return [];
  return spendList(st).filter(function (e) { return e && e.date === date; });
}

// 일차 번호(n)가 아니라 날짜로 키를 잡는다 — resyncDays가 날짜를 기준으로 일차를
// 보존하면서 n을 1부터 다시 매기기 때문에, n으로 키를 잡으면 시작일을 하루만 앞당겨도
// 메모가 통째로 밀려 엉뚱한 날에 붙거나 화면에서 사라진다(store.js의 migrateMealKeys 참고).
// 날짜는 문자열이므로 속성 컨텍스트에 넣을 때 반드시 escHtml을 거쳐야 한다.
function mealKey(date, i) { return "meal:" + String(date) + ":" + i; }

// ---- 상단 요약 ----

// lead가 true면(다른 요약 텍스트 뒤가 아니라 줄의 맨 앞이면) "· " 구분자를 붙이지 않는다.
// 통화가 여럿이면 요약 한 줄에 다 담을 수 없으므로 원화 환산 총합만 보여준다 —
// 통화별 내역은 경비 탭에서 본다.
function summarySpend(st, lead) {
  var totals = spendTotals(spendList(st));
  if (!totals.length) return '';
  var rates = fxRates(st);
  var body;
  if (totals.length === 1) {
    var one = totals[0];
    var krw = toKRW(one.amount, one.cur, rates);
    // 통화 기호는 외부 입력이 될 수 있다(가져온 JSON의 currency.symbol) — escHtml 필수.
    body = '현지 ' + escHtml(fmtAmount(one.amount, currencyByCode(one.cur))) +
      (krw === null ? '' : ' (약 ' + escHtml(fmtKRW(krw)) + ')');
  } else {
    // 환산할 수 없는 통화가 하나라도 있으면 총합이 거짓이 되므로 "+" 표시를 붙인다.
    var sum = 0, partial = false;
    totals.forEach(function (t) {
      var k = toKRW(t.amount, t.cur, rates);
      if (k === null) partial = true; else sum += k;
    });
    body = '현지 ' + totals.length + '개 통화' +
      (sum ? ' (약 ' + escHtml(fmtKRW(sum)) + (partial ? '+' : '') + ')' : '');
  }
  // lead면 줄의 맨 앞이므로 선행 공백도 붙이지 않는다 — 붙이면 .cost가 공백으로 시작한다.
  var dot = lead ? '' : '· ';
  var gap = lead ? '' : ' ';
  return gap + '<span class="spent">' + dot + body + '</span>';
}

function renderSummary(trip, st) {
  const today = todayLocal();
  const el = document.getElementById("summary");
  const nights = daysBetween(trip.start, trip.end) - 1;
  el.innerHTML =
    '<button class="back-list" type="button" aria-label="여행 목록">←</button>' +
    '<button class="share-trip" type="button">' + miyoImg(MIYO.share) + '공유</button>' +
    '<button class="edit-trip" type="button" aria-label="여행 설정">⚙</button>' +
    '<div class="dday">' + dday(today, trip.start, trip.end) + '</div>' +
    '<h1>' + escHtml(trip.title) + '</h1>' +
    '<div class="period">' + escHtml(trip.start) + ' ~ ' + escHtml(trip.end) +
      ' · ' + nights + '박 ' + (nights + 1) + '일</div>' +
    (function () {
      // 여행 기본 도시의 오늘 날씨. 도시를 지정하지 않은 여행이면 캐시가 비어
      // 줄 자체가 사라진다(예보 없는 날짜와 같은 처리 — 오류 문구를 넣지 않는다).
      var place = trip.place;
      var line = wxLine(wxGet(st, place).map, todayLocal());
      return line ? '<div class="wx">' + line.replace(" ", " 오늘 ") + wxStamp(place) + '</div>' : '';
    })() +
    (function () {
      // 사전 예산(budgetKRW)과 현지 경비 합계(summarySpend)는 서로 독립된 정보다.
      // 예산을 입력하지 않은 여행(생성/설정 화면에 그 입력란이 없어 기본값 0으로
      // 남는 게 보통이다)이라도 경비를 기록했다면 그 합계는 보여야 한다.
      var budgetLine = trip.budgetKRW
        ? '총 ' + Number(trip.budgetKRW).toLocaleString('ko-KR') + '원 (' +
          Number(trip.party) + '인)'
        : '';
      var spendLine = summarySpend(st, !budgetLine);
      if (!budgetLine && !spendLine) return '';
      return '<div class="cost">' + budgetLine + spendLine + '</div>';
    })();
  var bl = el.querySelector('.back-list');
  if (bl) bl.addEventListener('click', function () { go('#/'); });
  var sb = el.querySelector('.share-trip');
  if (sb) sb.addEventListener('click', function () { openShareModal(trip); });
  var eb = el.querySelector('.edit-trip');
  if (eb) eb.addEventListener('click', function () { go('#/t/' + trip.id + '/edit'); });
}

// ---- 일차 탭 / 타임라인 ----

function renderTabs(trip, selectedN, onSelect) {
  const nav = document.getElementById("daytabs");
  nav.innerHTML = trip.days.map(function (d) {
    const on = d.n === selectedN ? ' data-selected="1"' : '';
    return '<button class="tab"' + on + ' data-n="' + Number(d.n) + '">' +
      '<span class="tn">' + Number(d.n) + '일차</span>' +
      '<span class="td">' + escHtml(d.date.slice(5)) + '(' + dowOf(d.date) + ')</span></button>';
  }).join('');
  nav.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { onSelect(parseInt(b.dataset.n, 10)); });
  });
  // 탭이 많은 여행(30일)에서 현재 일차가 화면 밖에 있는 것을 막는다.
  const sel = nav.querySelector('.tab[data-selected]');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

// saveTripBody가 실패했을 때 trip.days를 저장소 값으로 되돌릴지 판단하는 순수 로직.
// DOM에도 alert에도 손대지 않으므로 테스트에서 바로 호출할 수 있다(afterItemEdit을
// 통째로 테스트하려면 alert 스텁이 필요한데, 그 스텁 없이도 이 판단 로직 자체는
// 검증할 수 있게 분리했다). ok가 true면 아무 것도 하지 않는다.
// 저장소에서 이 여행 자체를 못 찾으면(예: 다른 탭에서 삭제됨) 되돌릴 원본이 없다는
// 뜻이라 lost:true를 돌려준다 — 이 경우 메모리 위 trip.days는 여전히 실패한 시도로
// 오염된 phantom 상태이므로, 호출부는 그 화면을 그대로 다시 그리지 말고 안전한 곳으로
// 옮겨야 한다.
function reconcileAfterSaveFail(trip, ok) {
  if (ok) return { reverted: false, lost: false };
  var fresh = loadTrip(trip.id);
  if (fresh) { trip.days = fresh.days; return { reverted: true, lost: false }; }
  return { reverted: false, lost: true };
}

// 일정·메모 추가·수정·삭제 후 공통으로 거치는 경로.
// saveTripBody의 성공 여부를 반드시 확인한다 — 확인 없이 넘기면 저장이 조용히 실패해도
// 화면은 성공한 것처럼 보인다. 실패하면 사용자에게 알리고, 이미 메모리 위에서 고쳐놓은
// trip.days를 저장소의 실제 값으로 되돌려 다음 조작이 이번에 실패한 시도 위에 쌓이지
// 않게 한다(reconcileAfterSaveFail). 다시 그리는 범위는 타임라인뿐이다(요구사항: 일차
// 전환/편집 토글과 마찬가지로 #fixed는 건드리지 않는다) — repaintDay가 day.items가
// 배열이 아닌 경우의 보정도 함께 해 준다(showDay가 여는 경로에서 하는 것과 동일).
function afterItemEdit(trip, day, st, ok) {
  var res = reconcileAfterSaveFail(trip, ok);
  if (res.lost) {
    alert('일정 저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.');
    go('#/');
    return;
  }
  if (res.reverted) alert('일정 저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.');
  repaintDay(trip, day.n, st);
}


function renderTimeline(trip, day, st) {
  const main = document.getElementById("timeline");
  // 줄 자체가 편집 버튼이다 — 수정·삭제 버튼을 매 줄에 붙이면 읽을 때 복잡하고,
  // 폰에서 잘못 누르기도 쉽다. 삭제는 편집 모달 안에 둔다.
  const slots = day.items.map(function (it) {
    const cls = isUndecided(it.text) ? ' undecided' : '';
    return '<button class="slot' + cls + '" type="button" data-item="' + escHtml(it.id) + '">' +
      '<div class="time">' + escHtml(it.time) + '</div>' +
      '<div class="what">' + itemLinesHtml(it.text) + '</div></button>';
  }).join('');
  // 새로 만든 여행의 1일차는 일정이 하나도 없다 — 무엇을 하면 되는지 알려 준다.
  const rows = slots || ('<div class="empty">' + miyoImg(MIYO.empty, 'miyo-lg') +
    '<p>아직 일정이 없습니다. 위 + 를 눌러 추가해 보세요.</p></div>');
  // 자유 메모. 예전의 "뭐먹지"(엑셀에서 온 문구 + 답 입력칸)를 대체한다 —
  // 그 틀에 맞지 않는 메모(예약 번호, 챙길 것)를 적을 곳이 없었다.
  const noteList = Array.isArray(day.notes) ? day.notes : [];
  // 메모는 카드 밑에 늘어놓지 않고 모달 안에서 본다 — 일정 흐름을 읽는 데 방해가
  // 되지 않으면서, 열면 목록·추가·수정·삭제가 한자리에 있다. 버튼에 개수만 알린다.
  const noteCount = noteList.length;
  // 경비도 메모와 같은 자리에서 연다 — 카드에 목록을 통째로 붙이면 일정이 밀려
  // 내려가 정작 일정을 읽기 어려워진다. 버튼에는 그날 합계를 얹어, 열지 않고도
  // "오늘 얼마 썼나"는 바로 보이게 한다.
  const spendBadge = daySpendBadge(st, day.date);
  main.innerHTML =
    '<div class="daycard"><div class="dayhead">' +
      '<span class="dnum">' + Number(day.n) + '일차</span> ' +
      '<span class="ddate">' + escHtml(day.date) + '(' + dowOf(day.date) + ')</span>' +
      // 그날 어디서 자고 어느 도시에 있는지가 그 일차에서 가장 먼저 알고 싶은 것이다.
      // 여행 설정에서 정한 도시(일차 오버라이드가 있으면 그것)와 숙소를 여기 붙인다 —
      // 요약 헤더의 숙소 줄은 이것과 겹쳐 없앴다.
      (function () {
        var dp = dayPlace(trip, day);
        var city = dp && dp.name
          ? '<div class="dcity">📍 ' + escHtml(dp.name) + '</div>' : '';
        var h = dayHotel(trip, day);
        // 숙소는 여러 줄 textarea다 — 줄바꿈을 가운뎃점으로 이어 한 줄에 눌러 담는다.
        var hotel = h ? '<div class="dhotel">🏨 ' + escHtml(h).replace(/\n/g, ' · ') + '</div>' : '';
        var line = wxLine(wxGet(st, dp).map, day.date);
        var wx = line ? '<div class="dwx">' + line + wxStamp(dp) + '</div>' : '';
        return city + hotel + wx;
      })() +
      // 입력은 모달에서 받는다 — 폼을 카드에 붙이면 스크롤이 길어져 불편하다.
      // 일정 추가는 아이콘 하나로 충분하다(무엇에 대한 +인지는 자리가 말해 준다).
      '<div class="day-actions">' +
        '<button class="day-add-item" type="button" aria-label="일정 추가">+</button>' +
        '<button class="day-note" type="button">' + miyoImg(MIYO.note) + '메모' +
          (noteCount ? ' <span class="nbadge">' + noteCount + '</span>' : '') +
        '</button>' +
        '<button class="day-spend" type="button">' + miyoImg(MIYO.money) + '경비' +
          (spendBadge ? ' <span class="sbadge">' + spendBadge + '</span>' : '') +
        '</button>' +
      '</div></div>' +
      '<div class="slots">' + rows + '</div></div>';

  var noteBtn = main.querySelector('.day-note');
  if (noteBtn) noteBtn.addEventListener('click', function () {
    openNotesModal(trip, day, st);
  });
  var spendBtn = main.querySelector('.day-spend');
  if (spendBtn) spendBtn.addEventListener('click', function () {
    openSpendListModal(trip, day, st);
  });

  main.querySelectorAll('.memo').forEach(function (inp) {
    inp.addEventListener('input', function () { st.set(inp.dataset.key, inp.value); });
  });
  main.querySelectorAll('.slot').forEach(function (b) {
    b.addEventListener('click', function () {
      var it = day.items.filter(function (x) { return x.id === b.dataset.item; })[0];
      if (it) openItemModal(trip, day, st, it);
    });
  });
  var addItemBtn = main.querySelector('.day-add-item');
  if (addItemBtn) addItemBtn.addEventListener('click', function () {
    openItemModal(trip, day, st, null);
  });
}

// ---- 일차 카드의 경비 ----
// 여행 중에는 "오늘 얼마 썼나"를 그날 화면에서 바로 보고 바로 적을 수 있어야 한다.
// 경비 탭과 같은 저장소를 쓰므로 어디서 넣든 합계는 하나다. 다만 여기서 넣는 기록은
// 오늘이 아니라 그 일차의 날짜로 붙는다 — 지난 날의 지출을 나중에 적을 수 있어야 한다.
// 버튼에 얹는 그날 합계. 통화가 하나면 금액을, 여럿이면 개수만 — 버튼 하나에
// 여러 통화를 늘어놓으면 줄이 넘친다(자세한 건 열어서 본다).
function daySpendBadge(st, date) {
  var totals = spendTotals(daySpend(st, date));
  if (!totals.length) return '';
  if (totals.length === 1) {
    return escHtml(fmtAmount(totals[0].amount, currencyByCode(totals[0].cur)));
  }
  return escHtml(totals.length + '개 통화');
}

// 경비 목록 모달의 본문. 합계·목록·추가 버튼이 한자리에 있다(메모 모달과 같은 꼴).
function daySpendListHtml(st, date) {
  var list = daySpend(st, date);
  var rates = fxRates(st);
  // 현지 통화만 보고는 얼마를 쓴 건지 감이 안 온다 — 원화를 나란히 낸다.
  // 환율을 모르는 통화(또는 아직 환율을 못 받아온 상태)면 그 자리는 비운다:
  // 틀린 숫자를 내느니 안 내는 편이 낫다.
  function krwSpan(amount, cur, cls) {
    var k = toKRW(amount, cur, rates);
    return k === null ? '' : '<span class="' + cls + '">약 ' + escHtml(fmtKRW(k)) + '</span>';
  }
  var rows = list.map(function (e) {
    return '<button class="dsp-r" type="button" data-id="' + Number(e.id) + '">' +
      '<span class="dsp-cat">' + escHtml(e.cat) + '</span>' +
      '<span class="dsp-note">' + escHtml(e.note || e.cat) + '</span>' +
      '<span class="dsp-amt">' +
        escHtml(fmtAmount(e.amount, currencyByCode(e.cur))) +
        krwSpan(e.amount, e.cur, 'dsp-krw') + '</span></button>';
  }).join('');
  // 하루 안에서도 통화가 섞일 수 있다(국경을 넘는 날) — 통화별로 한 줄씩 낸다.
  var totals = spendTotals(list).map(function (t) {
    return '<div class="dsp-t">' +
      escHtml(fmtAmount(t.amount, currencyByCode(t.cur))) +
      krwSpan(t.amount, t.cur, 'dsp-tkrw') + '</div>';
  }).join('');
  return (totals ? '<div class="dsp-ts">' + totals + '</div>' : '') +
    (rows ? '<div class="dsps">' + rows + '</div>'
          : '<p class="dsp-empty">아직 기록이 없습니다.</p>') +
    '<button class="dsp-add" type="button">+ 경비 추가</button>';
}

// ---- 일차 카드의 경비 ----
// 여행 중에는 "오늘 얼마 썼나"를 그날 화면에서 바로 보고 바로 적을 수 있어야 한다.
// 경비 탭과 같은 저장소를 쓰므로 어디서 넣든 합계는 하나다. 다만 여기서 넣는 기록은
// 오늘이 아니라 그 일차의 날짜로 붙는다 — 지난 날의 지출을 나중에 적을 수 있어야 한다.
function openSpendListModal(trip, day, st) {
  var form = modalOpen({
    title: '경비 · ' + Number(day.n) + '일차',
    closeLabel: '닫기',
    html: daySpendListHtml(st, day.date)
  });
  form.querySelector('.dsp-add').addEventListener('click', function () {
    openSpendModal(trip, day, st, null);
  });
  form.querySelectorAll('.dsp-r').forEach(function (b) {
    b.addEventListener('click', function () {
      var e = daySpend(st, day.date).filter(function (x) {
        return String(x.id) === b.dataset.id;
      })[0];
      if (e) openSpendModal(trip, day, st, e);
    });
  });
}

function openSpendModal(trip, day, st, e) {
  // 기록이 바뀌면 카드의 합계 배지와 요약 헤더의 지출 합계가 같이 움직여야 한다.
  function repaint() {
    repaintDay(trip, day.n, st);
    renderSummary(trip, st);
  }

  // 기본 통화는 그 일차의 통화다(없으면 여행 기본값) — 일차마다 다를 수 있다.
  var def = currencyByCode((dayCurrency(trip, day) || {}).code || 'KRW');
  var code = e ? e.cur : def.code;
  var cur = currencyByCode(code);
  var codes = CURRENCIES.map(function (c) { return c.code; });
  if (codes.indexOf(code) === -1) codes.unshift(code);
  modalOpen({
    title: (e ? '경비 수정' : '경비 추가') + ' · ' + Number(day.n) + '일차',
    submitLabel: e ? '저장' : '추가',
    onDelete: e ? function () { spendRemove(st, e.id); repaint(); } : null,
    deleteConfirm: '이 기록을 삭제할까요?',
    // 저장·삭제가 끝나면 목록으로 돌아간다(메모와 같은 흐름) — 하루치 지출을
    // 몰아서 적을 때 매번 카드에서 다시 여는 왕복을 없앤다.
    onDone: function () { openSpendListModal(trip, day, st); },
    html:
      '<div class="modal-row">' +
        '<label>금액<input class="sp-amt" type="number" inputmode="decimal" min="0" ' +
          'step="' + (cur.decimals > 0 ? '0.01' : '1') + '" required ' +
          'value="' + (e ? Number(e.amount) : '') + '"></label>' +
        '<label class="m-narrow2">통화<select class="sp-cur">' +
          codes.map(function (c) {
            return '<option value="' + escHtml(c) + '"' +
              (c === code ? ' selected' : '') + '>' + escHtml(c) + '</option>';
          }).join('') + '</select></label>' +
      '</div>' +
      '<label>분류<select class="sp-cat">' +
        SPEND_CATS.map(function (c) {
          return '<option' + (e && e.cat === c ? ' selected' : '') + '>' + escHtml(c) + '</option>';
        }).join('') + '</select></label>' +
      '<label>내용<input class="sp-note" type="text" placeholder="예: 반미 2개" ' +
        'value="' + escHtml(e ? (e.note || '') : '') + '"></label>' +
      '<p class="sp-krw" id="sp-krw"></p>',
    onSubmit: function (form) {
      var codeNow = form.querySelector('.sp-cur').value;
      var c = currencyByCode(codeNow);
      // 소수점 자릿수에 맞춰 반올림한다 — JPY에 12.5를 넣으면 13이 된다.
      var p = Math.pow(10, c.decimals);
      var amount = Math.round(Number(form.querySelector('.sp-amt').value) * p) / p;
      if (!isFinite(amount) || amount <= 0) return '금액을 올바르게 입력하세요.';
      var f = { amount: amount, cur: codeNow,
                cat: form.querySelector('.sp-cat').value,
                note: form.querySelector('.sp-note').value };
      if (e) spendUpdate(st, e.id, f);
      else spendAdd(st, { date: day.date, amount: f.amount, cur: f.cur,
                          cat: f.cat, note: f.note });
      repaint();
      return null;
    }
  });
  // 치는 동안 원화가 보여야 "이게 얼마짜리인지"를 그 자리에서 안다.
  var curSel = document.querySelector('.modal-form .sp-cur');
  var amtEl = document.querySelector('.modal-form .sp-amt');
  var krwEl = document.getElementById('sp-krw');
  function paintKrw() {
    if (!krwEl) return;
    var n = Number(amtEl.value);
    var k = (isFinite(n) && n > 0) ? toKRW(n, curSel.value, fxRates(st)) : null;
    krwEl.textContent = k === null ? '' : '약 ' + fmtKRW(k);
  }
  paintKrw();
  if (amtEl) amtEl.addEventListener('input', paintKrw);
  // 통화를 바꾸면 금액 입력의 step도 따라가야 한다 — 기본값이 VND(step=1)인데
  // USD를 고르면 12.50을 넣을 수 없다(HTML5 검증에 걸려 제출 자체가 막힌다).
  if (curSel) curSel.addEventListener('change', function () {
    var c2 = currencyByCode(curSel.value);
    if (amtEl) amtEl.step = c2.decimals > 0 ? '0.01' : '1';
    paintKrw();
  });
}

// 일정 추가·수정. 두 경우가 같은 폼을 쓰므로 검증도 한 곳(parseItemInput)만 거친다.
function openItemModal(trip, day, st, it) {
  modalOpen({
    title: (it ? '일정 수정' : '일정 추가') + ' · ' + Number(day.n) + '일차',
    submitLabel: it ? '저장' : '추가',
    // 삭제는 모달 안에 둔다 — 목록에 삭제 버튼을 늘어놓으면 읽을 때 복잡하고
    // 폰에서 잘못 누르기 쉽다.
    onDelete: it ? function () {
      removeItem(trip, day.n, it.id);
      afterItemEdit(trip, day, st, saveTripBody(trip));
    } : null,
    deleteConfirm: '이 일정을 삭제할까요?',
    html:
      '<label>시간<input class="m-time" type="time" step="300" required ' +
        'value="' + escHtml(it ? it.time : '') + '"></label>' +
      '<label>내용<textarea class="m-text" rows="4" required ' +
        'placeholder="예: 이치란 라멘 신사이바시점">' + escHtml(it ? it.text : '') + '</textarea></label>',
    onSubmit: function (form) {
      var p = parseItemInput(form.querySelector('.m-time').value,
                            form.querySelector('.m-text').value);
      if (!p.ok) return p.message;
      if (it) updateItem(trip, day.n, it.id, { time: p.time, text: p.text });
      else addItem(trip, day.n, { time: p.time, text: p.text });
      afterItemEdit(trip, day, st, saveTripBody(trip));
      return null;
    }
  });
}

// 메모 목록 모달. 여기서 항목을 누르면 편집 모달로 넘어가고, 저장·삭제 뒤에는
// 다시 이 목록으로 돌아온다 — 메모를 여러 개 손볼 때 매번 카드에서 다시 여는
// 왕복을 없앤다.
function openNotesModal(trip, day, st) {
  var list = Array.isArray(day.notes) ? day.notes : [];
  var body = list.length
    ? '<div class="mnotes">' + list.map(function (n) {
        return '<button class="mnote" type="button" data-id="' + escHtml(n.id) + '">' +
          itemLinesHtml(n.text) + '</button>';
      }).join('') + '</div>'
    : '<p class="mnote-empty">아직 메모가 없습니다.</p>';
  var form = modalOpen({
    title: '메모 · ' + Number(day.n) + '일차',
    closeLabel: '닫기',
    html: body + '<button class="mnote-add" type="button">+ 메모 추가</button>'
  });
  form.querySelector('.mnote-add').addEventListener('click', function () {
    openNoteModal(trip, day, st, null);
  });
  form.querySelectorAll('.mnote').forEach(function (b) {
    b.addEventListener('click', function () {
      var n = list.filter(function (x) { return x.id === b.dataset.id; })[0];
      if (n) openNoteModal(trip, day, st, n);
    });
  });
}

function openNoteModal(trip, day, st, note) {
  modalOpen({
    title: (note ? '메모 수정' : '메모 추가') + ' · ' + Number(day.n) + '일차',
    submitLabel: note ? '저장' : '추가',
    onDelete: note ? function () {
      removeNote(day, note.id);
      afterItemEdit(trip, day, st, saveTripBody(trip));
    } : null,
    deleteConfirm: '이 메모를 삭제할까요?',
    // 저장·삭제가 끝나면 목록으로 돌아간다 — 메모를 이어서 손보기 쉽게.
    onDone: function () { openNotesModal(trip, day, st); },
    html:
      '<label>메모<textarea class="m-note" rows="5" required ' +
        'placeholder="예: 스시야 19시 예약 · 010-1234-5678">' +
        escHtml(note ? note.text : '') + '</textarea></label>',
    onSubmit: function (form) {
      var text = form.querySelector('.m-note').value.trim();
      if (!text) return MSG_EMPTY_TEXT;
      if (note) updateNote(day, note.id, text);
      else addNote(day, text);
      afterItemEdit(trip, day, st, saveTripBody(trip));
      return null;
    }
  });
}

// ---- 동행자 공유 ----
// 여행 데이터를 URL의 '#' 뒤에 담는다 — 그 부분은 HTTP 요청에 실리지 않으므로
// 서버(GitHub Pages)도 내용을 보지 못한다. 대신 링크를 받은 사람은 누구나 볼 수
// 있으니 링크 자체가 열쇠다.
// 담는 것은 여행 본체(일정·메모·숙소·준비물·섹션·결제내역)뿐이다. 현지 경비 기록과
// 준비물 체크는 그 사람 개인의 것이라 넘기지 않는다.
function openShareModal(trip) {
  var form = modalOpen({
    title: '동행자에게 공유',
    closeLabel: '닫기',
    html: '<p class="sh-load2">공유 링크를 만드는 중…</p>'
  });

  packShare(JSON.stringify(trip)).then(function (payload) {
    // 만드는 동안 사용자가 닫았을 수 있다 — 그러면 아무 것도 하지 않는다.
    if (!_modalEl || !_modalEl.contains(form)) return;
    var url = shareUrl(location.href, payload);
    // 메신저·브라우저마다 감당하는 URL 길이가 다르다. 지나치게 길면 중간에 잘려
    // 상대가 열지 못하므로, 링크를 주기 전에 먼저 알린다.
    var tooLong = url.length > SHARE_URL_WARN;
    form.querySelector('.sh-load2').outerHTML =
      '<p class="modal-hint">링크를 열면 상대 앱에 이 여행이 담깁니다. ' +
        '지금 모습 그대로 복사되는 것이라, 이후에 고친 내용은 상대에게 반영되지 않습니다.</p>' +
      (tooLong ? '<p class="sh-warn">링크가 깁니다(' + url.length +
        '자). 메신저에서 잘릴 수 있으니 열리는지 확인해 보세요.</p>' : '') +
      '<textarea class="sh-url" readonly rows="3">' + escHtml(url) + '</textarea>' +
      '<div class="sh-btns">' +
        (navigator.share ? '<button class="sh-send" type="button">공유하기</button>' : '') +
        '<button class="sh-copy" type="button">링크 복사</button>' +
      '</div>';

    var copyBtn = form.querySelector('.sh-copy');
    copyBtn.addEventListener('click', function () {
      var ta = form.querySelector('.sh-url');
      // navigator.clipboard는 https/localhost에서만 쓸 수 있다 — 안 되면 선택 후
      // execCommand로 물러나고, 그것도 막히면 직접 복사하라고 알린다.
      var done = function () { copyBtn.textContent = '복사됨'; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(done, function () { fallback(); });
      } else fallback();
      function fallback() {
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        if (ok) done(); else copyBtn.textContent = '길게 눌러 복사하세요';
      }
    });

    var sendBtn = form.querySelector('.sh-send');
    if (sendBtn) sendBtn.addEventListener('click', function () {
      navigator.share({ title: trip.title, url: url }).catch(function () {});
    });
  }, function () {
    if (!_modalEl || !_modalEl.contains(form)) return;
    form.querySelector('.sh-load2').textContent = '공유 링크를 만들지 못했습니다.';
  });
}

// ---- 나라 정보 ----
// 도착 첫날 실제로 찾게 되는 것만 낸다(country-info.js 주석 참고). 비자·입국 요건은
// 자주 바뀌어 구워 두면 낡은 값이 사람을 곤란하게 만드므로, 적지 않고 외교부로 보낸다.
function countryCardHtml(trip) {
  var cc = trip && trip.countryCode;
  var info = countryInfo(cc);
  if (!info) return '';
  var c = countryByCode(cc);
  var name = c ? c.name : String(cc);

  // 시차는 그 여행의 도시 시간대로 잰다. 도시를 안 골랐으면 그 나라 첫 도시로
  // 갈음한다 — 한 나라 안에서 시간대가 갈리는 경우(미국·러시아)는 도시를 고르면
  // 정확해진다.
  var tz = (trip.place && trip.place.tz) || ((citiesOf(cc)[0] || {}).tz) || '';
  var diff = tzDiffLabel(tz);

  var cur = trip.currency && trip.currency.code
    ? escHtml(trip.currency.code + (trip.currency.name ? ' · ' + trip.currency.name : ''))
    : '';

  function row(icon, k, v) {
    return v ? '<div class="ci-r"><span class="ci-k">' + icon + ' ' + k + '</span>' +
      '<span class="ci-v">' + escHtml(v) + '</span></div>' : '';
  }

  return '<div class="panel-card ci">' +
    '<h2 class="panel-h">' + escHtml(name) + ' 정보</h2>' +
    row('🔌', '전압', info.volt + ' · ' + info.plug) +
    (diff ? '<div class="ci-r"><span class="ci-k">🕐 시차</span>' +
      '<span class="ci-v">' + escHtml(diff) + '</span></div>' : '') +
    row('🚨', '긴급', info.emg) +
    (cur ? '<div class="ci-r"><span class="ci-k">💵 통화</span>' +
      '<span class="ci-v">' + cur + ' · ' + escHtml(info.tip) + '</span></div>' : '') +
    row('🚰', '물', info.water) +
    '<p class="ci-note">비자·입국 요건·치안은 자주 바뀝니다. 떠나기 전 ' +
      '<a href="https://www.0404.go.kr" target="_blank" rel="noopener">외교부 해외안전여행</a>' +
      '에서 확인하세요.</p>' +
    '</div>';
}

// ---- 하단 고정 섹션 ----

function sectionBodyHtml(trip, sec) {
  if (sec.type === "text") return itemLinesHtml(sec.body);
  if (sec.type === "list") {
    return '<ul>' + sec.body.map(function (t) {

// 합계는 trip.expenses에서 직접 계산한다 — 사용자가 항목을 추가해도 어긋나지 않게.
function expensesTableHtml(trip) {
  // 줄을 탭하면 수정 모달이 열린다(일정·메모와 같은 방식). 표 안에 버튼 열을
  // 따로 두면 폭이 좁은 폰에서 금액이 밀린다.
  const rows = trip.expenses.map(function (e) {
    return '<tr class="exp-r" tabindex="0" role="button" data-id="' + escHtml(e.id) + '">' +
      '<td>' + escHtml(e.cat) + '</td><td>' + escHtml(e.detail) + '</td>' +
      '<td class="num">' + Number(e.krw).toLocaleString('ko-KR') + '</td></tr>';
  }).join('');

    '<tbody>' + rows + '</tbody>' +
    '<tfoot><tr><td colspan="2">합계</td><td class="num">' +
      total.toLocaleString('ko-KR') + '</td></tr></tfoot></table></div>';

function expenseEditorHtml(trip) {
  return '<div class="exp-actions">' +
    '<button class="exp-new" type="button">+ 내역 추가</button></div>';
}

// ---- 모달 ----
// 폼을 화면 아래에 길게 붙이면 스크롤이 늘어나 쓰기 불편하다. 일정·메모·결제내역
// 입력은 모두 이 모달 하나를 쓴다(prompt()로 하던 것도 여기로 옮겼다 — prompt는
// 여러 줄을 못 받고 형식 검증도 못 한다).
var _modalEl = null;
var _modalPrevFocus = null;

function modalClose() {
  if (!_modalEl) return;
  _modalEl.remove();
  _modalEl = null;
  document.body.classList.remove('modal-open');
  document.removeEventListener('keydown', _modalKey);
  if (_modalPrevFocus && _modalPrevFocus.focus) {
    try { _modalPrevFocus.focus(); } catch (e) {}
  }
  _modalPrevFocus = null;
}

function _modalKey(e) {
  if (e.key === 'Escape') { e.preventDefault(); modalClose(); }
}

// opts: { title, html, submitLabel, onSubmit(form) -> 오류 문자열 또는 null }
// onSubmit이 문자열을 돌려주면 모달을 닫지 않고 그 오류를 보여준다.
// closeLabel을 주면 입력 폼이 아니라 목록형 모달이 된다 — 저장 버튼 없이 닫기만
// 둔다(메모 목록처럼 내용이 그 자리에서 바뀌지 않는 화면).
function modalOpen(opts) {
  modalClose();
  _modalPrevFocus = document.activeElement;
  var el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML =
    '<div class="modal-back"></div>' +
    '<div class="modal-card" role="dialog" aria-modal="true" aria-label="' +
      escHtml(opts.title) + '">' +
      '<div class="modal-head">' +
        '<h2>' + escHtml(opts.title) + '</h2>' +
        '<button class="modal-x" type="button" aria-label="닫기">×</button>' +
      '</div>' +
      '<form class="modal-form">' +
        opts.html +
        '<div class="modal-err" hidden></div>' +
        '<div class="modal-btns">' +
          (opts.closeLabel
            ? ''
            : '<button type="submit">' + escHtml(opts.submitLabel || '저장') + '</button>') +
          '<button class="modal-cancel" type="button">' +
            escHtml(opts.closeLabel || '취소') + '</button>' +
        '</div>' +
        (opts.onDelete ? '<button class="modal-del" type="button">삭제</button>' : '') +
      '</form>' +
    '</div>';
  document.body.appendChild(el);
  document.body.classList.add('modal-open');
  _modalEl = el;

  el.querySelector('.modal-back').addEventListener('click', modalClose);
  el.querySelector('.modal-x').addEventListener('click', modalClose);
  el.querySelector('.modal-cancel').addEventListener('click', modalClose);
  document.addEventListener('keydown', _modalKey);

  // 일을 끝낸 뒤 이어서 열 화면(onDone)은 반드시 modalClose 다음에 부른다 — 콜백
  // 안에서 다른 모달을 열면 뒤따르는 modalClose가 그 새 모달을 닫아버린다.
  function finish() {
    modalClose();
    if (opts.onDone) opts.onDone();
  }

  var delBtn = el.querySelector('.modal-del');
  if (delBtn) delBtn.addEventListener('click', function () {
    if (opts.deleteConfirm && !confirm(opts.deleteConfirm)) return;
    opts.onDelete();
    finish();
  });

  var form = el.querySelector('.modal-form');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var err = opts.onSubmit ? opts.onSubmit(form) : null;
    if (err) {
      var box = el.querySelector('.modal-err');
      box.textContent = err;
      box.hidden = false;
      return;
    }
    finish();
  });

  // 첫 입력칸에 포커스를 준다 — 폰에서 바로 타이핑할 수 있게.
  var first = form.querySelector('input, textarea, select');
  if (first && first.focus) { try { first.focus(); } catch (e) {} }
  return form;
}

function sectionEditorHtml() {
  return '<div class="sec-actions">' +
    '<button class="sec-new" type="button">+ 새 항목</button></div>';
}

// 숙소 탭. 여행 기본 숙소 하나에 일차별 목록이 딸린다 — 여행 중에 호텔을 옮기는
// 일정(오사카 3박 → 교토 2박)이 흔하다. 두 줄 모두 탭하면 편집 모달이 열린다.
function hotelPanelHtml(trip) {
  var days = Array.isArray(trip.days) ? trip.days : [];
  var base = '<button class="hr hr-base" type="button">' +
    '<div class="hr-k">여행 기본</div>' +
    '<div class="hr-v">' +
      (trip.hotel ? itemLinesHtml(trip.hotel)
                  : '<span class="hr-none">숙소를 입력하려면 누르세요</span>') +
    '</div></button>';
  var rows = days.map(function (d) {
    // 오버라이드가 있는 날만 숙소를 되풀이해 적는다 — 매일 같은 호텔인 여행에서
    // 같은 이름이 7번 늘어서 있으면 "어느 날이 다른지"가 오히려 안 보인다.
    var own = d.hotel;
    return '<button class="hr hr-day" type="button" data-n="' + Number(d.n) + '">' +
      '<div class="hr-k">' + Number(d.n) + '일차 ' +
        '<span class="hr-d">' + escHtml(String(d.date).slice(5)) +
        '(' + dowOf(d.date) + ')</span></div>' +
      '<div class="hr-v">' +
        (own ? itemLinesHtml(own)
             : '<span class="hr-same">기본 숙소와 같음</span>') +
      '</div></button>';
  }).join('');
  return '<div class="panel-card"><h2 class="panel-h">' + miyoImg(MIYO.hotel) + '숙소</h2>' +
    '<div class="hrs">' + base + rows + '</div>' +
    '<p class="hr-hint">묵는 곳이 바뀌는 날만 따로 적으면 됩니다.</p></div>';
}

function bindHotelPanel(trip, st, el) {
  function save() {
    if (!saveTripBody(trip)) {
      var fresh = loadTrip(trip.id);
      if (fresh) { trip.hotel = fresh.hotel; trip.days = fresh.days; }
      alert('저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.');
    }
    renderPanel(trip, st, "hotel");
  }

  // dayN이 null이면 여행 기본 숙소를 고친다.
  function openHotelModal(dayN) {
    var day = dayN === null ? null : findDay(trip, dayN);
    if (dayN !== null && !day) return;
    var cur = dayN === null ? (trip.hotel || '') : (day.hotel || '');
    modalOpen({
      title: dayN === null ? '여행 기본 숙소' : (Number(dayN) + '일차 숙소'),
      submitLabel: '저장',
      // 일차 숙소는 비우면 기본값으로 되돌아간다 — "삭제"보다 그 뜻을 그대로 쓴다.
      onDelete: (dayN !== null && day.hotel) ? function () {
        setDayHotel(trip, dayN, '');
        save();
      } : null,
      html:
        '<label>숙소<textarea class="m-hotel" rows="4" ' +
          'placeholder="예: 포포인츠 신사이바시&#10;체크인 15시 · 체크아웃 11시">' +
          escHtml(cur) + '</textarea></label>' +
        (dayN === null
          ? '<p class="modal-hint">일차별로 따로 적지 않은 날은 모두 이 숙소를 씁니다.</p>'
          : '<p class="modal-hint">비워서 저장하면 여행 기본 숙소를 씁니다.</p>'),
      onSubmit: function (form) {
        var text = form.querySelector('.m-hotel').value;
        if (dayN === null) trip.hotel = String(text).trim();
        else setDayHotel(trip, dayN, text);
        save();
        return null;
      }
    });
  }

  var baseBtn = el.querySelector('.hr-base');
  if (baseBtn) baseBtn.addEventListener('click', function () { openHotelModal(null); });
  el.querySelectorAll('.hr-day').forEach(function (b) {
    b.addEventListener('click', function () { openHotelModal(Number(b.dataset.n)); });
  });
}

// 탭 본문. 일정 탭은 #daytabs/#timeline을 따로 쓰므로 여기서는 빈 문자열.
function panelHtml(trip, tab) {
  if (tab === "hotel") return hotelPanelHtml(trip);
  if (tab === "packing") {
    return '<div class="panel-card" id="packing-body"></div>';
  }
  if (tab === "money") {
    // 내역이 없어도 편집기는 보여야 한다 — 그래야 첫 항목을 넣을 수 있다.
    var exp = '<div class="panel-card"><h2 class="panel-h">' + miyoImg(MIYO.money) +
      '출발 전 결제 내역</h2>' +
      ((trip.expenses && trip.expenses.length)
        ? expensesTableHtml(trip)
        : '<p class="sempty">아직 내역이 없습니다.</p>') +
      expenseEditorHtml(trip) + '</div>';
    return '<div class="panel-card" id="spend-body"></div>' + exp;
  }
  if (tab === "info") {
    var secs = trip.sections || [];
    var body = secs.length
      ? secs.map(function (sec, i) {
          // 섹션은 <details>라 제목 탭이 이미 펼치기다 — 일정처럼 "탭하면 수정"으로
          // 만들 수 없어 펼친 내용 아래에 도구줄을 둔다. 삭제는 수정 모달 안에 있다.
          // 표는 편집기가 다루지 않는다(읽기 전용) — 버튼 자체를 내지 않는다.
          var tools = sectionEditable(sec)
            ? '<div class="sec-tools">' +
              '<button class="sec-up" type="button" data-id="' + escHtml(sec.id) + '">↑</button>' +
              '<button class="sec-dn" type="button" data-id="' + escHtml(sec.id) + '">↓</button>' +
              '<button class="sec-ed" type="button" data-id="' + escHtml(sec.id) + '">수정</button>' +
              '</div>'
            : '<div class="sec-tools"><span class="sec-ro">표는 여기서 수정할 수 없습니다</span></div>';
          return '<details' + (i === 0 ? ' open' : '') + '>' +
            '<summary>' + escHtml(sec.icon) + ' ' + escHtml(sec.title) + '</summary>' +
            '<div class="acc">' + sectionBodyHtml(trip, sec) + tools + '</div></details>';
        }).join('')
      : '<p class="empty">시간표·메모처럼 직접 만드는 항목이 여기 표시됩니다.</p>';
    return countryCardHtml(trip) + body + sectionEditorHtml();
  }
  return '';
}

function renderPanel(trip, st, tab) {
  var el = document.getElementById("tab-panel");
  if (!el) return;
  el.innerHTML = panelHtml(trip, tab);
  if (tab === "hotel") bindHotelPanel(trip, st, el);
  if (tab === "packing") renderPacking(trip, st);
  if (tab === "money") renderSpend(trip, st);
  if (tab === "info") bindSectionEditor(trip, st, el);
  if (tab === "money") bindExpenseEditor(trip, st, el);
}

// 섹션을 고쳐 저장하고 정보 탭만 다시 그린다. saveTripBody의 성공 여부를 확인한다 —
// 조용히 실패하면 화면에는 반영됐는데 저장은 안 된 상태가 된다.
function saveSections(trip, st, el) {
  var ok = saveTripBody(trip);
  if (!ok) {
    var fresh = loadTrip(trip.id);
    if (fresh) trip.sections = fresh.sections;
    alert('저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.');
  }
  renderPanel(trip, st, "info");
}

function bindExpenseEditor(trip, st, el) {
  function save() {
    if (!saveTripBody(trip)) {
      var fresh = loadTrip(trip.id);
      if (fresh) trip.expenses = fresh.expenses;
      alert('저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.');
    }
    renderPanel(trip, st, "money");
  }

  function openForm(e) {
    modalOpen({
      title: e ? '내역 수정' : '내역 추가',
      submitLabel: e ? '저장' : '추가',
      onDelete: e ? function () { removeExpense(trip, e.id); save(); } : null,
      deleteConfirm: e ? ('"' + e.cat + '" 내역을 삭제할까요?') : null,
      html:
        '<label>항목<input class="exp-cat" type="text" required ' +
          'placeholder="예: 항공권" value="' + escHtml(e ? e.cat : '') + '"></label>' +
        '<label>금액(원)<input class="exp-krw" type="number" min="1" step="1" required ' +
          'placeholder="640000" value="' + (e ? Number(e.krw) : '') + '"></label>' +
        '<label>상세<input class="exp-detail" type="text" ' +
          'placeholder="예: 왕복 2인" value="' + escHtml(e ? (e.detail || '') : '') + '"></label>' +
        '<div class="modal-row">' +
          '<label>결제일<input class="exp-date" type="date" ' +
            'value="' + escHtml(e ? (e.date || '') : '') + '"></label>' +
          '<label>결제수단<input class="exp-pay" type="text" ' +
            'placeholder="신한카드" value="' + escHtml(e ? (e.pay || '') : '') + '"></label>' +
        '</div>',
      onSubmit: function (form) {
        var f = {
          cat: form.querySelector('.exp-cat').value,
          krw: form.querySelector('.exp-krw').value,
          detail: form.querySelector('.exp-detail').value,
          date: form.querySelector('.exp-date').value,
          pay: form.querySelector('.exp-pay').value,
          note: ''
        };
        var err = validateExpenseForm(f);
        if (err) return err;
        if (e) updateExpense(trip, e.id, f);
        else addExpense(trip, f);
        save();
        return null;
      }
    });
  }

  var newBtn = el.querySelector('.exp-new');
  if (newBtn) newBtn.addEventListener('click', function () { openForm(null); });

  el.querySelectorAll('.exp-r').forEach(function (tr) {
    function open() {
      var e = (trip.expenses || []).filter(function (x) { return x.id === tr.dataset.id; })[0];
      if (e) openForm(e);
    }
    tr.addEventListener('click', open);
    // <tr>은 버튼이 아니라 키보드로는 열리지 않는다 — Enter/Space를 직접 받는다.
    tr.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
    });
  });
}

  el.querySelectorAll('.sec-up').forEach(function (b) {
    b.addEventListener('click', function () {
      moveSection(trip, b.dataset.id, -1);

  el.querySelectorAll('.sec-dn').forEach(function (b) {

function renderTabbar(trip, tab, onSelect) {
