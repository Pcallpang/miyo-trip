<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDF3E7">
<meta name="color-scheme" content="light">
<title>야르미요의 여행 플래너</title>
<style>
/* 미요 앱 시리즈 공통 토큰 — SNAseating/planner와 같은 값을 쓴다.
   여기 값만 바꾸면 앱 전체 색이 따라온다. */
:root {
  color-scheme:light;
  --pop-mint:#8FD9B6; --pop-mint-dark:#6BC79C; --pop-mint-light:#E3F7EC;
  --pop-blue:#A8D2F0; --pop-blue-dark:#85BEE8; --pop-blue-light:#EAF4FC;
  --pop-purple:#5B3A8E; --pop-purple-light:#F1ECFA;
  --pop-yellow:#FACC15; --pop-yellow-light:#FEF6D8;
  --accent-tan:#C9976A; --accent-tan-dark:#8B6F47; --accent-tan-light:#F5DFC0;
  --ink:#1A2B1E; --ink-soft:#5A6B5E;
  --bg-base:#FDF3E7; --bg-surface:#FFFFFF; --bg-input:#FDEFE2; --border-soft:#EDE0D0;
  --shadow-soft:0 1px 2px rgba(60,40,10,.05), 0 4px 12px rgba(60,40,10,.08);

  /* 이 앱이 쓰는 이름은 위 토큰을 가리키게만 한다 — 두 역할을 나눠 둔다:
     --accent는 "글자로 쓰는 강조색"(밝은 바탕 위), --accent-fill은 "채우는 색"이고
     그 위 글자는 --ink다. 예전처럼 채운 위에 흰 글자를 얹으면 웜톤에서 읽히지 않는다. */
  --bg:var(--bg-base); --card:var(--bg-surface);
  --accent:var(--accent-tan-dark); --accent-fill:var(--pop-mint);
  --accent2:#C2703A;
  --text:var(--ink); --muted:var(--ink-soft);
  --line:var(--border-soft);
}
* { box-sizing:border-box; }
html { background:var(--bg); }
body { margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; line-height:1.5; }
#summary { background:linear-gradient(135deg, var(--accent-tan-light), #FBEEDD);
  color:var(--ink); padding:20px 16px; border-bottom:1px solid var(--border-soft); }
/* 오른쪽에는 [공유]와 ⚙ 두 버튼이 절대 배치로 얹힌다 — 공유 버튼의 왼쪽 끝이
   오른쪽에서 대략 120px 지점이라, 긴 제목·D-day가 그 밑으로 파고들지 않게 비워 둔다.
   왼쪽에는 목록으로 돌아가는 버튼(.back-list) 하나뿐이라 40px면 충분하다. */
#summary h1 { margin:4px 0; font-size:1.5rem; padding-right:124px; padding-left:40px; }
#summary .dday { font-weight:700; opacity:.9; padding-right:124px; padding-left:40px; }
#summary .period,#summary .hotel,#summary .cost { font-size:.9rem; opacity:.95; margin-top:2px; }
#daytabs { display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
  position:sticky; top:0; background:var(--bg); z-index:5; -webkit-overflow-scrolling:touch; }
.tab { flex:0 0 auto; border:1px solid var(--line); background:var(--card); border-radius:14px;
  padding:6px 12px; display:flex; flex-direction:column; align-items:center; font:inherit; color:var(--muted); }
.tab[data-selected] { background:var(--accent-fill); color:var(--ink); border-color:var(--accent); }
.tab .tn { font-weight:700; font-size:.85rem; }
.tab .td { font-size:.7rem; }
.daycard { background:var(--card); margin:12px; border-radius:18px; overflow:hidden;
  border:1px solid var(--border-soft);
  box-shadow:var(--shadow-soft); }
.dayhead { padding:14px 16px; border-bottom:1px solid var(--line); }
.dayhead .dnum { font-weight:700; color:var(--accent); }
.dayhead .dcity { color:var(--accent); font-weight:700; font-size:.85rem; margin-top:5px; }
.dayhead .dhotel { color:var(--muted); font-size:.85rem; margin-top:2px; }
/* 줄 자체가 편집 버튼이다 — 버튼 기본 모양(테두리·가운데 정렬·회색 배경)을 지워
   원래의 목록 줄처럼 보이게 한다. */
.slot { display:flex; gap:10px; padding:12px 16px; width:100%; text-align:left;
  border:0; border-bottom:1px solid var(--line); background:none; font:inherit;
  color:inherit; cursor:pointer; }
.slot .what { flex:1; min-width:0; }
.slot:active { background:var(--bg-input); }
.slot:last-child { border-bottom:0; }
.slot .time { flex:0 0 46px; font-weight:700; color:var(--accent); font-size:.85rem; }
.slot .what .line { font-size:.9rem; }
.slot .what .line + .line { margin-top:2px; }
.line.timed, .line.booked { display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  font-weight:700; border-radius:8px; padding:7px 10px; margin:4px 0; }
.line.timed { background:#fff0f0; color:#c92a2a; border-left:4px solid #e03131; }
.line.booked { background:#e9fbf3; color:#0b7043; border-left:4px solid #0ca678; }
.line .tag { flex:none; font-size:.72rem; font-weight:800; color:var(--ink);
  border-radius:999px; padding:2px 8px; letter-spacing:.02em; }
.line.timed .tag { background:#e03131; }
.line.booked .tag { background:#0ca678; }
#timeline .empty { color:var(--muted); text-align:center; font-size:.88rem;
  margin:0; padding:26px 16px; }
.slot.undecided { background:var(--pop-yellow-light); }
.slot.undecided .time { color:var(--accent2); }
#fixed { margin:12px; }
#fixed details { background:var(--card); border-radius:14px; margin-bottom:10px; overflow:hidden; }
#fixed summary { padding:14px 16px; font-weight:600; cursor:pointer; list-style:none; }
#fixed summary::-webkit-details-marker { display:none; }
#fixed summary::after { content:"▾"; float:right; color:var(--muted); }
#fixed details[open] summary::after { content:"▴"; }
.acc { padding:0 16px 14px; font-size:.9rem; }
.tblwrap { overflow-x:auto; margin-top:8px; }
.acc table { border-collapse:collapse; width:100%; font-size:.85rem; }
.acc caption { text-align:left; font-weight:600; color:var(--muted); padding:4px 0; }
.acc th,.acc td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
.acc td.num,.acc th.num { text-align:right; white-space:nowrap; }
.acc tfoot td { font-weight:700; }
.acc ul { margin:8px 0 0; padding-left:18px; }
/* 준비물 — 줄 전체가 체크 버튼이다(가장 잦은 동작). 손가락이 닿을 만큼 키우고,
   체크 상자도 눈에 보이는 크기로 그린다(브라우저 기본 체크박스는 폰에서 너무 작다). */
.pk-h { display:flex; align-items:baseline; gap:8px; font-weight:700;
  color:var(--accent); margin-bottom:4px; }
.pk-n { margin-left:auto; font-size:.85rem; color:var(--muted); font-weight:700; }
.packlist { list-style:none; padding:0; margin:0; }
.packlist .pk-r { display:flex; align-items:center; gap:6px;
  border-bottom:1px solid var(--line); }
.packlist .pk-r:last-child { border-bottom:0; }
.pk-t { flex:1; min-width:0; display:flex; align-items:center; gap:10px;
  padding:12px 0; border:0; background:none; font:inherit; color:inherit;
  text-align:left; cursor:pointer; }
.pk-box { flex:0 0 auto; width:22px; height:22px; border:2px solid var(--accent-tan);
  border-radius:7px; display:flex; align-items:center; justify-content:center;
  font-size:.85rem; font-weight:800; color:var(--ink); }
.pk-x { flex:1; min-width:0; font-size:.92rem; }
.pk-r.done .pk-box { background:var(--accent); border-color:var(--accent); }
.pk-r.done .pk-x { text-decoration:line-through; color:var(--muted); }
.pack-del { flex:0 0 auto; border:none; background:none; color:var(--accent-tan);
  width:40px; height:40px; font-size:1.2rem; line-height:1; cursor:pointer; }
.pk-empty { margin:0; padding:20px 0; text-align:center; color:var(--muted); font-size:.88rem; }
.pack-add-btn { margin-top:10px; font:inherit; font-weight:700; font-size:.88rem;
  padding:11px; width:100%; border:1px solid var(--accent); border-radius:10px;
  background:var(--card); color:var(--accent); cursor:pointer; }
.meals { padding:12px 16px; border-top:1px solid var(--line); background:var(--pop-yellow-light); }
.meals-h { font-weight:700; color:var(--accent2); margin-bottom:8px; }
.meal { margin-bottom:12px; }
.meal:last-child { margin-bottom:0; }
.meal-note .line { font-size:.9rem; }
.memo { display:block; width:100%; margin-top:6px; padding:8px 10px;
  border:1px solid var(--accent-tan-light); border-radius:8px; font:inherit; background:var(--bg-surface); }
#summary .cost .spent { display:inline-block; opacity:.95; }
.stotal { font-size:1.35rem; font-weight:800; color:var(--accent); margin-top:8px; }
.stotal .skrw { font-size:.85rem; font-weight:600; color:var(--muted); }
.scats { list-style:none; padding:0; margin:10px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
.scats li { font-size:.78rem; background:var(--bg-input); border-radius:999px; padding:4px 10px; color:var(--muted); }
.scats li b { color:var(--text); }
.sgroup { margin-top:12px; }
.sdate { font-size:.78rem; font-weight:700; color:var(--muted); padding-bottom:4px;
  border-bottom:1px solid var(--line); }
.slist { list-style:none; padding:0; margin:0; }
.slist li { display:flex; align-items:center; gap:8px; padding:8px 0;
  border-bottom:1px solid var(--line); }
.slist .scat { flex:0 0 auto; font-size:.72rem; font-weight:700; color:var(--ink);
  background:var(--accent); border-radius:999px; padding:2px 8px; }
.slist .snote { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slist .sjpy { flex:0 0 auto; font-weight:700; white-space:nowrap; }
.sempty { color:var(--muted); padding:10px 0; }
.sfx { margin-top:14px; font-size:.82rem; color:var(--muted); }
.sfx input { width:70px; padding:5px 8px; border:1px solid var(--line); border-radius:6px;
  font:inherit; text-align:right; }
#summary .wx { font-size:.9rem; opacity:.95; margin-top:2px; }
.dayhead .dwx { font-size:.85rem; color:var(--muted); margin-top:2px; }
.wxstamp { font-size:.75rem; opacity:.75; }

/* ---- 여행 목록 화면 ---- */
.lhead { background:linear-gradient(135deg, var(--accent-tan-light), #FBEEDD);
  color:var(--ink); padding:20px 16px; border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; gap:10px; }
.lhead img { width:34px; height:34px; object-fit:contain; }
.lhead h1 { margin:0; font-size:1.4rem; }
#triplist { padding:12px; }
.tripcard { position:relative; background:var(--card); border-radius:18px; padding:14px 16px;
  border:1px solid var(--border-soft);
  margin-bottom:10px; box-shadow:var(--shadow-soft); cursor:pointer; }
.tripcard .tc-title { font-weight:700; font-size:1.05rem; }
.tripcard .tc-period { color:var(--muted); font-size:.85rem; margin-top:2px; }
.tripcard .tc-dday { color:var(--accent); font-weight:700; font-size:.8rem; margin-top:4px; }
.tripcard .tc-del { position:absolute; top:10px; right:10px; border:0; background:none;
  color:var(--muted); font-size:1.2rem; line-height:1; padding:4px 8px; cursor:pointer; }
#triplist .empty { color:var(--muted); text-align:center; padding:32px 16px; }
.lactions { display:flex; flex-direction:column; gap:8px; padding:0 12px 24px; }
.lactions button { font:inherit; padding:12px; border-radius:14px; border:1px solid var(--line);
  background:var(--card); color:var(--text); cursor:pointer; }
.lactions #new-trip { background:var(--accent-fill); color:var(--ink); border-color:var(--accent);
  font-weight:700; }

#summary { position:relative; }
/* z-index가 필요한 이유: .dday/.period/.hotel/.cost는 opacity가 1보다 작아 각자
   쌓임 맥락을 만든다. 그러면 z-index:auto인 절대 위치 요소(이 버튼들)와 같은 페인팅
   단계에 놓이고, 그 단계에서는 DOM 순서가 승부를 가른다 — .dday가 버튼보다 뒤에
   있어 버튼 위를 덮었다. 눈에는 버튼이 보이는데 클릭은 .dday가 먹던 원인이다. */
.back-list { position:absolute; z-index:1; top:16px; left:14px; border:1px solid var(--border-soft);
  background:var(--bg-surface); color:var(--ink); font-size:1.05rem; line-height:1;
  padding:7px 10px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow-soft); }
.edit-trip { position:absolute; z-index:1; top:16px; right:14px; border:1px solid var(--border-soft);
  background:var(--bg-surface); color:var(--ink); font-size:1.05rem; line-height:1;
  padding:7px 10px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow-soft); }
/* 공유는 ⚙ 왼쪽에. 설정 안에 두니 잘 눈에 띄지 않아 밖으로 뺐다. z-index는 위 주석과
   같은 이유로 반드시 있어야 한다 — 없으면 .dday가 버튼 위를 덮어 클릭을 가로챈다. */
.share-trip { position:absolute; z-index:1; top:16px; right:56px; border:0;
  background:var(--pop-mint); color:var(--ink); font:inherit; font-size:.85rem;
  font-weight:700; line-height:1; padding:9px 12px; border-radius:999px; cursor:pointer;
  box-shadow:var(--shadow-soft); display:flex; align-items:center; gap:5px; }
.share-trip img { width:18px; height:18px; object-fit:contain; }
.ehead { background:linear-gradient(135deg, var(--accent-tan-light), #FBEEDD);
  color:var(--ink); padding:16px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border-soft); }
.ehead h1 { margin:0; font-size:1.2rem; }
.ehead button { border:0; background:none; color:var(--ink); font-size:1.3rem; cursor:pointer; padding:0 4px; }
.eform { display:flex; flex-direction:column; gap:14px; padding:16px; }
.eform label { display:flex; flex-direction:column; gap:5px; font-size:.85rem; color:var(--muted); }
.eform input, .eform textarea, .eform select { font:inherit; color:var(--text);
  padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
.eform button[type=submit] { font:inherit; font-weight:700; padding:13px; border:0;
  border-radius:14px; background:var(--accent-fill); color:var(--ink); cursor:pointer; }
.eerr { background:#fff0f0; color:#c92a2a; border-left:4px solid #e03131;
  padding:9px 12px; border-radius:8px; font-size:.85rem; }

#tabbar { position:fixed; left:0; right:0; bottom:0; z-index:10;
  display:flex; background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); }
#tabbar .tb { flex:1; border:0; background:none; font:inherit; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:8px 2px 6px; color:var(--muted); }
#tabbar .tb[data-selected] { color:var(--accent-tan-dark); font-weight:700; }
#tabbar .tb-i { display:flex; align-items:center; justify-content:center;
  width:28px; height:28px; }
#tabbar .tb-i img { width:100%; height:100%; object-fit:contain;
  /* 고르지 않은 캐릭터는 흐리게 — 색으로 현재 위치를 알린다. */
  filter:grayscale(1) opacity(.45); transition:filter .15s; }
#tabbar .tb[data-selected] .tb-i img { filter:none; }
#tabbar .tb-l { font-size:.7rem; }
/* 하단 고정 바에 마지막 항목이 가리지 않도록 본문에 여백을 준다. */
#screen-trip { padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
#tab-panel { padding:12px; }
.panel-card { background:var(--card); border-radius:18px; padding:14px 16px;
  border:1px solid var(--border-soft);
  margin-bottom:10px; box-shadow:var(--shadow-soft); }
.panel-h { margin:0 0 8px; font-size:.9rem; color:var(--accent); }
#tab-panel .empty { color:var(--muted); text-align:center; padding:32px 16px; }
#tab-panel details { background:var(--card); border-radius:18px; margin-bottom:10px;
  box-shadow:var(--shadow-soft); overflow:hidden; }
#tab-panel summary { padding:14px 16px; font-weight:700; cursor:pointer; }
.geo-block { display:flex; flex-direction:column; gap:6px; }
.geo-lbl { font-size:.85rem; color:var(--muted); }
.geo-hint { font-weight:400; }
.geo-cur { font-size:.95rem; color:var(--text); }
.geo-cur .geo-none { color:var(--muted); }
.geo-row { display:flex; gap:8px; }
.geo-row input { flex:1; font:inherit; color:var(--text);
  padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
.geo-row button { font:inherit; padding:10px 14px; border:1px solid var(--line);
  border-radius:10px; background:var(--card); color:var(--text); cursor:pointer; }
.geo-row button[disabled] { opacity:.5; cursor:default; }
.geo-list { list-style:none; margin:0; padding:0; border:1px solid var(--line);
  border-radius:10px; overflow:hidden; background:var(--card); }
.geo-list li { padding:10px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
.geo-list li:last-child { border-bottom:0; }
.geo-list li:hover { background:var(--bg-input); }
.geo-msg { font-size:.85rem; color:var(--muted); }
.daycity-block { display:flex; flex-direction:column; gap:6px; }
.daycity-list { list-style:none; margin:0; padding:0; border:1px solid var(--line);
  border-radius:10px; overflow:hidden; background:var(--card); }
.daycity-list li { display:flex; align-items:center; gap:8px; padding:8px 12px;
  border-bottom:1px solid var(--line); font-size:.9rem; }
.daycity-list li:last-child { border-bottom:0; }
.daycity-list .dc-n { flex:0 0 52px; font-weight:700; color:var(--accent); font-size:.82rem; }
.daycity-list .dc-p { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.daycity-list button { flex:0 0 auto; font:inherit; font-size:.78rem; padding:4px 10px;
  border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--muted); cursor:pointer; }
.dayhead .daycity { display:inline-block; font-size:.78rem; font-weight:700; color:var(--ink);
  background:var(--accent2); border-radius:999px; padding:2px 9px; margin-top:4px; }

.stotal .stot-row { font-size:1.25rem; font-weight:800; color:var(--accent); }
.stotal .stot-row + .stot-row { margin-top:2px; }
.stotal .stot-sum { font-size:.9rem; font-weight:700; color:var(--muted); margin-top:6px;
  padding-top:6px; border-top:1px solid var(--line); }
.slist .samt { flex:0 0 auto; font-weight:700; white-space:nowrap; }
.sfx .sfx-clr { margin-left:6px; font:inherit; font-size:.75rem; padding:2px 8px;
  border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--muted); cursor:pointer; }
.fx-attrib-row { margin-top:10px; }
.fx-attrib { font-size:.72rem; color:var(--muted); text-decoration:none; opacity:.8; }
.fx-attrib:hover { text-decoration:underline; }

.sec-actions { display:flex; gap:8px; margin-top:4px; }
.sec-actions button { flex:1; font:inherit; font-size:.85rem; padding:10px; border:1px solid var(--line);
  border-radius:10px; background:var(--card); color:var(--text); cursor:pointer; }
.sec-actions .sec-new { background:var(--accent-fill); color:var(--ink); border-color:var(--accent); font-weight:700; }
.sec-tools { display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
.sec-tools button { font:inherit; font-size:.75rem; padding:4px 10px; border:1px solid var(--line);
  border-radius:8px; background:var(--card); color:var(--muted); cursor:pointer; }
.sec-tools .sec-ro { font-size:.75rem; color:var(--muted); }

/* 메모는 카드가 아니라 모달 안에서 본다 — 목록의 각 줄이 곧 편집 버튼이다. */
.mnotes { display:flex; flex-direction:column; border:1px solid var(--accent-tan-light);
  border-radius:14px; overflow:hidden; background:var(--pop-yellow-light); }
.mnote { display:block; width:100%; text-align:left; padding:11px 13px; border:0;
  border-bottom:1px solid var(--line); background:none; font:inherit; color:inherit;
  cursor:pointer; font-size:.9rem; }
.mnote:last-child { border-bottom:0; }
.mnote:active { background:var(--accent-tan-light); }
.mnote-empty { margin:0; padding:18px 0; text-align:center;
  color:var(--muted); font-size:.88rem; }
.mnote-add { font:inherit; font-weight:700; font-size:.88rem; padding:11px; width:100%;
  border:1px solid var(--accent2); border-radius:10px; background:var(--card);
  color:var(--accent2); cursor:pointer; }

.exp-actions { display:flex; gap:8px; margin-top:10px; }
.exp-actions button { flex:1; font:inherit; font-size:.85rem; padding:10px; border:1px solid var(--line);
  border-radius:10px; background:var(--card); color:var(--text); cursor:pointer; }
.exp-actions .exp-new { background:var(--accent-fill); color:var(--ink); border-color:var(--accent); font-weight:700; }
/* 결제 내역은 표라 줄을 <button>으로 만들 수 없다 — <tr>에 role/tabindex를 주고
   눌리는 곳임을 커서와 눌림 배경으로 알린다(키 입력은 views.js에서 받는다). */
.exp-r { cursor:pointer; }
.exp-r:active { background:var(--bg-input); }
.exp-r:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
/* 표 줄 구분선. 정보 탭 표(.acc table)와 달리 이 표는 .acc 밖에 있어 그 규칙이
   닿지 않는다 — 줄이 붙어 보여 항목 구분이 안 되므로 여기서 따로 그린다. */
.panel-card .tblwrap table { border-collapse:collapse; width:100%; font-size:.85rem; }
.panel-card .tblwrap th,
.panel-card .tblwrap td { border-bottom:1px solid var(--line); padding:8px; text-align:left; }
.panel-card .tblwrap th { color:var(--muted); font-weight:600; }
.panel-card .tblwrap td.num,
.panel-card .tblwrap th.num { text-align:right; white-space:nowrap; }
/* 합계는 내역과 다른 줄임을 굵은 윗선으로 끊어 준다. */
.panel-card .tblwrap tfoot td { font-weight:700; border-top:2px solid var(--line); border-bottom:0; }

.cur-line { font-size:.9rem; color:var(--muted); margin-top:-6px; }
.cur-line b { color:var(--text); }
.geo-cur .geo-hint { color:var(--muted); }

/* ---- 모달 ---- */
body.modal-open { overflow:hidden; }
/* 모달은 화면 가운데에 띄운다. 아래에 붙이면(바텀시트) 하단 내비와 붙어 보이고,
   내용이 짧을 때도 시선이 화면 끝으로 끌려간다. */
.modal { position:fixed; inset:0; z-index:100; display:flex; align-items:center;
  justify-content:center; padding:16px; }
.modal-back { position:absolute; inset:0; background:rgba(0,0,0,.45); }
/* dvh는 폰에서 주소창이 접힐 때 실제 보이는 높이를 따라간다. 지원하지 않는
   브라우저는 바로 위 vh 값을 쓴다. */
.modal-card { position:relative; width:100%; max-width:520px; overflow-y:auto;
  max-height:84vh; max-height:84dvh;
  background:var(--card); border-radius:18px; box-shadow:0 10px 40px rgba(0,0,0,.28); }
.modal-head { display:flex; align-items:center; gap:10px; padding:16px 16px 8px; }
.modal-head h2 { margin:0; font-size:1.05rem; flex:1; }
.modal-x { border:0; background:none; font-size:1.4rem; line-height:1; color:var(--muted);
  cursor:pointer; padding:2px 6px; }
.modal-form { display:flex; flex-direction:column; gap:10px; padding:0 16px 16px; }
.modal-form label { display:flex; flex-direction:column; gap:5px; font-size:.85rem;
  color:var(--muted); }
.modal-form input, .modal-form textarea, .modal-form select { font:inherit; color:var(--text);
  padding:11px; border:1px solid var(--line); border-radius:10px; background:var(--card);
  min-width:0; width:100%; }
.modal-row { display:flex; gap:8px; }
.modal-row > * { flex:1; min-width:0; }
.modal-err { background:#fff0f0; color:#c92a2a; border-left:4px solid #e03131;
  padding:9px 12px; border-radius:8px; font-size:.85rem; }
.modal-btns { display:flex; gap:8px; margin-top:2px; }
.modal-btns button { flex:1; font:inherit; font-weight:700; padding:13px; border:0;
  border-radius:999px; background:var(--accent-fill); color:var(--ink); cursor:pointer; }
/* 삭제는 저장·취소와 한 줄에 두지 않는다 — 되돌릴 수 없는 동작이라 실수로 누르기
   쉬운 자리를 피해 아래에 따로 둔다. */
.modal-del { margin-top:6px; font:inherit; font-size:.85rem; padding:11px; width:100%;
  border:1px solid #ffc9c9; border-radius:10px; background:var(--card); color:#c92a2a;
  cursor:pointer; }
.modal-form .m-narrow { flex:0 0 82px; }
.modal-btns .modal-cancel { background:var(--card); color:var(--muted);
  border:1px solid var(--line); font-weight:400; }

/* 일차 머리의 버튼 — 폼을 아래에 붙이지 않고 여기서 모달을 연다.
   일정 추가는 +만으로 충분하다(자리가 무엇에 대한 +인지 말해 준다) — 대신
   손가락이 닿을 만큼은 키운다. */
.day-actions { display:flex; gap:8px; margin-top:10px; align-items:stretch; }
.day-actions button { font:inherit; font-size:.85rem; font-weight:700; padding:9px;
  border:1px solid var(--accent); border-radius:10px; background:var(--card);
  color:var(--accent); cursor:pointer; }
.day-actions .day-add-item { flex:0 0 52px; font-size:1.25rem; line-height:1.1; }
.day-actions .day-note { flex:1; border-color:var(--accent2); color:var(--accent2); }
.day-actions .day-spend { flex:1; }
.day-actions .nbadge, .day-actions .sbadge { display:inline-block; margin-left:2px;
  font-size:.72rem; font-weight:800; color:var(--ink); border-radius:999px; padding:1px 6px; }
.day-actions .nbadge { min-width:18px; background:var(--accent2); }
.day-actions .sbadge { background:var(--accent); }

#city-sel { font:inherit; color:var(--text); padding:11px; border:1px solid var(--line);
  border-radius:10px; background:var(--card); width:100%; }

/* 숙소 탭 — 여행 기본 한 줄에 일차별 목록이 딸린다. 각 줄이 편집 버튼이다. */
.hrs { display:flex; flex-direction:column; border:1px solid var(--line);
  border-radius:14px; overflow:hidden; margin-top:4px; }
.hr { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
  padding:11px 13px; border:0; border-bottom:1px solid var(--line); background:none;
  font:inherit; color:inherit; cursor:pointer; }
.hr:last-child { border-bottom:0; }
.hr:active { background:var(--bg-input); }
.hr-base { background:var(--bg-input); }
.hr .hr-k { flex:0 0 92px; font-weight:700; font-size:.82rem; color:var(--accent); }
.hr .hr-k .hr-d { font-weight:400; color:var(--muted); }
.hr .hr-v { flex:1; min-width:0; font-size:.9rem; }
.hr .hr-v .line + .line { margin-top:2px; }
.hr-none, .hr-same { color:var(--muted); font-size:.85rem; }
.hr-hint { margin:10px 0 0; font-size:.8rem; color:var(--muted); }
.modal-hint { margin:0; font-size:.8rem; color:var(--muted); }

/* 여행 설정 — 시작·종료일은 한 쌍이라 나란히, 그 아래 기간을 셈해 보여준다. */
.eform-row { display:flex; gap:10px; }
.eform-row > * { flex:1; min-width:0; }
.dur-line { margin-top:-6px; font-size:.9rem; font-weight:700; color:var(--accent); }
.eform-hint { margin:-8px 0 0; font-size:.8rem; color:var(--muted); }

/* 경비 모달 — 그날 합계·목록·추가가 한자리에. 각 줄이 편집 버튼이다(메모와 같은 꼴). */
.dsp-ts { text-align:right; margin-bottom:2px; }
.dsp-t { font-size:1.15rem; font-weight:800; color:var(--accent); }
.dsps { display:flex; flex-direction:column; border:1px solid var(--line);
  border-radius:14px; overflow:hidden; background:var(--pop-mint-light); }
.dsp-r { display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
  padding:10px 13px; border:0; border-bottom:1px solid var(--line); background:none;
  font:inherit; color:inherit; cursor:pointer; font-size:.9rem; }
.dsp-r:last-child { border-bottom:0; }
.dsp-r:active { background:var(--pop-mint-light); }
.dsp-cat { flex:0 0 auto; font-size:.72rem; font-weight:700; color:var(--accent);
  background:var(--pop-mint-light); border-radius:999px; padding:2px 8px; }
.dsp-note { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dsp-amt { flex:0 0 auto; font-weight:700; white-space:nowrap; }
.dsp-empty { margin:0; padding:18px 0; text-align:center; color:var(--muted); font-size:.88rem; }
.dsp-add { font:inherit; font-weight:700; font-size:.88rem; padding:11px; width:100%;
  border:1px solid var(--accent); border-radius:10px; background:var(--card);
  color:var(--accent); cursor:pointer; }
.modal-form .m-narrow2 { flex:0 0 104px; }

/* 나라 정보 — 도착 첫날 찾게 되는 것만. 라벨/값 두 칸으로 훑어보기 쉽게. */
.ci-r { display:flex; gap:10px; align-items:baseline; padding:8px 0;
  border-bottom:1px solid var(--line); font-size:.9rem; }
.ci-r:last-of-type { border-bottom:0; }
.ci-k { flex:0 0 74px; color:var(--muted); font-size:.82rem; font-weight:700; }
.ci-v { flex:1; min-width:0; }
.ci-note { margin:10px 0 0; padding-top:10px; border-top:1px dashed var(--line);
  font-size:.78rem; color:var(--muted); line-height:1.6; }
.ci-note a { color:var(--accent); }

/* 공유 — 설정 안의 링크 만들기 */
.sh-out { display:flex; flex-direction:column; gap:8px; }
.sh-url { font:inherit; font-size:.78rem; padding:10px; border:1px solid var(--line);
  border-radius:10px; background:var(--card); color:var(--muted); resize:none;
  word-break:break-all; }
.sh-btns { display:flex; gap:8px; }
.sh-btns button { flex:1; font:inherit; font-weight:700; padding:11px; border:0;
  border-radius:10px; background:var(--accent-fill); color:var(--ink); cursor:pointer; }
.sh-btns .sh-copy { background:var(--card); color:var(--accent);
  border:1px solid var(--accent); }
.sh-warn { margin:0; font-size:.8rem; color:#c92a2a; }

/* 공유 링크로 들어왔을 때 보는 화면 */
.sh-wrap { max-width:420px; margin:0 auto; padding:48px 20px; text-align:center; }
.sh-eyebrow { margin:0; font-size:.8rem; font-weight:700; color:var(--accent); }
.sh-h { margin:6px 0 10px; font-size:1.5rem; }
.sh-msg { margin:2px 0; color:var(--muted); font-size:.92rem; }
.sh-load { color:var(--muted); }
.sh-wrap button { display:block; width:100%; font:inherit; font-weight:700;
  padding:14px; margin-top:10px; border:0; border-radius:14px; cursor:pointer; }
.sh-go { background:var(--accent-fill); color:var(--ink); margin-top:22px !important; }
.sh-cancel { background:var(--card); color:var(--muted); border:1px solid var(--line) !important; }
.sh-hint { margin:16px 0 0; font-size:.78rem; color:var(--muted); line-height:1.6; }

/* 원화 환산 — 현지 금액 옆·아래에 나란히. 환율을 모르면 이 줄 자체가 없다. */
.dsp-amt { text-align:right; }
.dsp-krw { display:block; font-size:.72rem; font-weight:400; color:var(--muted); }
.dsp-tkrw { display:block; font-size:.8rem; font-weight:700; color:var(--muted); }
.slist .skrw2 { display:block; font-size:.72rem; font-weight:400; color:var(--muted); }
.slist .samt { text-align:right; }
.sp-krw { margin:-4px 0 0; font-size:.85rem; font-weight:700; color:var(--accent);
  min-height:1.2em; }
.sread { margin:14px 0 0; padding-top:10px; border-top:1px dashed var(--line);
  font-size:.8rem; color:var(--muted); }

.sh-load2 { margin:0; padding:14px 0; color:var(--muted); text-align:center; }

/* ---- 미요 캐릭터 ---- */
/* 글자 옆에 서는 기본 크기. 버튼·제목에서 라벨과 나란히 놓인다. */
.miyo { width:20px; height:20px; object-fit:contain; flex:0 0 auto;
  vertical-align:-4px; }
.panel-h .miyo, .pk-h .miyo { width:22px; height:22px; margin-right:6px; }
.day-actions .miyo { width:18px; height:18px; margin-right:4px; }
/* 빈 화면에서는 캐릭터가 주인공이라 크게 세운다. */
.miyo-lg { display:block; width:96px; height:96px; margin:0 auto 10px; }
#timeline .empty, #triplist .empty { padding:30px 16px; }
#timeline .empty p, #triplist .empty p { margin:0; }

</style>
</head>

<script>
// 저장소 계층: 여행 목록·본체·여행별 런타임 키(trip:<id>:*)를 다룬다.
// app.js의 기존 osaka-trip:v1: store와는 무관한 새 코드다.

var SCHEMA = 1;

function lsGet(key, fb) {
  try {
    var v = localStorage.getItem(key);
    return v === null ? fb : JSON.parse(v);
  } catch (e) { return fb; }
}
// 쓰기 성공 여부를 boolean으로 돌려준다. 예외가 안 났다는 것만으론 부족하다 —
// 일부 환경(프라이빗 모드 등)은 setItem이 조용히 no-op일 수 있으므로 읽어서 확인한다.
function lsSet(key, v) {
  try {
    var s = JSON.stringify(v);
    localStorage.setItem(key, s);
    return localStorage.getItem(key) === s;
  } catch (e) { return false; }
}
function lsDel(key) {
  try { localStorage.removeItem(key); } catch (e) {}
}

function newTripId() {
  return "t_" + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
}

function tripKey(id, k) { return "trip:" + id + ":" + k; }

function tripStore(id) {
  return {
    get: function (k, fb) { return lsGet(tripKey(id, k), fb); },
    set: function (k, v) { return lsSet(tripKey(id, k), v); }
  };
}

function listTrips() {
  var v = lsGet("trip:index", []);
  return Array.isArray(v) ? v : [];
}

// 본체(큰 쓰기)와 인덱스(작은 쓰기)를 나눠 쓴다. 용량 초과 등으로 본체 쓰기만 실패하고
// 인덱스 쓰기는 성공하는 경우(실제로 재현됨), 인덱스만 갱신되고 본체는 예전 값 그대로
// 남으면 목록과 본체가 서로 다른 얘기를 하게 된다(새 여행이면 목록에 loadTrip이 null인
// 고아 항목이 생기고, 수정이면 목록엔 새 제목/날짜가 보이는데 본체는 예전 값). 그래서
// 본체 쓰기가 실패하면 인덱스는 아예 건드리지 않는다.
function saveTrip(trip) {
  var okBody = lsSet("trip:" + trip.id, trip);
  if (!okBody) return false;
  var idx = listTrips();
  var row = { id: trip.id, title: trip.title, start: trip.start, end: trip.end };
  var at = -1;
  idx.forEach(function (r, i) { if (r.id === trip.id) at = i; });
  if (at >= 0) idx[at] = row; else idx.push(row);
  return lsSet("trip:index", idx);
}

function loadTrip(id) {
  return lsGet("trip:" + id, null);
}

// 일정 항목(추가·수정·삭제) 전용 저장. 인덱스 행(id/title/start/end)은 항목 편집으로
// 바뀌지 않으므로 본체만 쓴다 — saveTrip처럼 인덱스까지 같이 쓰면, 실제로는 본체 저장이
// 성공했는데 인덱스 쓰기만(용량 초과 등으로) 실패한 경우에도 saveTrip이 false를 돌려줘
// 정상 반영된 편집을 실패로 취급해버린다. 본체만 쓰면 그 모호함 자체가 없어진다.
function saveTripBody(trip) {
  return lsSet("trip:" + trip.id, trip);
}

// 여행 본체 + 그 여행의 런타임 키(trip:<id>:*) + 인덱스 항목을 모두 지운다.
function deleteTrip(id) {
  lsDel("trip:" + id);
  var prefix = tripKey(id, "");
  var doomed = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf(prefix) === 0) doomed.push(k);
  }
  doomed.forEach(lsDel);
  lsSet("trip:index", listTrips().filter(function (r) { return r.id !== id; }));
}

var LEGACY_PREFIX = "osaka-trip:v1:";
var LEGACY_KEYS = ["spend", "fx", "packing_checked", "packing_add", "weather"];

function cloneSample() {
  return JSON.parse(JSON.stringify(window.SAMPLE_TRIP));
}

// 저장에 성공하면 새 여행 id, 실패하면 null. 다른 쓰기 경로(submitTripForm,
// afterItemEdit)와 동일하게 성공 여부를 호출부에 넘긴다 — 여기서 삼키면 저장이
// 실패해도 화면은 존재하지 않는 여행으로 이동했다가 목록으로 되튕길 뿐이라
// 사용자에게 실패가 전혀 드러나지 않는다.
function installSample() {
  var t = cloneSample();
  t.id = newTripId();
  // 결제 내역은 id로 가리켜 수정·삭제한다. migrateExpenseIds는 부팅 때 한 번 도는데
  // 샘플 설치는 그보다 나중이라, 여기서 채우지 않으면 샘플의 내역은 눌러도 열리지
  // 않는다(data-id가 undefined가 된다). 데이터 파일에 id를 박아 두는 대신 설치할 때
  // 부여한다 — 샘플을 두 번 설치해도 서로 다른 id가 된다.
  (Array.isArray(t.expenses) ? t.expenses : []).forEach(function (e) {
    if (e && !e.id) e.id = newExpenseId();
  });
  return saveTrip(t) ? t.id : null;
}

// ---- 식사 메모 키: 일차 번호 → 날짜 ----
// meal 메모는 원래 meal:<n>:<i>로 저장됐는데, resyncDays는 날짜를 기준으로 일차를
// 보존하면서 n을 1부터 다시 매긴다. 그래서 시작일을 하루 앞당기기만 해도 모든 n이
// 밀려 메모가 엉뚱한 날에 붙거나(meals가 없는 날로 밀리면) 아예 화면에서 사라진다.
// 날짜는 그 일차의 안정된 식별자이므로 meal:<date>:<i>로 다시 키를 잡는다.

// trip.days에서 { 일차번호: 날짜 } 표를 만든다.
function dayDateByN(trip) {
  var m = {};
  var days = (trip && Array.isArray(trip.days)) ? trip.days : [];
  days.forEach(function (d) {
    if (d && typeof d.date === 'string' && d.date) m[String(d.n)] = d.date;
  });
  return m;
}

// 구 키(meal:<숫자>:<i>)를 새 키(meal:<날짜>:<i>)로 옮긴다. 옮길 필요가 없거나
// 옮길 수 없으면 null:
//  - meal: 로 시작하지 않는 키
//  - 가운데 조각이 숫자가 아닌 키 = 이미 날짜 기준이다(YYYY-MM-DD에는 '-'가 있다).
//    이 판정 덕분에 마이그레이션을 몇 번을 돌려도 두 번째부터는 아무 것도 하지 않는다.
//  - 그 번호에 해당하는 일차가 없는 여행(고아 메모는 건드리지 않고 남겨 둔다)
function mealMigrateKey(sub, byN) {
  var m = /^meal:([0-9]+):(.+)$/.exec(String(sub));
  if (!m) return null;
  var date = byN[m[1]];
  return date ? ("meal:" + date + ":" + m[2]) : null;
}

// 저장된 모든 여행의 구 식사 메모 키를 한 번 옮긴다. 여러 번 불러도 안전하다
// (위 mealMigrateKey가 이미 날짜 기준인 키를 걸러낸다). 새 키 쓰기가 실패하면
// 구 키를 지우지 않으므로 다음 부팅에 그대로 재시도된다. 옮긴 키 개수를 돌려준다.
function stripBuiltinSections(sections) {
  if (!Array.isArray(sections)) return [];
  return sections.filter(function (s) { return !s || s.type !== "builtin"; });
}

// 내장 섹션은 하단 탭이 됐으므로 데이터에서 걷어낸다. 재실행해도 안전하다
// (걸러낼 게 없으면 길이가 같아 쓰기를 건너뛴다).
function migrateSections() {
  var changed = 0;
  listTrips().forEach(function (row) {
    var trip = loadTrip(row.id);
    if (!trip) return;
    var next = stripBuiltinSections(trip.sections);
    if (next.length === (trip.sections || []).length) return;
    trip.sections = next;
    if (saveTripBody(trip)) changed++;
  });
  return changed;
}

function migrateMealKeys() {
  var moved = 0;
  listTrips().forEach(function (row) {
    var trip = loadTrip(row.id);
    if (!trip) return;
    var byN = dayDateByN(trip);
    var prefix = tripKey(row.id, "meal:");
    var found = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) found.push(k);
    }
    found.forEach(function (k) {
      var sub = k.slice(tripKey(row.id, "").length);
      var nk = mealMigrateKey(sub, byN);
      if (!nk || nk === sub) return;
      var target = tripKey(row.id, nk);
      // 이미 날짜 기준 값이 있으면 그쪽이 최신이다 — 구 키만 치운다.
      if (localStorage.getItem(target) !== null) { lsDel(k); moved++; return; }
      if (lsSet(target, lsGet(k, null))) { lsDel(k); moved++; }
    });
  });
  return moved;
}

// 구 osaka-trip:v1:* 를 새 여행 하나로 옮긴다. 옮길 게 없으면 null.
// 복사가 하나라도 실제로 저장되지 않았으면(예: 용량 초과) 구 키를 절대 지우지 않고,
// 이번에 만든 반쪽짜리 새 여행은 되돌린 뒤 null을 돌려준다 — 다음 부팅 때
// 구 키가 그대로 남아 있으므로 깨끗하게 재시도된다(고아 여행이 쌓이지 않는다).
function migrateLegacy() {
  var found = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf(LEGACY_PREFIX) === 0) found.push(k);
  }
  if (!found.length) return null;

  var t = cloneSample();
  t.id = newTripId();
  var ok = saveTrip(t);
  var st = tripStore(t.id);
  var byN = dayDateByN(t);
  found.forEach(function (k) {
    var sub = k.slice(LEGACY_PREFIX.length);
    // 알려진 키와 meal:<n>:<i> 형태만 옮긴다
    if (LEGACY_KEYS.indexOf(sub) >= 0 || sub.indexOf("meal:") === 0) {
      // 구 데이터의 meal 키는 일차 번호 기준이다 — 옮기는 김에 날짜 기준으로 바꿔
      // 넣는다. 그래야 migrateMealKeys와 이 함수의 실행 순서가 어느 쪽이든 결과가
      // 같다(이 함수가 먼저면 애초에 옮길 게 없고, migrateMealKeys가 먼저였다면
      // 그때는 이 여행이 아직 없었으므로 여기서 처리된다).
      // st.set을 먼저 평가해야 ok가 이미 false여도 나머지 키 복사를 계속 시도한다
      ok = st.set(mealMigrateKey(sub, byN) || sub, lsGet(k, null)) && ok;
    }
  });

  if (!ok) {
    deleteTrip(t.id);
    return null;
  }

  found.forEach(lsDel);
  return t.id;
}

// 구 경비 레코드는 통화 정보가 없다({jpy}만 있다) — 당시 앱이 엔화 전용이었으므로
// 그 여행의 기본 통화(없으면 JPY)로 채운다. 이게 유일하게 옳은 추정이다.
// 일차마다 통화가 다를 수 있어(2단계-A의 일차별 도시와 같은 사정) 금액만으로는
// 나중에 환산할 수 없으므로 cur를 함께 저장한다.
function migrateSpendRecord(rec, defCur) {
  if (!rec || typeof rec !== "object") return rec;
  if (rec.cur !== undefined || rec.amount !== undefined) return rec;
  var out = {};
  for (var k in rec) {
    if (Object.prototype.hasOwnProperty.call(rec, k) && k !== "jpy") out[k] = rec[k];
  }
  var n = Number(rec.jpy);
  out.amount = isFinite(n) ? n : 0;
  out.cur = defCur || "JPY";
  return out;
}

// 재실행해도 안전하다 — 이미 새 형식이면 아무 것도 쓰지 않는다.
function migrateSpend() {
  var changed = 0;
  listTrips().forEach(function (row) {
    var trip = loadTrip(row.id);
    if (!trip) return;
    var st = tripStore(row.id);
    var list = st.get("spend", []);
    if (!Array.isArray(list) || !list.length) return;
    var needs = list.some(function (r) { return r && r.jpy !== undefined && r.cur === undefined; });
    if (!needs) return;
    var defCur = (trip.currency && trip.currency.code) || "JPY";
    if (st.set("spend", list.map(function (r) { return migrateSpendRecord(r, defCur); }))) changed++;
  });
  return changed;
}

// ---- 가져오기 검증 ----

var MAX_IMPORT_DAYS = 366;

function isISODate(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }

// 가져온 JSON이 여행으로 쓸 만한지 본다. 문제가 있으면 사람이 읽을 수 있는
// 이유를 돌려주고, 없으면 null.
// 렌더 경로는 escHtml이 막지만, 저장 전에 구조가 깨진 값을 걸러야
// 화면이 죽거나 이상한 데이터가 영구화되는 것을 막을 수 있다.
function validateImport(o) {
  if (!o || typeof o !== "object" || Array.isArray(o)) return '여행 파일이 아닙니다.';
  if (Number(o.schema) > SCHEMA) return '더 새로운 버전에서 만든 파일입니다.';
  if (!o.title || !String(o.title).trim()) return '제목이 없습니다.';
  if (!isISODate(o.start) || !isISODate(o.end)) return '날짜 형식이 올바르지 않습니다.';
  if (o.end < o.start) return '종료일이 시작일보다 빠릅니다.';
  if (o.days !== undefined && !Array.isArray(o.days)) return '일정 데이터가 올바르지 않습니다.';
  if (Array.isArray(o.days) && o.days.length > MAX_IMPORT_DAYS) return '일정이 너무 많습니다.';
  if (o.sections !== undefined && !Array.isArray(o.sections)) return '항목 데이터가 올바르지 않습니다.';
  return null;
}

// 검증을 통과한 값을 저장 가능한 Trip으로 맞춘다. 빠진 필드를 채우고 타입을
// 바로잡으며, id는 항상 새로 준다 — 같은 파일을 두 번 가져와도 기존 여행을
// 덮어쓰지 않아야 한다.
function normalizeImport(o) {
  var t = emptyTrip({
    title: String(o.title).trim(),
    start: o.start, end: o.end,
    party: Number(o.party) >= 1 ? Number(o.party) : 2,
    hotel: typeof o.hotel === "string" ? o.hotel : ""
  });
  t.budgetKRW = isFinite(Number(o.budgetKRW)) ? Number(o.budgetKRW) : 0;
  t.place = (o.place && typeof o.place === "object") ? o.place : null;
  if (o.currency && typeof o.currency === "object" && o.currency.code) t.currency = o.currency;
  t.packing = Array.isArray(o.packing) ? o.packing.filter(function (x) { return typeof x === "string"; }) : [];
  t.expenses = Array.isArray(o.expenses) ? o.expenses.filter(function (x) { return x && typeof x === "object"; }) : [];
  t.sections = Array.isArray(o.sections) ? o.sections.filter(function (x) { return x && typeof x === "object"; }) : [];

  // 일차는 기간에서 새로 만든 뒤, 가져온 값 중 날짜가 맞는 것만 얹는다.
  if (Array.isArray(o.days)) {
    var byDate = {};
    o.days.forEach(function (d) { if (d && isISODate(d.date)) byDate[d.date] = d; });
    t.days.forEach(function (d) {
      var src = byDate[d.date];
      if (!src) return;
      d.theme = typeof src.theme === "string" ? src.theme : "";
      d.place = (src.place && typeof src.place === "object") ? src.place : null;
      d.curCode = typeof src.curCode === "string" ? src.curCode : null;
      d.items = Array.isArray(src.items) ? src.items.filter(function (x) { return x && typeof x === "object"; }) : [];
      d.meals = Array.isArray(src.meals) ? src.meals : [];
      normalizeDay(d);
    });
  }
  return t;
}

// day.meals("뭐먹지" 문구)와 그 답을 담던 meal:<date>:<i> 키를 자유 메모(notes)로 옮긴다.
// 사용자가 실제로 써 둔 답이 있으면 그것을 메모로 삼고, 비어 있으면 원래 문구를 남긴다 —
// 문구도 그 여행에서 온 데이터이므로 버리지 않고, 필요 없으면 화면에서 지우면 된다.
// 재실행해도 안전하다(meals가 비면 아무 것도 하지 않는다).
function migrateMeals() {
  var changed = 0;
  listTrips().forEach(function (row) {
    var trip = loadTrip(row.id);
    if (!trip || !Array.isArray(trip.days)) return;
    var needs = trip.days.some(function (d) { return d && Array.isArray(d.meals) && d.meals.length; });
    if (!needs) return;
    var st = tripStore(row.id);
    var doomed = [];
    trip.days.forEach(function (d) {
      if (!d || !Array.isArray(d.meals) || !d.meals.length) return;
      if (!Array.isArray(d.notes)) d.notes = [];
      d.meals.forEach(function (prompt, i) {
        var key = "meal:" + String(d.date) + ":" + i;
        var answer = String(st.get(key, "") || "").trim();
        var text = answer || String(prompt == null ? "" : prompt).trim();
        if (text) d.notes.push({ id: newNoteId(), text: text });
        doomed.push(tripKey(row.id, key));
      });
      d.meals = [];
    });
    if (!saveTripBody(trip)) return;   // 저장이 실패하면 구 키를 지우지 않는다
    doomed.forEach(lsDel);
    changed++;
  });
  return changed;
}

// 구 결제 내역에는 id가 없다(엑셀에서 온 그대로였다). 편집·삭제하려면 항목을
// 가리킬 수단이 있어야 하므로 부여한다. 재실행해도 안전하다.
function migrateExpenseIds() {
  var changed = 0;
  listTrips().forEach(function (row) {
    var trip = loadTrip(row.id);
    if (!trip || !Array.isArray(trip.expenses) || !trip.expenses.length) return;
    var needs = trip.expenses.some(function (e) { return e && !e.id; });
    if (!needs) return;
    trip.expenses.forEach(function (e) { if (e && !e.id) e.id = newExpenseId(); });
    if (saveTripBody(trip)) changed++;
  });
  return changed;
}

// ---- 동행자 공유 ----
// 서버가 없으므로 여행 데이터를 링크 자체에 담는다. '#' 뒤(fragment)는 HTTP 요청에
// 실리지 않으므로 GitHub Pages 서버도 그 내용을 보지 못한다 — 데이터가 밖으로 새지
// 않는다는 뜻이다. 대신 링크를 받은 사람은 누구나 그 여행을 볼 수 있으니, 링크 자체가
// 곧 열쇠다.
//
// 페이로드 = 마커 1글자 + base64url. 마커 '1'은 deflate-raw 압축, '0'은 압축 없음
// (CompressionStream이 없는 브라우저를 위한 폴백). 마커를 두면 나중에 방식이
// 바뀌어도 예전 링크를 계속 읽을 수 있다.

function b64urlEncode(bytes) {
  var s = '';
  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// 읽을 수 없으면 null — 남이 보낸 링크는 언제든 잘리거나 망가져 있을 수 있다.
function b64urlDecode(str) {
  try {
    var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  } catch (e) {
    return null;
  }
}

// 압축 없는 경로. 동기라 테스트에서 그대로 부를 수 있다.
function packShareSync(json) {
  return '0' + b64urlEncode(new TextEncoder().encode(String(json)));
}

function unpackShareSync(payload) {
  var p = String(payload || '');
  if (p.charAt(0) !== '0') return null;
  var bytes = b64urlDecode(p.slice(1));
  if (!bytes) return null;
  try {
    return new TextDecoder().decode(bytes);
  } catch (e) {
    return null;
  }
}

// 압축이 되면 쓰고, 안 되면 압축 없이 담는다 — 링크가 길어질 뿐 동작은 같다.
function packShare(json) {
  var raw = new TextEncoder().encode(String(json));
  if (typeof CompressionStream === 'undefined') {
    return Promise.resolve(packShareSync(json));
  }
  return new Response(
    new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))
  ).arrayBuffer().then(function (buf) {
    return '1' + b64urlEncode(new Uint8Array(buf));
  }).catch(function () {
    return packShareSync(json);
  });
}

function unpackShare(payload) {
  var p = String(payload || '');
  if (p.charAt(0) === '0') return Promise.resolve(unpackShareSync(p));
  if (p.charAt(0) !== '1') return Promise.resolve(null);
  var bytes = b64urlDecode(p.slice(1));
  if (!bytes || typeof DecompressionStream === 'undefined') return Promise.resolve(null);
  return new Response(
    new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
  ).text().catch(function () { return null; });
}

var SHARE_URL_WARN = 8000;

function shareHash(payload) { return '#/s/' + payload; }

function parseShareHash(hash) {
  var m = String(hash || '').match(/^#\/s\/(.+)$/);
  return m ? m[1] : null;
}

// 지금 주소에서 해시만 갈아 끼운다 — 배포 경로(/miyo-trip/)가 그대로 유지된다.
// 쿼리와 index.html은 떼어 낸다(링크는 짧을수록 메신저에서 잘 붙는다). 그 밖의
// 파일명은 그대로 둔다 — 떼면 그 주소로는 앱이 열리지 않는다.
function shareUrl(href, payload) {
  var base = String(href).split('#')[0].split('?')[0].replace(/index\.html$/, '');
  return base + shareHash(payload);
}

// 공유 링크로 받은 여행을 담는다. 남이 보낸 링크도 결국 외부 입력이므로 파일
// 가져오기와 똑같은 검증을 거치고, id는 항상 새로 준다(내 여행을 덮어쓰지 않는다).
function importShare(payload) {
  var json = unpackShareSync(payload);
  if (json === null) return { error: '공유 링크를 읽을 수 없습니다.', trip: null };
  return importShareJson(json);
}

function importShareJson(json) {
  var o;
  try { o = JSON.parse(json); }
  catch (e) { return { error: '공유 링크를 읽을 수 없습니다.', trip: null }; }
  var err = validateImport(o);
  if (err) return { error: err, trip: null };
  var trip = normalizeImport(o);
  if (!saveTrip(trip)) return { error: '저장에 실패했습니다. 기기 저장 공간을 확인해 주세요.', trip: null };
  return { error: null, trip: trip };
}

<script>
// Trip 스키마 헬퍼: 일차 생성, 재동기화, 기본값.
// store.js 다음에 로드된다 (SCHEMA, newTripId 사용).

var DOW = ["일", "월", "화", "수", "목", "금", "토"];
var DAY_MS = 86400000;

function dateMs(iso) { return Date.parse(iso + "T00:00:00Z"); }
function msDate(ms) { return new Date(ms).toISOString().slice(0, 10); }

// 날짜가 비었거나(손상된 저장값) 파싱 불가능하면 빈 문자열 — 던지지도, 'undefined'를
// 화면에 흘리지도 않는다(normalizeDay 주석 참고).
function dowOf(iso) {
  var ms = dateMs(iso);
  return isNaN(ms) ? '' : DOW[new Date(ms).getUTCDay()];
}
function addDays(iso, n) { return msDate(dateMs(iso) + n * DAY_MS); }
function daysBetween(a, b) { return Math.round((dateMs(b) - dateMs(a)) / DAY_MS) + 1; }

// 시차. 표에 적어 두지 않고 시간대(cities.js의 tz)로 그때그때 계산한다 —
// 서머타임이 있는 나라는 계절에 따라 달라지므로 적어 두면 반드시 틀린다.
// 그 시간대의 벽시계 시각을 읽어 UTC로 되읽으면 오프셋이 나온다.
function tzOffsetMinutes(tz, at) {
  if (!tz) return null;
  try {
    var d = at || new Date();
    var parts = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    }).formatToParts(d).forEach(function (p) { parts[p.type] = p.value; });
    // hour는 hour12:false에서도 24가 나올 수 있다(자정) — 0으로 되돌린다.
    var asUTC = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day),
                         Number(parts.hour) % 24, Number(parts.minute), Number(parts.second));
    return Math.round((asUTC - d.getTime()) / 60000);
  } catch (e) {
    return null;
  }
}

// 한국 기준 시차를 사람이 읽는 문구로. 알 수 없으면 빈 문자열(그 줄이 사라진다).
function tzDiffLabel(tz, at) {
  var there = tzOffsetMinutes(tz, at);
  var here = tzOffsetMinutes('Asia/Seoul', at);
  if (there === null || here === null) return "";
  var m = there - here;
  if (m === 0) return "한국과 같음";
  var abs = Math.abs(m), h = Math.floor(abs / 60), mm = abs % 60;
  var t = h ? h + "시간" : "";
  if (mm) t += (t ? " " : "") + mm + "분";
  return "한국보다 " + t + " " + (m > 0 ? "빠름" : "느림");
}

var _seq = 0;
function newItemId() { return "i_" + Date.now().toString(36) + (_seq++).toString(36); }
function newSectionId() { return "s_" + Date.now().toString(36) + (_seq++).toString(36); }
function newNoteId() { return "n_" + Date.now().toString(36) + (_seq++).toString(36); }
function newExpenseId() { return "e_" + Date.now().toString(36) + (_seq++).toString(36); }

// 기간을 사람이 읽는 문구로. 요약 헤더와 여행 설정 폼이 같은 문구를 쓴다 —
// 폼에서 본 것과 저장 후 헤더에서 본 것이 어긋나면 안 된다.
function nightsLabel(start, end) {
  var days = daysBetween(start, end);
  if (!(days >= 1)) return "";
  if (days === 1) return "당일치기";
  return (days - 1) + "박 " + days + "일";
}

function blankDay(n, iso) {
  return { n: n, date: iso, theme: "", place: null, curCode: null, hotel: null,
           items: [], meals: [], notes: [] };
}

// 손상된 저장값(검증 없이 가져온 JSON, 손으로 고친 localStorage)이 렌더에서 예외를
// 던지지 않게 하는 최소 보정. 지금까지는 day.items만 배열로 맞춰줬는데, 렌더가 실제로
// 메서드를 부르는 필드는 그것 말고도 셋 더 있다 — day.date(escHtml(d.date.slice(5)),
// dowOf(day.date)), day.meals(renderTimeline의 .map — views.js:225-227), item.text
// (isUndecided(it.text)). 네 필드를 같은 계약으로 한 번에 보정한다. 값을 버리지 않고
// 배열/문자열로 맞추기만 하므로 정상 데이터에는 아무 영향이 없다.
// 실제로 뭔가를 고친 경우에만(정상 데이터는 절대 안 걸림) console.warn으로 남긴다 —
// pickDay가 보정한 값은 이후 saveTripBody가 그대로 되돌려 써버려 손상이 조용히
// 영구화되므로, 최소한 콘솔에서라도 원인(어느 필드가 어떤 값이었는지)을 추적할 수 있게 한다.
function normalizeDay(day) {
  if (!day) return null;
  if (!Array.isArray(day.items)) {
    console.warn('normalizeDay: day.items가 배열이 아니어서 빈 배열로 보정함', day.items);
    day.items = [];
  }
  if (typeof day.date !== 'string') {
    console.warn('normalizeDay: day.date가 문자열이 아니어서 빈 문자열로 보정함', day.date);
    day.date = '';
  }
  if (!Array.isArray(day.meals)) {
    console.warn('normalizeDay: day.meals가 배열이 아니어서 빈 배열로 보정함', day.meals);
    day.meals = [];
  }
  if (!Array.isArray(day.notes)) {
    if (day.notes !== undefined) {
      console.warn('normalizeDay: day.notes가 배열이 아니어서 빈 배열로 보정함', day.notes);
    }
    day.notes = [];
  }
  // day.hotel은 "없으면 여행 기본값 상속"이라 null이 정상값이다 — 문자열이 아니면서
  // 비어 있지도 않은 값(가져온 JSON의 숫자·객체)만 문자열로 맞춘다.
  if (day.hotel == null) day.hotel = null;
  else if (typeof day.hotel !== 'string') {
    console.warn('normalizeDay: day.hotel이 문자열이 아니어서 문자열로 보정함', day.hotel);
    day.hotel = String(day.hotel);
  }
  day.items = day.items.filter(function (it) { return it && typeof it === 'object'; });
  day.items.forEach(function (it) {
    if (typeof it.text !== 'string') {
      console.warn('normalizeDay: item.text가 문자열이 아니어서 빈 문자열로 보정함', it.text);
      it.text = it.text == null ? '' : String(it.text);
    }
  });
  return day;
}

function buildDays(start, end) {
  var out = [], total = daysBetween(start, end);
  for (var i = 0; i < total; i++) out.push(blankDay(i + 1, addDays(start, i)));
  return out;
}

// 기간이 바뀌어도 날짜가 그대로 남는 일차의 내용은 보존한다.
function resyncDays(days, start, end) {
  var byDate = {};
  (days || []).forEach(function (d) { byDate[d.date] = d; });
  var out = [], total = daysBetween(start, end);
  for (var i = 0; i < total; i++) {
    var iso = addDays(start, i), old = byDate[iso];
    if (old) { old.n = i + 1; out.push(old); }
    else out.push(blankDay(i + 1, iso));
  }
  return out;
}

// 내장 항목(숙소·준비물·경비)은 하단 탭이 됐다. sections는 사용자가 만든 것만 담는다.
function defaultSections() {
  return [];
}


function emptyTrip(o) {
  return {
    schema: SCHEMA,
    id: newTripId(),
    title: o.title,
    start: o.start,
    end: o.end,
    party: o.party || 2,
    place: null,
    currency: { code: "KRW", symbol: "₩", decimals: 0, unit: 1 },
    hotel: o.hotel || "",
    budgetKRW: 0,
    days: buildDays(o.start, o.end),
    sections: defaultSections(),
    packing: [],
    expenses: []
  };
}

// 일차별 오버라이드 상속. 2단계(다국가·다통화)에서 렌더가 이 두 함수만 쓴다.
function dayPlace(trip, day) {
  return (day && day.place) || trip.place;
}
function dayCurrency(trip, day) {
  if (day && day.curCode) return { code: day.curCode };
  return (trip && trip.currency) || null;
}
// 숙소도 여행 중에 옮길 수 있다(오사카 3박 → 교토 2박). 상속 규칙은 도시와 같다.
function dayHotel(trip, day) {
  return (day && day.hotel) || (trip && trip.hotel) || "";
}

// unit: 표시용 단위다 — "100엔 = 900원"처럼 읽기 좋게 하기 위한 것이고,
//       계산은 언제나 1단위 기준으로 한다.
var CURRENCIES = [
  { code: "KRW", symbol: "₩",     decimals: 0, unit: 1,    name: "원" },
  { code: "JPY", symbol: "¥",     decimals: 0, unit: 100,  name: "엔" },
  { code: "USD", symbol: "$",     decimals: 2, unit: 1,    name: "달러" },
  { code: "EUR", symbol: "€",     decimals: 2, unit: 1,    name: "유로" },
  { code: "VND", symbol: "₫",     decimals: 0, unit: 1000, name: "동" },
  { code: "THB", symbol: "฿",     decimals: 2, unit: 1,    name: "바트" },
  { code: "TWD", symbol: "NT$",   decimals: 0, unit: 1,    name: "대만 달러" },
  { code: "CNY", symbol: "¥",     decimals: 2, unit: 1,    name: "위안" },
  { code: "HKD", symbol: "HK$",   decimals: 2, unit: 1,    name: "홍콩 달러" },
  { code: "SGD", symbol: "S$",    decimals: 2, unit: 1,    name: "싱가포르 달러" },
  { code: "PHP", symbol: "₱",     decimals: 2, unit: 1,    name: "페소" },
  { code: "MYR", symbol: "RM",    decimals: 2, unit: 1,    name: "링깃" },
  { code: "IDR", symbol: "Rp",    decimals: 0, unit: 1000, name: "루피아" },
  { code: "MOP", symbol: "MOP$",  decimals: 2, unit: 1,    name: "파타카" },
  { code: "KHR", symbol: "៛",     decimals: 0, unit: 1000, name: "리엘" },
  { code: "LAK", symbol: "₭",     decimals: 0, unit: 1000, name: "킵" },
  { code: "GBP", symbol: "£",     decimals: 2, unit: 1,    name: "파운드" },
  { code: "AUD", symbol: "A$",    decimals: 2, unit: 1,    name: "호주 달러" },
  { code: "CHF", symbol: "CHF",   decimals: 2, unit: 1,    name: "프랑" },
  { code: "INR", symbol: "₹",     decimals: 2, unit: 1,    name: "루피" },
  { code: "CZK", symbol: "Kč",    decimals: 2, unit: 1,    name: "코루나" },
  { code: "TRY", symbol: "₺",     decimals: 2, unit: 1,    name: "리라" },
  { code: "AED", symbol: "AED",   decimals: 2, unit: 1,    name: "디르함" }
];

// 목록에 없는 코드도 쓸 수 있게 한다 — 환율 API는 166개 통화를 주는데
// 프리셋을 그만큼 들고 있을 이유가 없다.
function currencyByCode(code) {
  var c = String(code || "").toUpperCase();
  var found = CURRENCIES.filter(function (x) { return x.code === c; })[0];
  if (found) return found;
  return { code: c, symbol: c, decimals: 2, unit: 1, name: c };
}

function defaultCurrency() { return currencyByCode("KRW"); }

function fmtAmount(amount, cur) {
  var c = cur || defaultCurrency();
  var n = Number(amount);
  if (!isFinite(n)) n = 0;
  return c.symbol + n.toLocaleString('ko-KR', {
    minimumFractionDigits: c.decimals, maximumFractionDigits: c.decimals
  });
}

// rates는 1 KRW당 해당 통화다(open.er-api.com, base=KRW 실측).
// 예: rates.JPY = 0.111682 → 1원 = 0.111682엔 → 원화 = 금액 / rates.JPY
function toKRW(amount, code, rates) {
  var c = String(code || "").toUpperCase();
  var n = Number(amount);
  if (!isFinite(n)) return null;
  if (c === "KRW") return Math.round(n);
  var r = rates && Number(rates[c]);
  if (!r || !isFinite(r)) return null;
  return Math.round(n / r);
}

function fmtKRW(krw) {
  var n = Number(krw);
  if (!isFinite(n)) n = 0;
  return n.toLocaleString('ko-KR') + '원';
}

// 통화별 합계. 한 여행에 여러 통화가 섞이면 단일 합계는 의미가 없다.
// 등장 순서를 유지한다 — 목록에서 본 순서와 어긋나면 읽기 어렵다.
function spendTotals(list) {
  var m = {}, order = [];
  (list || []).forEach(function (e) {
    if (!e) return;
    var cur = e.cur || "KRW";
    var n = Number(e.amount);
    if (!isFinite(n)) n = 0;
    if (!Object.prototype.hasOwnProperty.call(m, cur)) { m[cur] = 0; order.push(cur); }
    m[cur] += n;
  });
  return order.map(function (cur) { return { cur: cur, amount: m[cur] }; });
}

var SPEND_CATS = ["식비", "교통", "쇼핑", "관광", "기타"];

// 분류별 집계에 통화 축이 붙는다 — 같은 '식비'라도 엔과 달러를 더할 수 없다.
function spendByCat(list) {
  var m = {}, keys = [];
  (list || []).forEach(function (e) {
    if (!e) return;
    var cur = e.cur || "KRW";
    var k = e.cat + "␀" + cur;
    var n = Number(e.amount);
    if (!isFinite(n)) n = 0;
    if (!Object.prototype.hasOwnProperty.call(m, k)) { m[k] = 0; keys.push(k); }
    m[k] += n;
  });
  // 분류는 SPEND_CATS 순서로, 같은 분류 안에서는 통화 등장 순서로.
  return keys.map(function (k) {
    var p = k.split("␀");
    return { cat: p[0], cur: p[1], amount: m[k] };
  }).sort(function (a, b) {
    var ai = SPEND_CATS.indexOf(a.cat), bi = SPEND_CATS.indexOf(b.cat);
    if (ai !== bi) return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    return 0;
  });
}

function spendByDate(list) {
  var m = {}, dates = [];
  (list || []).forEach(function (e) {
    if (!e) return;
    if (!m[e.date]) { m[e.date] = []; dates.push(e.date); }
    m[e.date].push(e);
  });
  dates.sort().reverse();
  return dates.map(function (d) {
    return { date: d, items: m[d].slice().reverse() };
  });
}

// 도시를 고르면 그 나라 통화를 자동으로 맞추기 위한 표.

var COUNTRY_CURRENCY = {

  // 유로존
  AT:"EUR", BE:"EUR", CY:"EUR", DE:"EUR", EE:"EUR", ES:"EUR", FI:"EUR",
  FR:"EUR", GR:"EUR", HR:"EUR", IE:"EUR", IT:"EUR", LT:"EUR", LU:"EUR",

  MC:"EUR", AD:"EUR", SM:"EUR", VA:"EUR", ME:"EUR", XK:"EUR",
  // 미국 달러를 그대로 쓰는 곳

};

// 모르는 나라면 null — 호출부가 통화를 건드리지 않는다.
function currencyForCountry(cc) {
  var k = String(cc || "").toUpperCase();
  var code = COUNTRY_CURRENCY[k];
  return code ? currencyByCode(code) : null;
}

// 새 여행에서 나라를 먼저 고르면 통화가 따라온다 — 통화 코드를 외우는 것보다

// COUNTRY_CURRENCY에서 통화를 끌어와 합쳐 준다.
function countryByCode(cc) {
  var k = String(cc || "").toUpperCase();
  var row = COUNTRIES.filter(function (c) { return c.cc === k; })[0];
  if (!row) return null;
  return { cc: row.cc, name: row.name, cur: COUNTRY_CURRENCY[row.cc] };
}

// 나라별 도시 목록(cities.js). 지오코딩은 나라만으로 도시를 나열해 주지 못하므로
// 미리 구워 둔 목록에서 고르게 한다 — 목록에 없으면 직접 입력하고 검색하면 된다.
function citiesOf(cc) {
  var k = String(cc || "").toUpperCase();
  var list = (typeof CITIES !== "undefined" && CITIES) ? CITIES[k] : null;
  return Array.isArray(list) ? list : [];
}

// 목록의 도시를 그대로 place로 쓴다. 나라 코드를 붙여야 통화 자동 선택이 이어진다.
function cityToPlace(city, cc) {
  if (!city) return null;
  var c = countryByCode(cc);
  return {
    name: city.name,
    country: c ? c.name : undefined,
    cc: String(cc || "").toUpperCase(),
    lat: city.lat, lon: city.lon, tz: city.tz
  };
}
